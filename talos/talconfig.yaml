# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://10.57.57.88:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "10.57.57.88"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "kubernetes-1"
    ipAddress: "10.57.57.80"
    installDisk: "/dev/sda"
    controlPlane: true
    machineSpec:
      secureboot: false
    # The only node. Iris Xe passthrough for Jellyfin QuickSync (i915 +
    # intel-ucode), plus the two extensions Longhorn needs on any node:
    # iscsi-tools for iscsiadm and util-linux-tools. Without them
    # longhorn-manager crashloops and no volume can attach.
    # Regenerate with the POST in docs/operations.md.
    talosImageURL: factory.talos.dev/installer/249d9135de54962744e917cfe654117000cba369f9152fbab9d055a00aa3664f
    nodeLabels:
      node.kubernetes.io/exclude-from-external-load-balancers: ""
      # Read by intel-device-plugin-operator's DaemonSet, which exposes
      # gpu.intel.com/i915 — what both Jellyfin instances request. No Node
      # Feature Discovery runs here, so the label is placed by hand.
      intel.feature.node.kubernetes.io/gpu: "true"
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:00:57:81"
        dhcp: false
        addresses:
          - "10.57.57.80/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.57.57.1"
        mtu: 1500
        vip:
          ip: "10.57.57.88"
  # One node, deliberately. Two control planes cannot form a quorum and there
  # is no third fault domain, so this is the honest shape — recovery is a
  # restore, not a failover. See talos/SINGLE-NODE.md.
  # The 3-node blocks that used to sit here were removed 2026-09-01; their VMs
  # had been gone since August. Git has them: `git show 793bf33:talos/talconfig.yaml`.

# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-longhorn.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/admission-controller-patch.yaml"
    - "@./patches/controller/cluster.yaml"

# No worker patches: there are no workers. machine-longhorn-labels.yaml is
# unused — the `longhorn: "true"` label it carries is read by nothing.
