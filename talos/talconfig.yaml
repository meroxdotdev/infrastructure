# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://10.57.57.88:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "10.57.57.88"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "kubernetes-controlplane-1"
    ipAddress: "10.57.57.80"
    installDisk: "/dev/sda"
    nodeLabels:
      node.kubernetes.io/exclude-from-external-load-balancers: ""
    machineSpec:
      secureboot: false
    # intel-ucode for the Xeon, plus the two extensions Longhorn needs on every
    # node. The Nvidia LTS extensions were dropped 2026-09-01 with the Quadro:
    # transcoding runs on px-0's iGPU and nothing requested nvidia.com/gpu any
    # more. See docs/gpu-transcoding.md.
    talosImageURL: factory.talos.dev/installer/36cd6536eaec8ba802be2d38974108359069cedba8857302f69792b26b87c010
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:a7:ba:13"
        dhcp: false
        addresses:
          - "10.57.57.80/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.57.57.1"
        mtu: 1500
        vip:
          ip: "10.57.57.88"
  - hostname: "kubernetes-worker-1"
    ipAddress: "10.57.57.81"
    installDisk: "/dev/sda"
    controlPlane: false
    machineSpec:
      secureboot: false
    # Iris Xe passthrough for Jellyfin QuickSync (i915 + intel-ucode), plus the
    # two extensions Longhorn needs on the host: iscsi-tools for iscsiadm and
    # util-linux-tools. Without them longhorn-manager crashloops on this node
    # and no Longhorn volume can attach here. Same set the control plane runs —
    # diff against `talosctl get extensions` there before changing it.
    # Regenerate with the POST in docs/operations.md.
    talosImageURL: factory.talos.dev/installer/249d9135de54962744e917cfe654117000cba369f9152fbab9d055a00aa3664f
    nodeLabels:
      # Consumed by intel-device-plugin-operator, which exposes
      # gpu.intel.com/i915. Set ahead of the operator being restored from
      # 6bb0f3d^ — a label with no consumer is inert.
      intel.feature.node.kubernetes.io/gpu: "true"
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:00:57:81"
        dhcp: false
        addresses:
          - "10.57.57.81/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.57.57.1"
        mtu: 1500
  # --- SINGLE-NODE since 2026-08-17 ------------------------------------------
  # Nodes 2 and 3 were removed from etcd and Kubernetes and their VMs deleted.
  # See talos/SINGLE-NODE.md; uncomment both blocks to roll back to three.
  #
  # Their VMs no longer exist, so a rollback must recreate them first — the
  # exact `qm create` lines are in SINGLE-NODE.md's "VM recreation spec".
  #
  # ⚠ The MAC below for controlplane-2 does NOT match the VM that was actually
  # running (BC:24:11:43:4E:63), most likely drift from an earlier DR test on
  # different hardware. deviceSelector matches on MAC, so reconcile the two
  # before applying, or the node boots with no address. controlplane-3's MAC was never verified
  # against a live VM.
  #
  # - hostname: "kubernetes-controlplane-2"
  #   ipAddress: "10.57.57.82"
  #   installDisk: "/dev/sda"
  #   machineSpec:
  #     secureboot: false
  #   talosImageURL: factory.talos.dev/installer/8d37fcc01bb9173406853e7fd97ad9eda40732043f88e09dafe55e53fcf4b510
  #   controlPlane: true
  #   networkInterfaces:
  #     - deviceSelector:
  #         hardwareAddr: "bc:24:11:a5:4b:9e"
  #       dhcp: false
  #       addresses:
  #         - "10.57.57.82/24"
  #       routes:
  #         - network: "0.0.0.0/0"
  #           gateway: "10.57.57.1"
  #       mtu: 1500
  #       vip:
  #         ip: "10.57.57.88"
  # - hostname: "kubernetes-controlplane-3"
  #   ipAddress: "10.57.57.84"
  #   installDisk: "/dev/sda"
  #   machineSpec:
  #     secureboot: false
  #   talosImageURL: factory.talos.dev/installer/8d37fcc01bb9173406853e7fd97ad9eda40732043f88e09dafe55e53fcf4b510
  #   controlPlane: true
  #   networkInterfaces:
  #     - deviceSelector:
  #         hardwareAddr: "bc:24:11:96:87:40"
  #       dhcp: false
  #       addresses:
  #         - "10.57.57.84/24"
  #       routes:
  #         - network: "0.0.0.0/0"
  #           gateway: "10.57.57.1"
  #       mtu: 1500
  #       vip:
  #         ip: "10.57.57.88"
  # ---------------------------------------------------------------------------

# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-longhorn.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/admission-controller-patch.yaml"
    - "@./patches/controller/cluster.yaml"

# Worker patches
#worker:
#  patches:
#    - "@./patches/global/machine-longhorn-labels.yaml"
