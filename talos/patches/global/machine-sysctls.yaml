machine:
  sysctls:
    fs.inotify.max_user_watches: "1048576" # Watchdog
    fs.inotify.max_user_instances: "8192"  # Watchdog
    net.core.rmem_max: "7500000" # Cloudflared | QUIC
    net.core.wmem_max: "7500000" # Cloudflared | QUIC
    # BBR for the long paths out of the house (cloudflared, the VPS at 165 ms
    # RTT): measured 30 Mbps with CUBIC against 103 Mbps with BBR on the same
    # tunnel. No effect on LAN traffic, where below 1 ms RTT the two behave
    # alike. Needs no fq qdisc (TCP paces internally since 4.13). Pods inherit
    # it at netns creation, so running workloads need a rollout restart.
    net.ipv4.tcp_congestion_control: "bbr"
