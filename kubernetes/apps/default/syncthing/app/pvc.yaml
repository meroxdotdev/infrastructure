---
# Bound to the static PV `syncthing` in storage/restore-pvs/pvs.yaml, so DR
# restores into the same name. In the `backup` group: Longhorn → Garage on
# the NAS → vault → Oracle, like every other app volume worth keeping.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing
  namespace: default
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 40Gi
