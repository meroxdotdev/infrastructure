---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# The cluster's member of the shared Sync folder: a trusted, full copy at
# home, and the one that reaches the backup chain. Peers: the MacBook and the
# iPhone (trusted) and the VPS (encrypted only). Discovery and relays are off;
# peers dial each other by address over the LAN and the tailnet.
#
# No route and no GUI outside the pod: the GUI is reached with
#   kubectl -n default port-forward deploy/syncthing 8384
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      syncthing:
        # One writer for an RWO volume.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/syncthing/syncthing
              tag: 2.1.5@sha256:397aa00b92b48d65540ea3ae3cbf271b87bdccbe07a0b7bd7d2debc3a7b29138
            env:
              STGUIADDRESS: 0.0.0.0:8384
              STNOUPGRADE: "1"
              TZ: Europe/Bucharest
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: &gui 8384
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *gui
      sync:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${LB_IP_SYNCTHING}
        ports:
          sync-tcp:
            port: 22000
            protocol: TCP
          sync-udp:
            port: 22000
            protocol: UDP
    persistence:
      data:
        existingClaim: syncthing
        globalMounts:
          - path: /var/syncthing
      tmp:
        type: emptyDir
