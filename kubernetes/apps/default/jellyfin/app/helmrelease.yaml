---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        # Intel QuickSync on the Beelink's Iris Xe, via kubernetes-worker-1.
        # No runtimeClassName: unlike Nvidia, which needs a containerd runtime
        # handler, the Intel plugin just injects /dev/dri into the container.
        # See proxmox/px-0/README.md.
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
            env:
              TZ: Europe/Bucharest
              JELLYFIN_PublishedServerUris: all=https://media.merox.dev
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 8Gi
    defaultPodOptions:
      # Prefer the node with the iGPU, but do not require it. A hard
      # gpu.intel.com/i915 request would pin Jellyfin to px-0 and leave it
      # Pending whenever that host is down or in maintenance. Playback matters
      # more than transcoding: on pve it falls back to software.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: intel.feature.node.kubernetes.io/gpu
                    operator: In
                    values: ["true"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Vestigial: the `video` group, from the pre-2026-07 Intel setup. Talos
        # ships /dev/dri/renderD128 as 0666, so nothing needs it. Harmless,
        # kept only so its absence is not mistaken for a regression.
        supplementalGroups: [44]
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          #          - "{{ .Release.Name }}.k8s.merox.dev"
          - "media.merox.dev"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      # The render node itself, instead of a device-plugin resource. Talos
      # ships /dev/dri/renderD128 as 0666, so no capabilities or supplementary
      # groups are needed. DirectoryOrCreate is what makes the fallback work:
      # on a node without a GPU the mount is an empty directory, Jellyfin finds
      # no QSV device and transcodes in software rather than refusing to start.
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /dev/dri
      config:
        existingClaim: jellyfin
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: jellyfin-cache
        globalMounts:
          - path: /config/metadata
      media:
        type: nfs
        server: ${NFS_SERVER}
        path: /media/library
        globalMounts:
          - path: /media
            readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          jellyfin:
            app:
              - path: /cache
                subPath: cache
              - path: /config/log
                subPath: log
              - path: /tmp
                subPath: tmp
