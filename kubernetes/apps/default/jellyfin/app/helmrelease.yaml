---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        # Intel QuickSync on the Beelink's Iris Xe, via kubernetes-1.
        # No runtimeClassName: unlike Nvidia, which needs a containerd runtime
        # handler, the Intel plugin just injects /dev/dri into the container.
        # See proxmox/px-0/README.md.
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
            env:
              TZ: Europe/Bucharest
              JELLYFIN_PublishedServerUris: all=https://media.merox.dev
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                # Declared on purpose. With only a limit set, Kubernetes copies
                # it into the request, so the 8Gi ceiling below became an 8Gi
                # reservation - on a 32Gi node that is a quarter of it, held for
                # a pod whose steady state is a few hundred MB. It scheduled
                # fine for months and then could not get back in after a restart
                # on 2026-09-03, with the node at 98% requested and ~25% used.
                memory: 1Gi
              limits:
                # Pins Jellyfin to kubernetes-1 — only px-0 has an
                # Intel GPU. A /dev/dri hostPath was tried instead so it could
                # fall back to pve; it cannot work, the container device cgroup
                # denies open() on char 226:128 regardless of file mode. During
                # px-0 maintenance, drop this request to let Jellyfin run
                # anywhere on software transcoding — see docs/gpu-transcoding.md.
                gpu.intel.com/i915: 1
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Vestigial: the `video` group, from the pre-2026-07 Intel setup. Talos
        # ships /dev/dri/renderD128 as 0666, so nothing needs it. Harmless,
        # kept only so its absence is not mistaken for a regression.
        supplementalGroups: [44]
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          #          - "{{ .Release.Name }}.k8s.merox.dev"
          - "media.merox.dev"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      config:
        existingClaim: jellyfin
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: jellyfin-cache
        globalMounts:
          - path: /config/metadata
      media:
        type: nfs
        server: ${NFS_SERVER}
        path: /media/library
        globalMounts:
          - path: /media
            readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          jellyfin:
            app:
              - path: /cache
                subPath: cache
              - path: /config/log
                subPath: log
              - path: /tmp
                subPath: tmp
