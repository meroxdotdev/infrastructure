# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-definitions.json
# NOTE: Fill HOMEPAGE_VAR_HEALTHCHECKS_KEY with a **read-only** API key from
# healthchecks.io (Project Settings → API keys → read-only). Read-only is
# enough: the Backups card lists check states, it never pings or edits.
# Then run:
#   sops --encrypt --in-place kubernetes/apps/default/homepage/app/secret.sops.yaml
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: homepage-secret
stringData:
  HOMEPAGE_VAR_HEALTHCHECKS_KEY: REPLACE-ME
