---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
---
# Read-only, cluster-wide. The kubernetes widget lists nodes and pods to show
# cluster CPU/memory; it never writes. Scoped to `get/list/watch` so a
# compromised dashboard cannot change anything — the same reason Portainer's
# cluster agent was removed on 2026-09-07 for holding a standing cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: default
