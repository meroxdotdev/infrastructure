---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      homepage:
        annotations:
          # The config lives in a ConfigMap, so a config change has to restart
          # the pod — Homepage reads its YAML once at boot.
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: homepage
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.2.0
            env:
              TZ: Europe/Bucharest
              # Required since v1. Homepage refuses requests whose Host header
              # is not listed, which is what makes it safe to serve without its
              # own auth: only the gateway's hostname reaches it.
              HOMEPAGE_ALLOWED_HOSTS: home.k8s.merox.dev
            envFrom:
              # Holds HOMEPAGE_VAR_HEALTHCHECKS_KEY. Optional so the pod starts
              # without it — until the secret exists the Backups card shows an
              # error rather than a false green, which is the safe direction
              # for a backup indicator. Create it with:
              #   healthchecks.io -> project settings -> API keys -> read-only
              - secretRef:
                  name: homepage-secret
                  optional: true
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    # kubelet sends the pod IP as Host, which HOMEPAGE_ALLOWED_HOSTS
                    # rejects — the probe then fails while the app is fine. Send the
                    # real hostname instead of widening the allow-list, which is the
                    # setting that makes it safe to serve this without its own auth.
                    httpHeaders:
                      - name: Host
                        value: home.k8s.merox.dev
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: homepage
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          # Not `homepage` — that name is taken by the one on vps01, and two
          # dashboards answering to the same word is how you end up unsure
          # which you are looking at.
          - home.k8s.merox.dev
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      config:
        type: configMap
        name: homepage-config
        globalMounts:
          - path: /app/config/settings.yaml
            subPath: settings.yaml
          - path: /app/config/services.yaml
            subPath: services.yaml
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
          - path: /app/config/docker.yaml
            subPath: docker.yaml
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
          - path: /app/config/proxmox.yaml
            subPath: proxmox.yaml
          - path: /app/config/custom.css
            subPath: custom.css
          - path: /app/config/custom.js
            subPath: custom.js
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
