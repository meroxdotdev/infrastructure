---
# Postgres 15 data, kept after the 2026-09-05 move to Postgres 17. A major
# upgrade cannot happen in place - the on-disk format is version-specific - so
# the new server got its own claim and this one was left untouched. That makes
# rollback a one-line change back to `immich-postgres` rather than a restore.
# Delete it once 17 has proven itself; nothing references it today.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: default
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/media: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# Live Postgres 17 data. Same size and the same nightly Longhorn->Garage
# recurring job as the claim above.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-17
  namespace: default
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/media: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# SSD (rpool via Longhorn, not the SAS media pool). Replaced a static NFS
# PV/PVC pointing at media/photos/upload — random photo access all day would
# have defeated the SAS pool's spin-down. RWO is fine: immich-server runs a
# single replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-ssd
  namespace: default
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/media: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
# SSD migration target for the read-only external library (migrated Synology
# Photos import), replaces the NFS external-library mount in helmrelease.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-external-library-ssd
  namespace: default
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/media: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # 10Gi -> 40Gi on 2026-08-20, when ~12 GB of photos moved here from the
      # Synology documents share on their way out of Filebrowser.
      # A PVC can only grow: shrinking this number makes Flux fail its dry-run
      # with "can not be less than status.capacity" and the whole Kustomization
      # stops reconciling. Raise it here first, never with kubectl patch.
      storage: 40Gi
