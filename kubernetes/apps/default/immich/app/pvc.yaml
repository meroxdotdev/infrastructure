---
# Postgres data. Bound to the static PV of the same name in
# kubernetes/apps/storage/restore-pvs/pvs.yaml, like the two library claims.
# The nightly pg_dump to the NAS is the second, storage-agnostic copy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: default
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# Immich's own library: uploads, thumbnails, encodes. RWO is fine:
# immich-server runs a single replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: default
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
# The read-only external library (the migrated Synology Photos import).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-external-library
  namespace: default
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # 10Gi -> 40Gi on 2026-08-20, when ~12 GB of photos moved here from the
      # Synology documents share on their way out of Filebrowser.
      # A PVC can only grow: shrinking this number makes Flux fail its dry-run
      # with "can not be less than status.capacity" and the whole Kustomization
      # stops reconciling. Raise it here first, never with kubectl patch.
      storage: 40Gi
