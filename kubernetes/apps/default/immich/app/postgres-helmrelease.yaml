---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Standalone Postgres + VectorChord (not CNPG) — this is the only app in the
# cluster needing a database, so a single-instance Postgres matches this
# cluster's low-complexity style better than a full HA operator. See
# docs/immich-post-restore.md for one-time extension setup after first boot.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-postgres
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      immich-postgres:
        containers:
          app:
            # Immich builds this image for exactly this case: a standalone
            # Postgres, outside any operator, with the extensions it requires.
            #
            # The previous image, ghcr.io/tensorchord/cloudnative-vectorchord,
            # was built for CloudNativePG, which supplies the
            # container command itself. From tag 0.5.3 on it stopped shipping
            # an entrypoint at all, so 0.5.0 was the last version this
            # deployment could ever run - a ceiling that would have become an
            # emergency the day Immich raised its minimum above it. Immich
            # v3.0.0 wants VectorChord >=0.3 <2 and pgvector >=0.5 <1
            # (server/src/constants.ts).
            #
            # The extension versions are still not something Renovate can bump:
            # it splits a docker tag at the first hyphen, so `17` is the version
            # and `vectorchord1.1.1-pgvector0.8.5` is an opaque compatibility
            # suffix it carries forward untouched. What changes is that the tag
            # now states both versions instead of hiding them, so the drift is
            # visible to a human reading this file. Check them against Immich's
            # constants when its major moves.
            #
            # No args here on purpose. The image's command already carries
            # `-c config_file=/etc/postgresql/postgresql.conf`, and overriding
            # it would drop that flag. shared_preload_libraries = 'vchord.so'
            # is set inside that config, so it no longer needs passing in.
            image:
              repository: ghcr.io/immich-app/postgres
              tag: 17-vectorchord1.1.1-pgvector0.8.5
            env:
              # Picks /var/postgresql-conf-tpl/postgresql.ssd.conf. Defaults to
              # SSD anyway; stated because it is a real choice - the Longhorn
              # volume behind this lives on the rpool mirror, not the SAS array.
              DB_STORAGE_TYPE: SSD
              POSTGRES_USER: immich
              POSTGRES_DB: immich
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-secret
                    key: password
              PGDATA: /var/lib/postgresql/data/pgdata
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "immich"]
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            # This image's entrypoint starts as root: it stats the filesystem
            # under PGDATA, writes /etc/postgresql/postgresql.conf from a
            # template, then hands over to the stock postgres entrypoint, which
            # chowns the data directory and drops to uid 999 itself. Dropping
            # every capability would break that handover - chown and the setuid
            # to postgres both fail - so the five it actually uses are added
            # back and nothing else.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    defaultPodOptions:
      # No runAsNonRoot/runAsUser here, unlike everything else in this cluster:
      # the entrypoint described above has to begin as root. It does not stay
      # there - postgres itself runs as 999, the same uid as before, so the
      # existing data directory needs no ownership change. fsGroup still
      # applies to the volume.
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 5432
    persistence:
      data:
        existingClaim: immich-postgres-17
        globalMounts:
          - path: /var/lib/postgresql/data
