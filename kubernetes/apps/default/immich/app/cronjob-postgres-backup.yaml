---
# Nightly pg_dump of Immich's Postgres. The DB itself is small (1-3GB) but
# holds real metadata (albums, face tags, favorites, sharing links) that
# isn't just derived from the photo files — worth a real backup even though
# a full HA operator (CNPG) wasn't justified for a single-instance DB.
# 00:02 UTC. The time no longer has to line up with anything: the dump lands on
# the NAS, which is always on, and the vault pulls whatever is newest.
#
# The NAS keeps the latest dump only, written atomically (.part, then mv) so an
# interrupted run never replaces a good dump with half of one. History is the
# vault's job — see docs/plan-nas-hot-r730-cold.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-postgres-backup
  namespace: default
spec:
  schedule: "2 0 * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: pg-dump
              image: postgres:18-alpine
              env:
                - name: PGHOST
                  value: immich-postgres
                - name: PGUSER
                  value: immich
                - name: PGDATABASE
                  value: immich
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-secret
                      key: password
                # healthchecks.io ping URL (dead-man's-switch) - empty until
                # the check is created and this is filled in via sops.
                - name: HC_URL
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-secret
                      key: hc_ping_url
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  trap '[ -n "$HC_URL" ] && wget -q -T 10 -O /dev/null "$HC_URL/fail"' ERR
                  pg_dump | gzip > /nas/immich-postgres/immich.sql.gz.part
                  mv /nas/immich-postgres/immich.sql.gz.part /nas/immich-postgres/immich.sql.gz
                  # TEMPORARY, remove in phase 7 with the r730xd volume: the
                  # R730xd's restic run is still the off-site path. Dated
                  # copies, 30 days, as before.
                  cp /nas/immich-postgres/immich.sql.gz "/r730xd/immich-postgres/immich-$(date +%Y-%m-%d).sql.gz"
                  find /r730xd/immich-postgres -name '*.sql.gz' -mtime +30 -delete
                  [ -n "$HC_URL" ] && wget -q -T 10 -O /dev/null "$HC_URL"
                  exit 0
              volumeMounts:
                - name: nas
                  mountPath: /nas
                - name: r730xd
                  mountPath: /r730xd
          volumes:
            - name: nas
              nfs:
                server: ${NAS_SERVER}
                path: /volume1/backups
            - name: r730xd
              nfs:
                server: ${NFS_SERVER}
                path: /media/backups
