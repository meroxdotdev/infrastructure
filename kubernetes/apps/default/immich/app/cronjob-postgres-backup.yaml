---
# Nightly pg_dump of Immich's Postgres. The DB itself is small (1-3GB) but
# holds real metadata (albums, face tags, favorites, sharing links) that
# isn't just derived from the photo files — worth a real backup even though
# a full HA operator (CNPG) wasn't justified for a single-instance DB.
# Schedule is UTC (K8s cluster nodes run UTC, not pve's EEST) — 3:02 UTC =
# 03:02 EEST, right after pfSense's own fixed 03:00 push to pve. Keeps the
# whole nightly SAS backup window compact (~02:55-03:20) so hd-idle only
# spins the media pool disks up once a night instead of cycling on gaps.
# Got this wrong once already (set "2 3" thinking it was already EEST -
# actually landed at 06:02 EEST, 3h late, so restic's 03:10 offsite push
# was always grabbing yesterday's dump). Verify against real EEST wall
# clock time after any change, not just the cron string.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-postgres-backup
  namespace: default
spec:
  schedule: "2 0 * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: pg-dump
              image: postgres:18-alpine
              env:
                - name: PGHOST
                  value: immich-postgres
                - name: PGUSER
                  value: immich
                - name: PGDATABASE
                  value: immich
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-secret
                      key: password
                # healthchecks.io ping URL (dead-man's-switch) - empty until
                # the check is created and this is filled in via sops.
                - name: HC_URL
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-secret
                      key: hc_ping_url
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  trap '[ -n "$HC_URL" ] && wget -q -T 10 -O /dev/null "$HC_URL/fail"' ERR
                  DEST=/backups/immich-postgres
                  # `mkdir -p` on an already-existing dir can return EACCES
                  # instead of a no-op on this NFS share (ACL denies creating
                  # new subdirectories for this uid, even though writing files
                  # into an existing one is fine) — only call mkdir when the
                  # dir is actually missing.
                  [ -d "$DEST" ] || mkdir -p "$DEST"
                  FILE="$DEST/immich-$(date +%Y-%m-%d).sql.gz"
                  pg_dump | gzip > "$FILE"
                  find "$DEST" -name '*.sql.gz' -mtime +30 -delete
                  [ -n "$HC_URL" ] && wget -q -T 10 -O /dev/null "$HC_URL"
                  exit 0
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              nfs:
                server: ${NFS_SERVER}
                path: /media/backups
