---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-public
  namespace: default
  # Backed up since 2026-08-30, for the movie list as much as the config. The
  # list is the shopping list: after losing the SSD pool a restored instance
  # re-acquires everything on its own, where a rebuilt-from-scratch one leaves
  # you trying to remember what was in the library.
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/media: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-public-cache
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
