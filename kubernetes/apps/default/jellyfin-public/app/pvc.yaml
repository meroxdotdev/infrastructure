---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-public
  namespace: default
  # Backed up since 2026-08-30. It was left out while this instance was two
  # accounts and a path, which was genuinely rebuildable in minutes. It now
  # also carries the QuickSync setting, Known Proxies, the pasted branding and
  # the API key radarr-public authenticates with - and the transcoder setting
  # in particular fails silently, falling back to software transcoding that
  # saturates whichever node the pod is on.
  #
  # The films are still not backed up. They are derived data and the chain
  # ends on a 2x2TB Synology; radarr-public's own PVC carries the list, which
  # turns a total loss into a re-download rather than an act of memory.
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/media: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# Metadata cache. Not in the backup group: it is regenerable, and Jellyfin
# rebuilds it on demand after a restore.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-public-cache
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
