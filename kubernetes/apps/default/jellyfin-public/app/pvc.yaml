---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-public
  namespace: default
  # Deliberately NOT in the Longhorn backup group, unlike the personal
  # instance. Everything here is reconstructible in minutes: two accounts and
  # one library pointing at a path. The films themselves are derived data
  # regenerated by re-encoding, and are not backed up either. Adding it to the
  # backup set would also mean touching the DR restore task, which pins volume
  # names one by one - cost with no recovery value.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# Metadata cache. Not in the backup group: it is regenerable, and Jellyfin
# rebuilds it on demand after a restore.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-public-cache
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
