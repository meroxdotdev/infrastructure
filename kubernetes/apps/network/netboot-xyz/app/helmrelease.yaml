---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# PXE boot menu (Linux installers/rescue ISOs + Windows via WinPE chainload
# once configured). LAN-wide service - needs a real, stable IP (not
# ClusterIP), hence LoadBalancer + Cilium L2 instead of the usual Gateway
# HTTPRoute pattern everything else in this repo uses.
#
# Not wired into DHCP yet: pfSense's DHCP options 66 (next-server, this
# LB IP) / 67 (filename, netboot.xyz.kpxe for BIOS or netboot.xyz.efi for
# UEFI) still need setting for PXE clients to actually find this - separate
# step, deliberately not touched here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netboot-xyz
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      netboot-xyz:
        containers:
          app:
            image:
              # upstream only publishes `latest` + commit-sha tags, no semver
              repository: ghcr.io/netbootxyz/netbootxyz
              tag: latest
            env:
              TZ: Europe/Bucharest
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: netboot-xyz
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "${LB_IP_NETBOOTXYZ}"
        externalTrafficPolicy: Cluster
        ports:
          web-ui:
            port: 3000
          http-assets:
            port: 80
          tftp:
            port: 69
            protocol: UDP
    persistence:
      config:
        existingClaim: netboot-xyz
        globalMounts:
          - path: /config
