---
# PersistentVolumes pointing to named Longhorn volumes.
# These are created AFTER running: task longhorn:restore
# which restores each volume from S3 backup with the exact name in volumeHandle.
#
# Only media/ARR config volumes are backed up (PVC label
# recurring-job-group.longhorn.io/media) and therefore restorable.
# Cache volumes, observability (prometheus/loki/grafana/alertmanager) and
# netdata are deliberately NOT backed up — they start empty after DR via
# dynamic provisioning.
# Post-restore, run: task longhorn:post-restore-jellyfin
# Jellyfin images re-download automatically in ~10 min after that task runs.
#
# csi.volumeAttributes.numberOfReplicas below is cosmetic: these PVs bind by
# claimRef to volumes that already exist by the time this file is applied
# (restore-volume creates the Volume CRD first), so no CreateVolume call ever
# reads it. The real replica count is the Volume CRD's spec.numberOfReplicas,
# set dynamically from the actual node count by .taskfiles/longhorn/Taskfile.yaml.
# Kept at "1" here to match today's single-node reality and avoid looking
# like a live contradiction — not because changing it would do anything.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-postgres-restored-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: immich-postgres
    namespace: default
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: "1"
      staleReplicaTimeout: "30"
    volumeHandle: immich-postgres-restored
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
