---
# PersistentVolumes pointing to named Longhorn volumes.
# These are created AFTER running: task longhorn:restore
# which restores each volume from S3 backup with the exact name in volumeHandle.
#
# Only media/ARR config volumes are backed up (PVC label
# recurring-job-group.longhorn.io/media) and therefore restorable.
# Cache volumes, observability (prometheus/loki/grafana/alertmanager) and
# netdata are deliberately NOT backed up — they start empty after DR via
# dynamic provisioning.
# Post-restore, run: task longhorn:post-restore-jellyfin
# Jellyfin images re-download automatically in ~10 min after that task runs.
#
# Do NOT "fix" the numberOfReplicas: "3" below to match the single-node
# reality. csi.volumeAttributes is immutable on an already-created PV, so
# editing it here fails the cluster-apps dry-run and wedges Flux for every
# resource that Kustomization owns. The value is inert anyway: these PVs
# bind by claimRef to Volume CRDs that already exist by the time this file
# is applied, so no CreateVolume call ever reads it. The replica count that
# actually applies is the Volume CRD's spec.numberOfReplicas, set from the
# live node count by .taskfiles/longhorn/Taskfile.yaml (1 today).
# Changing this line is only safe if the PVs are recreated from scratch.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-postgres-restored-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: immich-postgres
    namespace: default
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: "3"
      staleReplicaTimeout: "30"
    volumeHandle: immich-postgres-restored
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
---
# The two Immich library volumes. Restoring them is not enough on its own —
# without a claimRef'd PV here the PVCs bind to a fresh empty dynamic volume
# and the restored data sits detached and unused, which is exactly how the
# whole photo library was lost on every DR before 2026-08-29.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-restored-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 20Gi
  claimRef:
