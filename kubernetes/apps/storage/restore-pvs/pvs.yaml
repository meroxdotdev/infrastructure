---
# Every Longhorn volume that is backed up, as a static PersistentVolume.
#
# One name per volume: the Longhorn volume, this PV and the PVC it is claimed
# by all carry the app's name. The DR restore (.taskfiles/longhorn) reads its
# volume list from this file, restores each backup under that name, and binds it
# here — so this file is the single list of what a DR brings back. A volume
# that is backed up but missing here would be restored and then silently
# ignored; that is how the Immich library and later its database were lost on
# DR runs before.
#
# Being here and being backed up go together: each PVC below carries the
# recurring-job-group.longhorn.io/backup label. Caches and observability are
# neither, by design; they start empty after a DR.
#
# csi.volumeAttributes is immutable on an existing PV. Changing
# numberOfReplicas here fails the cluster-apps dry-run and wedges Flux. The
# value is inert anyway: these PVs bind to Longhorn volumes that already exist,
# and the replica count comes from the Volume itself.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: jellyfin
    namespace: default
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: "3"
      staleReplicaTimeout: "30"
    volumeHandle: jellyfin
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
