# DO NOT remove the next two blocks as "dead, not backed up since 2026-07-21"
# without checking prod first (kubectl get volumes.longhorn.io <name> -n
# longhorn-system -o jsonpath='{.status.actualSize}'). They only look dead
# on a *fresh* DR-restore cluster, where they've genuinely never existed.
# On prod (pve/R730xd) these are the live, real, un-backed-up app volumes -
# this exact "cleanup" deleted them off prod on 2026-08-03, stuck Terminating
# for 2 days on kubernetes.io/pv-protection, silently breaking both apps
# until fixed 2026-08-05. See DR.md's Known issues table.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyseerr-restored-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: jellyseerr
    namespace: default
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: "3"
      staleReplicaTimeout: "30"
    volumeHandle: jellyseerr-restored
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
