---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-homelab-k8s
  namespace: longhorn-system
spec:
  # 23:50 UTC. Lands on the Garage on pve-3, whose data is on the NAS; the
  # time no longer has to line up with anything else.
  cron: "50 23 * * *"
  task: backup
  # Opt-in per PVC: recurring-job.longhorn.io/source: enabled and
  # recurring-job-group.longhorn.io/backup: enabled. Every such PVC must also
  # have its static PV in kubernetes/apps/storage/restore-pvs/pvs.yaml, or a DR
  # restores it and then ignores it.
  groups:
    - backup
  retain: 3
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-homelab-k8s
  namespace: longhorn-system
spec:
  # Every six hours. The backup job above runs once a night, so until this
  # existed the recovery point for a bad `kubectl delete` or a corrupting
  # application write was up to 24 hours old, and getting it back meant pulling
  # from Garage rather than rolling the volume back in place.
  #
  # Snapshots are not backups: they live on the same Longhorn replicas as the
  # data and die with them. They are the fast path, not the durable one — that
  # is what backup-homelab-k8s is for.
  cron: "0 */6 * * *"
  task: snapshot
  # The same set the backup job covers. Caches and observability stay out of
  # both: they are rebuilt empty and snapshotting them would spend replica
  # space on data nobody would restore.
  groups:
    - backup
  # Four at six hours apart is a day of history. Longhorn snapshots are
  # copy-on-write, so the cost is the data that changed, not four full copies —
  # but it is still replica space on three nodes, and kubernetes-1 and -2 have
  # ~280 GiB free each.
  retain: 4
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: system-backup-homelab-k8s
  namespace: longhorn-system
spec:
  # Sunday 22:30 UTC, ahead of the nightly volume backup so a system backup and
  # the volumes it describes land in the same night rather than a day apart.
  cron: "30 22 * * 0"
  task: system-backup
  # Not volume data. This captures Longhorn's own state — settings, volume and
  # PV/PVC definitions, the recurring jobs themselves — into the same backup
  # target. Without it a rebuilt cluster gets its replica counts, backup target,
  # storage classes and these three jobs re-entered by hand, from memory, at the
  # worst possible moment.
  #
  # Groups are meaningless for this task: it is cluster-scoped, not per-volume.
  # The field is required by the CRD, so `default` is the group every volume
  # already carries.
  groups:
    - default
  parameters:
    # Metadata only. Longhorn's default for a system backup is if-not-present,
    # which takes a volume backup of every volume that lacks a current one —
    # every volume in the cluster, not the `backup` group. Observed on
    # 2026-09-09 while verifying this: a manual run started backing up the
    # alertmanager PVC and three *-cache volumes, the exact set both other jobs
    # exclude on purpose.
    #
    # So the split is deliberate: this job captures configuration,
    # backup-homelab-k8s captures data. Neither reaches into the other's job.
    volume-backup-policy: disabled
  retain: 2
  concurrency: 1
