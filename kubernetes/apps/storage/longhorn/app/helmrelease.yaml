---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: longhorn
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.12.1
  url: oci://ghcr.io/home-operations/charts-mirror/longhorn
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: longhorn
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # The taintToleration setting below only reaches components Longhorn
    # manages itself — instance-manager, the CSI driver, engine images. The
    # manager DaemonSet, the UI and the driver deployer are placed by Helm and
    # need their own toleration, or longhorn-manager never lands on
    # kubernetes-3 and Longhorn does not see the node at all.
    global:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
    defaultSettings:
      createDefaultDiskLabeledNodes: false
      # Single-node cluster (2026-08-17, talos/SINGLE-NODE.md). Data locality
      # and auto-balance both describe where replicas sit relative to their
      # workload across nodes — meaningless with one node, and they cost
      # reconcile work for a placement decision that has one answer.
      defaultDataLocality: disabled
      defaultLonghornStaticStorageClass: longhorn
      # 1 -> 2 (2026-09-04, three nodes). The old comment here said one replica
      # was enough because a ZFS mirror sat underneath — true on pve-2's rpool,
      # but the node moved to pve-1 on 2026-09-01, onto a single QLC NVMe with
      # no redundancy at all, and the justification moved with it unnoticed.
      # Two replicas, and they go on kubernetes-2 and kubernetes-3: scheduling
      # is disabled on kubernetes-1 because its pool is one QLC disk at 34%
      # wear carrying every write in the cluster. Keeping volume writes off it
      # takes the disk from roughly three years to roughly fourteen, and costs
      # a network hop on reads — over the same 1 GbE the media already crosses.
      defaultReplicaCount: "2"
      # kubernetes-3 is tainted so workloads stay off its four cores. Longhorn
      # has to tolerate that or it places no replica there and the node is an
      # etcd vote only.
      taintToleration: "node-role.kubernetes.io/control-plane=:NoSchedule"
      # 5 -> 1. etcd and Longhorn share one 1 GbE link, and a rebuild moves
      # ~200 GiB. Longhorn v1 has no bandwidth throttle — "Replica Rebuilding
      # Bandwidth Limit" is V2 data engine only — so limiting concurrency is
      # the only lever there is. It narrows the burst; it does not remove it.
      concurrentReplicaRebuildPerNodeLimit: "1"
      guaranteedEngineManagerCPU: "20"
      guaranteedReplicaManagerCPU: "20"
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      orphanAutoDeletion: "true"
      replicaAutoBalance: "false"
      # 1 -> 25 (the upstream default). At 1% Longhorn kept scheduling until a
      # node disk was 99% full, and that disk lives inside the Talos VM's zvol
      # on rpool — the same pool as etcd. Found in the 2026-08-17 audit.
      storageMinimalAvailablePercentage: "25"
      storageReservedPercentageForDefaultDisk: "10"
      backupTarget: "s3://longhorn@us-east-1/"
      backupTargetCredentialSecret: "minio-secret"
      backupstorePollInterval: "300"

    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      reclaimPolicy: Delete
      migratable: false

    ingress:
      enabled: false

    # These default to 3 replicas *with pod anti-affinity*, so on a single node
    # two of every one of them sit Pending forever. Not cosmetic: a Pending
    # csi-attacher means volumes stop attaching.
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1

    longhornUI:
      replicas: 1

    metrics:
      serviceMonitor:
        enabled: true
