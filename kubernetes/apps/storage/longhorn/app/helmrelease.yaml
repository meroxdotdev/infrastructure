---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: longhorn
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.12.1
  url: oci://ghcr.io/home-operations/charts-mirror/longhorn
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: longhorn
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # The taintToleration setting below only reaches components Longhorn
    # manages itself — instance-manager, the CSI driver, engine images. The
    # manager DaemonSet, the UI and the driver deployer are placed by Helm and
    # need their own toleration, or longhorn-manager never lands on
    # kubernetes-3 and Longhorn does not see the node at all.
    global:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
    defaultSettings:
      createDefaultDiskLabeledNodes: false
      # Left disabled, but for a different reason since 2026-09-06: with one
      # replica per node there is already a local copy everywhere a pod can
      # run, so best-effort would have nothing left to arrange.
      # Auto-balance stays off too: it moves replicas on its own schedule, and
      # this cluster has one 1 GbE link shared with etcd.
      defaultDataLocality: disabled
      defaultLonghornStaticStorageClass: longhorn
      # 2 -> 3 (2026-09-06). One replica per node, so a volume survives losing
      # any one machine and still has a copy left over.
      #
      # Two replicas on kubernetes-2 and kubernetes-3 looked sufficient and was
      # not: scheduling was disabled on kubernetes-1, so when either of the
      # other two died Longhorn had nowhere to rebuild the missing copy. All 23
      # volumes would sit at one replica until the dead machine physically came
      # back. The 2026-09-04 drill did not catch this because it killed pve-1,
      # the one node holding no replicas.
      #
      # The cost of the third copy was measured before making the change, not
      # estimated: Longhorn writes 72 KB/s across all volumes (24h average), so
      # a replica on kubernetes-1 adds ~0.2 MB/s once ZFS amplification is
      # counted. Its QLC NVMe goes from ~4.4 years of remaining endurance to
      # ~3.6. Moving replicas off it in the first place cut its writes 4x;
      # putting one back adds 21%, so nearly all of that win is kept.
      defaultReplicaCount: "3"
      # Kept, but it does not do what it looks like it does. It lets Longhorn's
      # own components *run* on a tainted node — instance-manager did start on
      # kubernetes-3 carrying this toleration. It does not make the replica
      # scheduler *choose* that node: with the taint in place every placement
      # failed with "no disk candidates found", and replicas appeared the
      # moment the taint came off (2026-09-04). Do not read this as "Longhorn
      # works on tainted nodes" — see the kubernetes-3 block in
      # talos/talconfig.yaml.
      taintToleration: "node-role.kubernetes.io/control-plane=:NoSchedule"
      # 5 -> 1. etcd and Longhorn share one 1 GbE link. A full rebuild of every
      # volume moves ~35 GB, not the ~200 GB provisioned — replicas carry
      # actual data, and these volumes are 17% full. Longhorn v1 has no
      # bandwidth throttle — "Replica Rebuilding Bandwidth Limit" is V2 data
      # engine only — so limiting concurrency is the only lever there is. It
      # narrows the burst; it does not remove it.
      concurrentReplicaRebuildPerNodeLimit: "1"
      guaranteedEngineManagerCPU: "20"
      guaranteedReplicaManagerCPU: "20"
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      orphanAutoDeletion: "true"
      replicaAutoBalance: "false"
      # 1 -> 25 (the upstream default). At 1% Longhorn kept scheduling until a
      # node disk was 99% full, and that disk lives inside the Talos VM's zvol
      # on rpool — the same pool as etcd. Found in the 2026-08-17 audit.
      storageMinimalAvailablePercentage: "25"
      storageReservedPercentageForDefaultDisk: "10"
      backupTarget: "s3://longhorn@us-east-1/"
      backupTargetCredentialSecret: "minio-secret"
      backupstorePollInterval: "300"

    persistence:
      defaultClass: true
      defaultClassReplicaCount: 3
      reclaimPolicy: Delete
      migratable: false

    ingress:
      enabled: false

    # These default to 3 replicas *with pod anti-affinity*, so on a single node
    # two of every one of them sit Pending forever. Not cosmetic: a Pending
    # csi-attacher means volumes stop attaching.
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1

    longhornUI:
      replicas: 1

    metrics:
      serviceMonitor:
        enabled: true
