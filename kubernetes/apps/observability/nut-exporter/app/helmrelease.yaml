---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Reads the CyberPower VP700ELCD over the network from NUT on pve-2. Nothing
# watched the UPS before this: NUT shuts the whole estate down on low battery,
# and the only evidence it was still healthy was `upsc` run by hand.
#
# No agent is added to pve-2 and no credential is needed. upsd already listens
# on 10.57.57.250:3493 (netserver mode, so pve-1 can read it as a slave — see
# proxmox/pve-2/etc/nut/upsd.conf), and NUT serves LIST VAR anonymously;
# upsd.users guards commands and upsmon logins, not reads. Verified 2026-09-11.
#
# Scraped blackbox-style like pve-exporter — the NUT server is a query
# parameter, so one deployment covers a second UPS if one ever exists.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nut-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      nut-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.3.0
            args:
              # The default list omits battery.runtime and
              # ups.realpower.nominal, which are the two that matter most
              # here: runtime is the only direct measure of battery health,
              # and this UPS reports load only as a percentage — watts are
              # ups.load/100 * ups.realpower.nominal (390 W) and cannot be
              # derived without the nominal.
              #
              # input.frequency is deliberately left out. This driver reports
              # it in decihertz (501.0 for 50.1 Hz) with no unit anywhere in
              # the metric, which is a number built to be misread on a panel,
              # and mains frequency is not something to act on here anyway.
              - --nut.vars_enable=battery.charge,battery.charge.low,battery.runtime,battery.runtime.low,battery.voltage,input.voltage,output.voltage,ups.load,ups.realpower.nominal,ups.status
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9199
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
    service:
      app:
        controller: nut-exporter
        ports:
          http:
            port: 9199
    persistence:
      tmp:
        type: emptyDir
