---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafana-admin-secret.sops.yaml
  - ./helmrelease.yaml
# Dashboards that live in this repo rather than on grafana.com. The JSON is a
# real file, generated by the .py beside it, so it diffs and highlights like
# code instead of hiding inside a YAML block scalar. Fixed name, no hash
# suffix: the sidecar keys on the label, and a renamed ConfigMap would only
# make it drop and re-add the same dashboard on every change.
configMapGenerator:
  - name: grafana-dashboard-homelab
    files:
      - ./dashboards/homelab-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Homelab
