---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 10.5.15
  url: oci://ghcr.io/grafana/helm-charts/grafana
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deploymentStrategy:
      type: Recreate
    admin:
      existingSecret: grafana-admin-secret
    env:
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
      GF_EXPLORE_ENABLED: true
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
      GF_SECURITY_ANGULAR_SUPPORT_ENABLED: true
      GF_SERVER_ROOT_URL: https://grafana.k8s.merox.dev
    grafana.ini:
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      auth.anonymous:
        enabled: true
        org_id: 1
        org_name: Main Org.
        org_role: Viewer
      news:
        news_feed_enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
          - { name: Alertmanager, orgId: 1 }
          - { name: Loki, orgId: 1 }
          - { name: Prometheus, orgId: 1 }
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus-operated.observability.svc.cluster.local:9090
            isDefault: true
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki-headless.observability.svc.cluster.local:3100
            jsonData:
              maxLines: 250
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            access: proxy
            url: http://alertmanager-operated.observability.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        # Disabled - the UPS here is CyberPower on USB, not APC over SNMP
        # (see proxmox/pve-2/README.md's UPS section). The published NUT
        # dashboards do not fit either: 14371, the popular one, queries
        # nut_* metrics from HON95's exporter, and this cluster runs
        # DRuggeri's, which emits network_ups_tools_*. Rather than import a
        # dashboard and rewrite every panel, the UPS lives on the Homelab
        # Overview dashboard, generated by ./dashboards/homelab-overview.py.
        # apc-ups:
        #   # renovate: depName="APC UPS (SNMP)"
        #   gnetId: 12340
        #   revision: 1
        #   datasource: Prometheus
        # Disabled - storage here is Longhorn, not Ceph.
        # ceph-cluster:
        #   # renovate: depName="Ceph Cluster"
        #   gnetId: 2842
        #   revision: 18
        #   datasource: Prometheus
        # ceph-osd:
        #   # renovate: depName="Ceph - OSD (Single)"
        #   gnetId: 5336
        #   revision: 9
        #   datasource: Prometheus
        # ceph-pools:
        #   # renovate: depName="Ceph - Pools"
        #   gnetId: 5342
        #   revision: 9
        #   datasource: Prometheus
        cert-manager:
          # renovate: depName="Cert-manager-Kubernetes"
          gnetId: 20842
          revision: 3
          datasource: Prometheus
        cloudflared:
          # renovate: depName="Cloudflare Tunnels (cloudflared)"
          gnetId: 17457
          revision: 6
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        # Disabled - no standalone Envoy deployment (Cilium uses Envoy
        # internally for Gateway API, but doesn't expose the metrics this
        # dashboard expects).
        # envoy:
        #    # renovate: depName="Envoy Proxy Monitoring gRPC"
        #    gnetId: 23239
        #    revision: 1
        #    datasource:
        #      - { name: DS_AFRANET_PROMETHEUS, value: Prometheus }
        external-dns:
          # renovate: depName="External-dns"
          gnetId: 15038
          revision: 3
          datasource: Prometheus
        kubernetes-api-server:
          # renovate: depName="Kubernetes / System / API Server"
          gnetId: 15761
          revision: 19
          datasource: Prometheus
        kubernetes-coredns:
          # renovate: depName="Kubernetes / System / CoreDNS"
          gnetId: 15762
          revision: 20
          datasource: Prometheus
        kubernetes-global:
          # renovate: depName="Kubernetes / Views / Global"
          gnetId: 15757
          revision: 43
          datasource: Prometheus
        kubernetes-namespaces:
          # renovate: depName="Kubernetes / Views / Namespaces"
          gnetId: 15758
          revision: 42
          datasource: Prometheus
        kubernetes-nodes:
          # renovate: depName="Kubernetes / Views / Nodes"
          gnetId: 15759
          revision: 35
          datasource: Prometheus
        kubernetes-pods:
          # renovate: depName="Kubernetes / Views / Pods"
          gnetId: 15760
          revision: 36
          datasource: Prometheus
        kubernetes-volumes:
          # renovate: depName="K8s / Storage / Volumes / Cluster"
          gnetId: 11454
          revision: 14
          datasource: Prometheus
        longhorn:
          # renovate: depName="Longhorn"
          gnetId: 13032
          revision: 6
          datasource: Prometheus
        node-exporter-full:
          # renovate: depName="Node Exporter Full"
          gnetId: 1860
          revision: 41
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        prometheus:
          # renovate: depName="Prometheus"
          gnetId: 19105
          revision: 7
          datasource: Prometheus
        # pve-exporter has been collecting these metrics since it was
        # deployed and nothing ever displayed them - the only consumer was
        # the pve-rules alerts. Filters on `instance`, which is the host
        # address set by the ScrapeConfig relabelings, so all three hosts
        # appear in its dropdown.
        proxmox:
          # renovate: depName="Proxmox via Prometheus"
          gnetId: 10347
          revision: 5
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        # Disabled - smartctl-exporter isn't deployed anywhere in this
        # cluster (disk health is watched by proxmox/pve-2/scripts/
        # sas-health-check.sh on pve-2 instead).
        # smartctl-exporter:
        #   # renovate: depName="SMARTctl Exporter Dashboard"
        #   gnetId: 22604
        #   revision: 2
        #   datasource:
        #     - { name: DS_PROMETHEUS, value: Prometheus }
        # Disabled - no UniFi equipment in this network (pfSense is the
        # router/firewall, see pfsense/REINSTALL.md).
        # unifi-pdu:
        #   # renovate: depName="UniFi-Poller: PDU Insights - Prometheus"
        #   gnetId: 23027
        #   revision: 1
        #   datasource:
        #     - { name: DS_PROMETHEUS, value: Prometheus }
        # unifi-insights:
        #   # renovate: depName="UniFi-Poller: Client Insights - Prometheus"
        #   gnetId: 11315
        #   revision: 9
        #   datasource: Prometheus
        # unifi-network-sites:
        #   # renovate: depName="UniFi-Poller: Network Sites - Prometheus"
        #   gnetId: 11311
        #   revision: 5
        #   datasource: Prometheus
        # unifi-uap:
        #   # renovate: depName="UniFi-Poller: UAP Insights - Prometheus"
        #   gnetId: 11314
        #   revision: 10
        #   datasource: Prometheus
        # unifi-usw:
        #   # renovate: depName="UniFi-Poller: USW Insights - Prometheus"
        #   gnetId: 11312
        #   revision: 9
        #   datasource: Prometheus
        # Disabled - VolSync isn't deployed (Longhorn handles PVC backup
        # directly, see kubernetes/apps/storage/longhorn/recurringjob/).
        # volsync:
        #   # renovate: depName="VolSync Dashboard"
        #   gnetId: 21356
        #   revision: 3
        #   datasource:
        #     - { name: DS_PROMETHEUS, value: Prometheus }
        #     - { name: VAR_REPLICATIONDESTNAME, value: .*-dst }
        # Enabled 2026-09-11, paired with node_exporter on the Proxmox hosts
        # themselves - see docs/host-metrics.md, which is also the install.
        # It was off because ZFS metrics come only from nodes node_exporter
        # runs on, and it ran on the Talos guests, which have no ZFS. Until
        # that install is done on the hosts this dashboard stays empty.
        zfs:
          # renovate: depName="ZFS"
          gnetId: 7845
          revision: 4
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
    sidecar:
      image:
        registry: ghcr.io
        repository: home-operations/k8s-sidecar
        tag: 2.11.2@sha256:2e18fa6af75c94fb9aff610fba3386e7d518b0d639ecf0948aecaa071b126be0
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
    plugins:
      - grafana-clock-panel
      - grafana-piechart-panel
      - grafana-worldmap-panel
      - natel-discrete-panel
      - pr0ps-trackmap-panel
      - vonage-status-panel
    serviceMonitor:
      enabled: true
    route:
      main:
        enabled: true
        hostnames: ["grafana.k8s.merox.dev"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 10Gi
    testFramework:
      enabled: false