---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/core/configmap_v1.json
# The one dashboard to open first. Everything else in this Grafana is a
# drill-down: Kubernetes Views, Proxmox via Prometheus, Node Exporter Full,
# Longhorn, ZFS. This page answers "is the estate healthy" in one screen and
# is deliberately short — a panel earns its place here only if a bad value
# on it would change what happens next.
#
# Not imported from grafana.com. Every published homelab overview assumes
# equipment this estate does not have (UniFi, SNMP PDUs, Ceph), and the UPS
# half could not be imported at all: the popular NUT dashboard queries a
# different exporter's metric names. See ./helmrelease.yaml.
#
# Picked up by the Grafana sidecar through the grafana_dashboard label, not
# by the Helm values - so editing this file is the way to change it, and a
# change made in the Grafana UI will be overwritten.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana_folder: Homelab
data:
  homelab-overview.json: |-
      {
        "annotations": {
          "list": [
            {
              "builtIn": 1,
              "datasource": {
                "type": "grafana",
                "uid": "-- Grafana --"
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "type": "dashboard"
            }
          ]
        },
        "editable": true,
        "graphTooltip": 1,
        "links": [],
        "panels": [
          {
            "id": 1,
            "type": "row",
            "title": "Right now",
            "collapsed": false,
            "gridPos": {
              "h": 1,
              "w": 24,
              "x": 0,
              "y": 0
            },
            "panels": []
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Alerts",
            "description": "Firing in Alertmanager, excluding the Watchdog heartbeat.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 0,
              "y": 1
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 1
                    },
                    {
                      "color": "red",
                      "value": 3
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "textMode": "value",
              "wideLayout": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "count(ALERTS{alertstate=\"firing\", alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)",
                "range": false,
                "instant": true,
                "refId": "A"
              }
            ]
          },
          {
            "id": 3,
            "type": "stat",
            "title": "Mains",
            "description": "ups.status OL flag from the UPS on pve-2.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 3,
              "y": 1
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "1": {
                        "text": "On mains",
                        "color": "green",
                        "index": 0
                      },
                      "0": {
                        "text": "BATTERY",
                        "color": "red",
                        "index": 1
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "textMode": "value",
              "wideLayout": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "text": {
                "valueSize": 26
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "network_ups_tools_ups_status{flag=\"OL\"}",
                "range": false,
                "instant": true,
                "refId": "A"
              }
            ]
          },
          {
            "id": 4,
            "type": "stat",
            "title": "Internet",
            "description": "TCP connect to 1.1.1.1 and 8.8.8.8. Offline only when both fail.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 6,
              "y": 1
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "1": {
                        "text": "Online",
                        "color": "green",
                        "index": 0
                      },
                      "0": {
                        "text": "OFFLINE",
                        "color": "red",
                        "index": 1
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "textMode": "value",
              "wideLayout": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "text": {
                "valueSize": 26
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "max(probe_success{job=\"blackbox-wan\"})",
                "range": false,
                "instant": true,
                "refId": "A"
              }
            ]
          },
          {
            "id": 5,
            "type": "stat",
            "title": "VPS",
            "description": "inside.merox.dev \u2014 the off-site backup target.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 9,
              "y": 1
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "1": {
                        "text": "Reachable",
                        "color": "green",
                        "index": 0
                      },
                      "0": {
                        "text": "DOWN",
                        "color": "red",
                        "index": 1
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "textMode": "value",
              "wideLayout": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "text": {
                "valueSize": 26
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "probe_success{job=\"blackbox-vps\"}",
                "range": false,
                "instant": true,
                "refId": "A"
              }
            ]
          },
          {
            "id": 6,
            "type": "stat",
            "title": "Hosts",
            "description": "Proxmox hosts answering. Each carries one control plane.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 12,
              "y": 1
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 2
                    },
                    {
                      "color": "green",
                      "value": 3
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "textMode": "value",
              "wideLayout": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
