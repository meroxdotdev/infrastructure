---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/core/configmap_v1.json
# The one dashboard to open first. Everything else in this Grafana is a
# drill-down: Kubernetes Views, Proxmox via Prometheus, Node Exporter Full,
# Longhorn, ZFS. This page answers "is the estate healthy" in one screen and
# is deliberately short — a panel earns its place here only if a bad value
# on it would change what happens next.
#
# Not imported from grafana.com. Every published homelab overview assumes
# equipment this estate does not have (UniFi, SNMP PDUs, Ceph), and the UPS
# half could not be imported at all: the popular NUT dashboard queries a
# different exporter's metric names. See ./helmrelease.yaml.
#
# Picked up by the Grafana sidecar through the grafana_dashboard label, not
# by the Helm values - so editing this file is the way to change it, and a
# change made in the Grafana UI will be overwritten.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana_folder: Homelab
data:
