            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "sum(pve_up{id=~\"node/.*\"})",
                "range": false,
                "instant": true,
                "refId": "A"
              }
            ]
          },
          {
            "id": 7,
            "type": "stat",
            "title": "K8s nodes",
            "description": "Ready nodes. Two is still a quorum; one is not.",
