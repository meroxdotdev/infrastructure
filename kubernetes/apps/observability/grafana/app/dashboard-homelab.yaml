            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 15,
              "y": 1
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 2
                    },
                    {
                      "color": "green",
                      "value": 3
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "textMode": "value",
              "wideLayout": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
                "range": false,
                "instant": true,
                "refId": "A"
              }
            ]
          },
          {
            "id": 8,
            "type": "stat",
            "title": "ZFS pools",
            "description": "Pools not ONLINE (degraded, faulted, suspended). Error counters on an online pool are sas-health-check.sh's job.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 18,
              "y": 1
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {
                        "text": "Online",
                        "color": "green",
                        "index": 0
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "red",
                      "value": 1
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "textMode": "value",
              "wideLayout": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "text": {
                "valueSize": 26
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "sum(node_zfs_zpool_state{state!=\"online\"}) or vector(0)",
                "range": false,
                "instant": true,
                "refId": "A"
              }
            ]
          },
          {
            "id": 9,
            "type": "stat",
            "title": "Stuck pods",
            "description": "Pending, Failed or Unknown.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 4,
              "w": 3,
              "x": 21,
              "y": 1
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 1
                    },
                    {
                      "color": "red",
                      "value": 5
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "textMode": "value",
              "wideLayout": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"}) or vector(0)",
                "range": false,
                "instant": true,
                "refId": "A"
              }
            ]
          },
          {
            "id": 10,
            "type": "row",
            "title": "Data safety",
            "collapsed": false,
            "gridPos": {
              "h": 1,
              "w": 24,
              "x": 0,
              "y": 5
            },
            "panels": []
          },
          {
            "id": 11,
            "type": "bargauge",
            "title": "Longhorn backup age",
            "description": "Since each volume's last backup reached Garage. LonghornBackupStale fires at 36 h; the job runs nightly at 23:50. Tier-3 volumes are absent by design \u2014 the exemption list lives in the LonghornVolumeNeverBackedUp alert.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 0,
              "y": 6
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "s",
                "min": 0,
                "decimals": 1,
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 86400
                    },
                    {
                      "color": "red",
                      "value": 129600
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "displayMode": "gradient",
              "orientation": "horizontal",
              "showUnfilled": true,
              "valueMode": "color",
              "namePlacement": "left",
              "sizing": "auto",
              "minVizWidth": 8,
              "minVizHeight": 14,
              "maxVizHeight": 24,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "sort_desc((time() - longhorn_volume_last_backup_at) and (longhorn_volume_last_backup_at != 0))",
                "range": false,
                "instant": true,
                "refId": "A",
                "legendFormat": "{{pvc}}"
              }
            ]
          },
          {
            "id": 12,
            "type": "bargauge",
            "title": "Storage fill",
            "description": "Every Proxmox storage on every host. PveStorageNearFull fires at 80 %, Critical at 90 %.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 12,
              "y": 6
            },
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "unit": "percentunit",
                "min": 0,
                "decimals": 1,
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 0.8
                    },
                    {
