          {
            "id": 15,
            "type": "stat",
            "title": "Upload",
            "description": "Last Ookla speedtest. Runs every 4 h \u2014 each run moves ~1.8 GB.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
