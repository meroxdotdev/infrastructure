                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "sort_desc(pve_disk_usage_bytes{id=~\"storage/.*\"} / pve_disk_size_bytes{id=~\"storage/.*\"})",
                "range": false,
                "instant": true,
                "refId": "A",
                "legendFormat": "{{id}}"
              }
            ]
          },
          {
            "id": 13,
            "type": "row",
            "title": "Internet",
            "collapsed": false,
            "gridPos": {
              "h": 1,
              "w": 24,
              "x": 0,
              "y": 15
            },
            "panels": []
          },
          {
            "id": 14,
            "type": "stat",
            "title": "Download",
            "description": "Last Ookla speedtest. Runs every 4 h \u2014 each run moves ~1.8 GB.",
            "datasource": {
              "type": "prometheus",
