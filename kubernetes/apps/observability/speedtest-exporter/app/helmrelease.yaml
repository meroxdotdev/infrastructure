---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# WAN throughput, measured with Ookla's own CLI. Round-trip time and outages
# are blackbox-wan's job (scrapeconfig.yaml) — that one is cheap and runs
# constantly; this one is not.
#
# Every run costs ~1.8 GB. Measured 2026-09-11 on this line: 938 Mbps
# down / 660 up moved 1045 MB and 790 MB. Hourly would be ~1.3 TB a month and
# a saturated link for ~20 s every hour, so it runs every 4 h (~330 GB a
# month). SPEEDTEST_CACHE_FOR is what spaces the runs: Prometheus scrapes
# every minute and gets the cached result, so the series never goes stale
# between tests.
#
# The exporter runs the test inside the /metrics request, which is why the
# probes below hit / and never /metrics — a probe there would start a test.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      speedtest-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/miguelndecarvalho/speedtest-exporter
              tag: v3.5.4
            env:
              SPEEDTEST_CACHE_FOR: "14400"
              # Below the ScrapeConfig's 55s timeout, so a hung test is
              # killed by the exporter and reported as speedtest_up 0
              # instead of Prometheus giving up on the scrape.
              SPEEDTEST_TIMEOUT: "50"
              # The CLI writes its license acceptance under $HOME, and the
              # root filesystem is read-only.
              HOME: /tmp
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9798
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            runAsNonRoot: true
            # the image's own `speedtest` user
            runAsUser: 1000
            runAsGroup: 1000
    service:
      app:
        controller: speedtest-exporter
        ports:
          http:
            port: 9798
    persistence:
      tmp:
        type: emptyDir
