---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# VPS (Oracle) reachability - TCP-connect through Cloudflare Tunnel to a
# public hostname on it, from inside the cluster. Nothing else watches the
# VPS itself; homelab-stats.sh's WAN check only catches home going down,
# not the VPS. inside.merox.dev chosen because it's public DNS (not
# Tailscale split-DNS, which k8s pods can't resolve) and always-on.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name blackbox-vps
spec:
  staticConfigs:
    - targets:
        - inside.merox.dev:443
  metricsPath: /probe
  params:
    module: ["tcp_connect"]
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: blackbox-exporter.observability.svc.cluster.local:9115
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# WAN reachability and round-trip time, every scrape. The hourly speedtest
# measures throughput and costs a burst of traffic each run; this costs one
# TCP handshake, so it can run constantly and catch the short outages an
# hourly test would sample straight past.
#
# Two unrelated anycast targets so one provider's bad day does not read as
# the line being down. TCP connect rather than ICMP because ICMP needs
# NET_RAW, and blackbox-exporter runs with every capability dropped.
#
# No alert on this on purpose: when the WAN is down, Alertmanager cannot
# reach Telegram either. It is a record to look back at, not a pager.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name blackbox-wan
spec:
  staticConfigs:
    - targets:
        - 1.1.1.1:443
        - 8.8.8.8:443
  metricsPath: /probe
  params:
    module: ["tcp_connect"]
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: blackbox-exporter.observability.svc.cluster.local:9115
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# WAN throughput. The exporter runs the real test at most every 4 h and
# answers every other scrape from cache, so scraping each minute costs
# nothing and keeps the series from going stale between runs.
#
# The timeout is long because one scrape in 240 is the one that actually runs
# the test (~30 s). With the default 10 s, that scrape would be abandoned and
# `up` would blip to 0 once every run.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name speedtest
spec:
  scrapeInterval: 1m
  scrapeTimeout: 55s
  staticConfigs:
    - targets:
        - speedtest-exporter.observability.svc.cluster.local:9798
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# pve-2 (R730xd), standalone host - queried through pve-exporter's blackbox-
# style /pve endpoint. `module: default` picks the matching section in
# pve-exporter-secret's pve.yml.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name pve-2
spec:
  staticConfigs:
    - targets:
        - 10.57.57.250
  metricsPath: /pve
  params:
    module: ["default"]
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: pve-exporter.observability.svc.cluster.local:9221
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# pve-1 (Beelink GTi13 Ultra). Added 2026-09-11 — until then pve-exporter
# scraped only pve-2, so PveNodeDown and friends covered one host out of
# three while all three carry a control plane (docs/architecture.md).
# Standalone hosts, so this needs its own API token and its own `pve-1`
# section in pve-exporter-secret's pve.yml; it cannot share pve-2's.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name pve-1
spec:
  staticConfigs:
    - targets:
        - 10.57.57.254
  metricsPath: /pve
  params:
    module: ["pve-1"]
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: pve-exporter.observability.svc.cluster.local:9221
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# pve-3 (OptiPlex 3050). Same reasoning as pve-1 above.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name pve-3
spec:
  staticConfigs:
    - targets:
        - 10.57.57.253
  metricsPath: /pve
  params:
    module: ["pve-3"]
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: pve-exporter.observability.svc.cluster.local:9221
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# The UPS, read from NUT on pve-2 through nut-exporter. The `server` query
# parameter carries the NUT host and the port stays the exporter's default
# 3493, so the target is a bare address — passing host:port here would send
# "10.57.57.250:3493" as a hostname and fail to resolve.
#
# The `ups` label is set statically because the exporter does not emit one:
# its metrics carry no UPS identity at all, only the values.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut
spec:
  staticConfigs:
    - targets:
        - 10.57.57.250
      labels:
        ups: cyberpower
  metricsPath: /ups_metrics
  params:
    ups: ["cyberpower"]
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_server
    - sourceLabels: [__param_server]
      targetLabel: instance
    - targetLabel: __address__
      replacement: nut-exporter.observability.svc.cluster.local:9199
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# The three Proxmox hosts themselves. node_exporter ran only on the Talos
# guests until 2026-09-11, so every hardware number came from inside a VM:
# no ZFS pool state, no drive or chassis temperature, no per-disk latency.
# See docs/host-metrics.md for the install and the reasoning.
#
# Job name is deliberately not `node-exporter` — that one belongs to the
# in-cluster DaemonSet, and merging the two would put guests and hypervisors
# in the same series with no way to tell them apart.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name pve-node
spec:
  # One group per host so every series carries a `host` label. Without it the
  # dashboard can only say 10.57.57.254:9100, and nobody reads that as pve-1.
  staticConfigs:
    - targets: ["10.57.57.254:9100"]
      labels: { host: pve-1 }
    - targets: ["10.57.57.250:9100"]
      labels: { host: pve-2 }
    - targets: ["10.57.57.253:9100"]
      labels: { host: pve-3 }
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
  # The Debian package enables the systemd collector, which reports every unit
  # in each of five states: 3225 series, 30 % of this job, measured 2026-09-11,
  # and nothing reads them. Only `failed` is kept — the one state worth ever
  # alerting on (a dead nut-monitor or fan-control), at one series per unit.
  metricRelabelings:
    - sourceLabels: [__name__, state]
      regex: node_systemd_unit_state;(activating|active|deactivating|inactive)
      action: drop
---
