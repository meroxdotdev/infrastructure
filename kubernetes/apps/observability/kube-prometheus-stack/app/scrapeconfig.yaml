---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# pve (R730xd), standalone host - queried through pve-exporter's blackbox-
# style /pve endpoint. `module: default` picks the matching section in
# pve-exporter-secret's pve.yml.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name pve
spec:
  staticConfigs:
    - targets:
        - 10.57.57.250
  metricsPath: /pve
  params:
    module: ["default"]
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: pve-exporter.observability.svc.cluster.local:9221
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# px-0 (Beelink), standalone host - same pve-exporter, different module
# (own token in pve.yml, since px-0 and pve aren't a corosync cluster).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: px-0
spec:
  staticConfigs:
    - targets:
        - 10.57.57.254
  metricsPath: /pve
  params:
    module: ["px0"]
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: pve-exporter.observability.svc.cluster.local:9221
    - action: replace
      targetLabel: job
      replacement: pve

