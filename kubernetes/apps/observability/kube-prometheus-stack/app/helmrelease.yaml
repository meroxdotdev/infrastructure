# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 89.2.2
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      disabled:
        # Structurally unable to be anything but 0% or 100%, so it pages on
        # every etcd restart. Replaced by EtcdFailedGRPCRequests below, scoped
        # to unary calls - the reasoning is there.
        etcdHighNumberOfFailedGRPCRequests: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames: ["alertmanager.k8s.merox.dev"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
        externalUrl: https://alertmanager.k8s.merox.dev
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames: ["prometheus.k8s.merox.dev"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      prometheusSpec:
        image:
          registry: docker.io
          repository: prompp/prompp
          tag: 2.53.2-0.2.5
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # 30 days so the Homelab Overview can always look back a month.
        # Nothing here is backed up (tier 3), so this is a disk decision, not a
        # data one: measured 2026-09-11 at 0.73 GB/day, a month is ~22 GB.
        retention: 30d
        # Must stay comfortably BELOW the PVC below (40Gi = 42.9GB), or the
        # size guard can never fire — the volume fills first and Prometheus
        # crashes on a full disk, with only `retention` saving it. It was once
        # 20GB on a 15Gi disk, larger than the disk it was meant to protect.
        # 32GB is ~44 days at today's rate, so time, not size, is what trims:
        # the month holds even as exporters are added. Growing this means
        # raising the PVC first — and the DR task that recreates it, in
        # .taskfiles/longhorn/Taskfile.yaml create-statefulset-pvcs.
        retentionSize: 32GB
        resources:
          requests:
            cpu: 100m
            memory: 250Mi
          limits:
            memory: 2000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              resources:
                requests:
                  storage: 40Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
    additionalPrometheusRulesMap:
      cert-rules:
        groups:
          - name: certificates
            rules:
              # The ClusterIssuer uses Let's Encrypt's `shortlived` profile:
              # ~160 h certificates that cert-manager renews with a third of
              # their life left, ~53 h. So a certificate is normally between
              # 53 h and 160 h from expiry, and below 36 h means renewal has
              # been failing for most of a day. With certificates this short
              # there is no slack to discover that by browser warning — every
              # internal HTTPS route dies within a day and a half after.
              #
              # Nothing watched this before 2026-09-11: cert-manager was
              # scraped, and no rule read the metric.
              - alert: CertificateRenewalFailing
                annotations:
                  summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }} — cert-manager is not renewing it."
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 129600
                for: 1h
                labels:
                  severity: critical
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      etcd-rules:
        groups:
          - name: etcd
            rules:
              # The bundled etcd rules exist and are loaded, and none of them
              # caught the 2026-08-16 incident: etcdHighFsyncDurations needs
              # p99 > 0.5s sustained `for: 10m`, etcdHighNumberOfLeaderChanges
              # needs 4 elections inside 15m. The real failure was sharp spikes
              # that recovered in 1-4 minutes and 6-11 elections spread across a
              # whole day - structurally invisible to both. Six days of
              # degradation went unnoticed until someone asked why alerts were
              # firing elsewhere.
              #
              # Count the slow fsyncs instead of quantiling them. p99 over a
              # 5-min window is a tail-of-a-tail and swings wildly on a low
              # sample count; a raw count of "fsyncs that took over a second"
              # is what actually tracked the damage, day by day.
              #
              # Threshold: healthy here is ~30/day, all inside the nightly
              # backup hour when the spun-down SAS disks are legitimately woken
              # (see proxmox/pve-2/spindown-setup.md). Pre-fix was 346/day and
              # 203 in a single hour. 50/h clears the backup window and still
              # catches a regression on the first bad hour.
              - alert: EtcdSlowFsyncBurst
                annotations:
                  summary: "etcd: {{ $value | printf \"%.0f\" }} fsyncs over 1s in the last hour - check the H730P (SAS spin-down wakes stall the shared controller)."
                expr: sum(increase(etcd_disk_wal_fsync_duration_seconds_count[1h])) - sum(increase(etcd_disk_wal_fsync_duration_seconds_bucket{le="1.024"}[1h])) > 50
                for: 10m
                labels:
                  severity: warning
              # Replaces the bundled etcdHighNumberOfFailedGRPCRequests, which
              # is disabled in defaultRules above because it cannot report
              # anything but 0% or 100%.
              #
              # It divides failed calls by all calls per grpc_method, streaming
              # methods included. LeaseKeepAlive and Watch are bidi_stream: a
              # healthy stream never terminates, so it never increments OK, and
              # the counter only moves when a stream is torn down - as
              # Unavailable. Measured here: LeaseKeepAlive OK=0, Unavailable=15.
              # Every etcd restart therefore pages at exactly 100%.
              #
              # grpc_type="unary" is the upstream etcd mixin's own fix. Real
              # unary traffic on this cluster: 1,316,657 OK against 91 failures,
              # 0.0069% - which is what the alert was meant to watch.
              - alert: EtcdFailedGRPCRequests
                annotations:
                  summary: "etcd: {{ $value | printf \"%.1f\" }}% of unary {{ $labels.grpc_method }} calls failing."
                expr: |
                  100 * sum without (grpc_type, grpc_code) (
                    rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])
                  )
                    /
                  sum without (grpc_type, grpc_code) (
                    rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary"}[5m])
                  ) > 1
                for: 10m
                labels:
                  severity: warning
              # Same blind spot, slower axis: elections trickling in over hours
              # never reach the bundled rule's 4-per-15m. Zero is the healthy
              # value for a 3-node cluster that is not being disturbed.
              #
              # max, not sum. The counter is "leader changes *seen by this
              # member*", so one election increments all three and a sum reports
              # roughly three times the truth. It also resets when an etcd
              # process restarts, which sum() across members with different
              # restart histories turns into elections that never happened.
              #
              # This fired on 2026-09-09 reporting "3 raft leader elections",
              # which was one — increase() extrapolates, so a single election
              # lands just over a threshold of 3 and prints back as 3. etcd was
              # healthy throughout: WAL fsync p99 7.8/3.9/2.0 ms against a 10 ms
              # bar, backend commit 8.0/4.0/2.0 ms against 25 ms, zero failed
              # proposals in 24 h. The elections came from members joining on
              # 2026-09-04 and from pod restarts, not from disk stalls.
              #
              # > 1 on the max means two genuine elections in six hours. One is
              # what any rolling restart produces — a Talos upgrade, a
              # reschedule — and paging on that teaches the phone to be ignored.
              #
              # No second alert on fsync latency: EtcdSlowFsyncBurst above
              # already watches the cause, and counts slow fsyncs rather than
              # quantiling them for the reason written there.
              - alert: EtcdLeaderElectionsCreeping
                annotations:
                  summary: "etcd: {{ $value | printf \"%.0f\" }} raft leader elections seen by one member in 6h - normally zero."
                expr: max(increase(etcd_server_leader_changes_seen_total[6h])) > 1
                for: 10m
                labels:
                  severity: warning
      longhorn-backup-rules:
        groups:
          - name: longhorn-backup
            rules:
              # Backups are opt-in by label: the only recurring job targets the
              # `media` group, so a volume that lands anywhere else is simply
              # never backed up and nothing says so. On 2026-09-07 that was 11
              # of 23 volumes. All eleven turned out to be ones that genuinely
              # do not need it - but nothing had established that, and the next
              # app to be deployed would have joined them in silence. That is
              # the same class of failure that kept the Immich library out of
              # DR for months.
              #
              # The exemptions are listed here, in git, rather than left
              # implicit. Anything not named is expected to be backed up:
              #   *-cache            ARR and Jellyfin scratch, rebuilt on start
              #   netboot-xyz        images re-downloaded on demand
              #   grafana            dashboards come from the Helm release
              #   storage-loki-0     logs, and losing old ones costs nothing
              #   alertmanager-*     silences only, seconds to recreate
              #   prometheus-*       14d TSDB, and it rebuilds itself
              #
              # Adding a volume to this regex is a decision that shows up in a
              # diff. Forgetting one is not.
              - alert: LonghornVolumeNeverBackedUp
                annotations:
                  summary: "Longhorn: {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has never been backed up and is not on the exemption list."
                expr: longhorn_volume_last_backup_at{pvc!~".*-cache|netboot-xyz|grafana|storage-loki-0|alertmanager-.*|prometheus-.*"} == 0
                for: 6h
                labels:
                  severity: warning
              # The other half: a volume that was being backed up and quietly
              # stopped. The recurring job runs daily at 23:50, so age peaks
              # near 24h just before the next run; 36h is one missed run of
              # slack. Measured 2026-09-07: the oldest live backup was 11.5h.
              - alert: LonghornBackupStale
                annotations:
                  summary: "Longhorn: {{ $labels.pvc_namespace }}/{{ $labels.pvc }} last backup was {{ $value | humanizeDuration }} ago."
                expr: (time() - longhorn_volume_last_backup_at > 129600) and (longhorn_volume_last_backup_at != 0)
                for: 1h
                labels:
                  severity: warning
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      pve-rules:
        groups:
          # Was `pve-2` while that was the only host scraped. All three are
          # scraped since 2026-09-11; the rules were already written to
          # join on (id, instance) for exactly this.
          - name: pve
            rules:
              # pve_uptime_seconds resetting (not pve_up==0) is what actually
              # answers "did a VM/LXC restart" - pve_up==0 alone would also
              # fire permanently for guests that are just deliberately kept
              # off (windows11, ubuntu-server on pve-2). `id` alone would
              # collide if a second Proxmox host is ever added (both would
              # have a "qemu/100") - join on (id, instance) or a rule
              # silently errors out on the shared ID instead of firing
              # (found the hard way: a real reboot never reached
              # Alertmanager because of this).
              - alert: PveGuestRestarted
                annotations:
                  summary: "{{ $labels.name }} ({{ $labels.id }}) on {{ $labels.node }} restarted."
                expr: (resets(pve_uptime_seconds{id=~"(qemu|lxc)/.*"}[10m]) > 0) * on(id, instance) group_left(name, node) pve_guest_info
                labels:
                  severity: warning
              - alert: PveNodeRestarted
                annotations:
                  summary: "Proxmox node {{ $labels.name }} restarted."
                expr: (resets(pve_uptime_seconds{id=~"node/.*"}[10m]) > 0) * on(id, instance) group_left(name) pve_node_info
                labels:
                  severity: warning
              - alert: PveNodeDown
                annotations:
                  summary: "Proxmox node {{ $labels.name }} is unreachable."
                expr: (pve_up{id=~"node/.*"} == 0) * on(id, instance) group_left(name) pve_node_info
                for: 2m
                labels:
                  severity: critical
              - alert: PveHostHighCpu
                annotations:
                  summary: "Proxmox node {{ $labels.name }} CPU at {{ $value | humanizePercentage }} for 15m+."
                expr: (pve_cpu_usage_ratio{id=~"node/.*"} > 0.9) * on(id, instance) group_left(name) pve_node_info
                for: 15m
                labels:
                  severity: warning
              - alert: PveHostHighMemory
                annotations:
                  summary: "Proxmox node {{ $labels.name }} memory at {{ $value | humanizePercentage }} for 15m+."
                expr: (pve_memory_usage_bytes{id=~"node/.*"} / pve_memory_size_bytes{id=~"node/.*"} > 0.9) * on(id, instance) group_left(name) pve_node_info
                for: 15m
                labels:
                  severity: warning
              - alert: PveStorageUnavailable
                annotations:
                  summary: "Proxmox storage {{ $labels.id }} is unavailable."
                expr: pve_up{id=~"storage/.*"} == 0
                for: 15m
                labels:
                  severity: warning
              # Capacity was the one thing nothing watched. "Unavailable"
              # above catches a storage going away, not one filling up — and
              # a full ZFS pool is worse than a full filesystem: at 100% you
              # can struggle even to delete. 30m so a big restore or a vzdump
              # spike doesn't page anyone.
              - alert: PveStorageNearFull
                annotations:
                  summary: "Proxmox storage {{ $labels.id }} at {{ $value | humanizePercentage }} — plan space now."
                expr: pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"} > 0.80
                for: 30m
                labels:
                  severity: warning
              - alert: PveStorageCritical
                annotations:
                  summary: "Proxmox storage {{ $labels.id }} at {{ $value | humanizePercentage }} — act today."
                expr: pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"} > 0.90
                for: 15m
                labels:
                  severity: critical
      ups-rules:
        groups:
          - name: ups
            rules:
              # Nothing watched the UPS until 2026-09-11 — NUT shuts every
              # host down on low battery and the only proof it was still
              # working was running `upsc` by hand. Metrics come from
              # nut-exporter reading upsd on pve-2 over the LAN.
              #
              # ups.status is a set of flags, so each is its own label on
              # network_ups_tools_ups_status rather than a value to compare.
              # The exporter forces the unset ones to 0, so `== 1` is safe
              # and these never go stale-absent.
              - alert: UpsOnBattery
                annotations:
                  summary: "UPS {{ $labels.ups }} is on battery — mains is gone."
                expr: network_ups_tools_ups_status{flag="OB"} == 1
                for: 1m
                labels:
                  severity: critical
              # LB is what upsmon acts on: once this is set the shutdown
              # sequence is imminent. No `for` — by the time it repeats the
              # hosts are already going down.
              - alert: UpsBatteryLow
                annotations:
                  summary: "UPS {{ $labels.ups }} battery is low — NUT is about to shut the hosts down."
                expr: network_ups_tools_ups_status{flag="LB"} == 1
                labels:
                  severity: critical
              - alert: UpsReplaceBattery
                annotations:
                  summary: "UPS {{ $labels.ups }} reports its battery needs replacing."
                expr: network_ups_tools_ups_status{flag="RB"} == 1
                for: 1h
                labels:
                  severity: warning
              # The estimate while on mains is the only early warning that the
              # battery is aging or that the load grew. 300 s is NUT's own
              # battery.runtime.low on this UPS, i.e. the point it would treat
              # as "low" — reaching it while still online means a real outage
              # would start there. Measured 2026-09-11: 535 s at 42 % load.
              # 30m so a load spike does not page anyone.
              - alert: UpsRuntimeShort
                annotations:
                  summary: "UPS {{ $labels.ups }} estimates only {{ $value | humanizeDuration }} of runtime while on mains."
                # `on(instance, ups)` is mandatory: bare `and` matches only
                # identical label sets, and the status series carries an
                # extra `flag` label, so the whole rule would silently never
                # fire.
                expr: network_ups_tools_battery_runtime < 300 and on(instance, ups) network_ups_tools_ups_status{flag="OL"} == 1
                for: 30m
                labels:
                  severity: warning
              # Load is a percentage of ups.realpower.nominal (390 W here).
              # Above 80 % the runtime estimate collapses non-linearly, so
              # this is really an early warning about the number above.
              - alert: UpsOverloaded
                annotations:
                  summary: "UPS {{ $labels.ups }} at {{ $value }} % load — runtime is shrinking."
                expr: network_ups_tools_ups_load > 80
                for: 15m
                labels:
                  severity: warning
              # Losing sight of the UPS is itself the alert: upsd not
              # answering usually means the driver died or the USB device
              # dropped for good, and that is also the path by which the
              # automatic shutdown stops working. The device re-enumerates
              # every ~11 s by design on this chassis (see
              # proxmox/pve-2/known-issues.md), so 10m of silence, not 2.
              - alert: UpsUnreachable
                annotations:
                  summary: "NUT on pve-2 has not answered for 10m — the UPS is unmonitored and may no longer shut the hosts down."
                expr: up{job="nut"} == 0
                for: 10m
                labels:
                  severity: critical
      vps-rules:
        groups:
          - name: vps
            rules:
              # 3m, not immediate - a single failed TCP probe can be a blip
              # same as the WAN/Tailscale check learned today.
              - alert: VpsUnreachable
                annotations:
                  summary: "VPS (Oracle) unreachable via inside.merox.dev - may be down/rebooting."
                expr: probe_success{job="blackbox-vps"} == 0
                for: 3m
                labels:
                  severity: critical
      # Off until 2026-09-11, and the comment that sat here said exactly why:
      # node_zfs_zpool_state comes from node_exporter, which ran on the Talos
      # guests (no ZFS) and not on the hosts that actually hold the pools.
      # Enabled together with node_exporter on all three hosts — the install
      # is docs/host-metrics.md. The rule has nothing to evaluate on a host
      # without node_exporter, but that host is not quiet: its pve-node
      # target is down, and kube-prometheus-stack's default TargetDown fires.
      #
      # This does not replace sas-health-check.sh on pve-2 — that mails on
      # READ/WRITE/CKSUM error counters, which a pool reports while still
      # ONLINE. This catches the state change the counters do not: DEGRADED,
      # FAULTED, SUSPENDED. Different failure, same pool.
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: "ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is {{ $labels.state }}, not online."
                expr: node_zfs_zpool_state{state!="online"} > 0
                for: 5m
                labels:
                  severity: critical
