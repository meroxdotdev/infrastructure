# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  namespace: observability
spec:
  route:
    # "id" splits each Proxmox VM/node into its own group - without it, one
    # VM restarting re-flushes the whole alertname+job group, resending
    # Telegram messages for other VMs that already got announced (still
    # inside their own 10m firing window). Alerts without an "id" label
    # (dockerhub/oom rules) just group as before, empty-id is uniform.
    # "instance" is also required: if a second PVE host is ever added, VM IDs
    # aren't unique between independent Proxmox hosts (both can have a
    # "qemu/100") - without it, a restart on one host can silently get
    # swallowed by an already-notified group from the OTHER host's
    # same-numbered VM. Found live on a prior second host before it was
    # decommissioned: a VM restart never got announced because another
    # host's same-numbered VM had already used up that {id=qemu/100}
    # group's notification earlier.
    groupBy: ["alertname", "job", "id", "instance"]
    groupInterval: 10m
    groupWait: 1m
    receiver: "null"
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      - receiver: heartbeat
        repeatInterval: 1m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      - receiver: telegram
        matchers:
          - name: severity
            value: "critical|warning"
            matchType: "=~"
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning
          matchType: "="
  receivers:
    - name: "null"
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: alertmanager-secret
            key: ALERTMANAGER_HEARTBEAT_URL
    # Straight to Telegram. This used to POST to n8n, which called a qwen3:4b on
    # CPU to reword the alert and then sent it on. That put two processes that
    # can hang between an alert firing and the phone buzzing, and the model could
    # add nothing Alertmanager did not already have - the annotations above are
    # written by hand and already name the cause. On 2026-09-07 the alert that
    # started the etcd investigation arrived reading "(AI triage unavailable)":
    # the model was down, the alert was fine without it. Had n8n itself been
    # down, nothing would have arrived at all, and silence reads like health.
    #
    # No parseMode on purpose. HTML or Markdown means Telegram rejects the whole
    # message if any annotation contains an unescaped <, & or *, and the failure
    # is a dropped alert. Plain text cannot fail that way.
    #
    # chatID is an integer literal because the CRD types it that way - it cannot
    # be a secretRef. That is fine: the chat id identifies a conversation, it
    # does not authorise anything. The bot token is what authorises, and that
    # stays in the secret.
    - name: telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-secret
            key: TELEGRAM_BOT_TOKEN
          chatID: 7385893017
          sendResolved: true
          message: |-
            {{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }} — {{ .CommonLabels.alertname }}
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}