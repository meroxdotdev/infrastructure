# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  namespace: observability
spec:
  route:
    # "id" splits each Proxmox VM/node into its own group - without it, one
    # VM restarting re-flushes the whole alertname+job group, resending
    # Telegram messages for other VMs that already got announced (still
    # inside their own 10m firing window). Alerts without an "id" label
    # (dockerhub/oom rules) just group as before, empty-id is uniform.
    groupBy: ["alertname", "job", "id"]
    groupInterval: 10m
    groupWait: 1m
    receiver: "null"
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      - receiver: heartbeat
        repeatInterval: 1m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      - receiver: n8n
        matchers:
          - name: severity
            value: "critical|warning"
            matchType: "=~"
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning
          matchType: "="
  receivers:
    - name: "null"
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: alertmanager-secret
            key: ALERTMANAGER_HEARTBEAT_URL
    - name: n8n
      webhookConfigs:
        - url: http://n8n.default.svc.cluster.local:8080/webhook/alertmanager
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-secret
                key: N8N_WEBHOOK_SECRET