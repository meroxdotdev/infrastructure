---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
# flux-system is the GitOps control plane: source-controller pulls this repo
# and any Helm charts, kustomize/helm-controller apply whatever it finds,
# notification-controller relays alerts AND receives the GitHub webhook.
# A compromise here is a supply-chain attack on the whole cluster — tighter
# default than kubernetes/apps/default/network-policy.yaml: no blanket
# `world` allow, only notification-controller gets it (needed for the
# GitHub webhook via flux-webhook.${SECRET_DOMAIN}, see flux-instance/app/
# httproute.yaml + receiver.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-lateral
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
---
# notification-controller has two separate audiences, missed the second one
# on the first pass and it stalled every Kustomization/HelmRelease reconcile
# cluster-wide (they all POST an event here after every run via
# --events-addr, non-fatal but each failed POST is 5 retries with backoff —
# caught via kustomize-controller logs full of "unable to record event"):
#   1. the GitHub webhook, from the internet through Cilium Gateway/Envoy —
#      which sources as the `ingress` reserved entity, distinct from
#      `world` (also missed initially, caught via `hubble observe
#      --verdict DROPPED`).
#   2. every kustomize-controller/helm-controller in the cluster, posting
#      reconciliation events — pod-to-pod, not world/ingress at all.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notification-controller-ingress
spec:
  endpointSelector:
    matchLabels:
      app: notification-controller
  ingress:
    - fromEntities:
        - world
        - ingress
    - fromEndpoints:
        - matchLabels:
            app: kustomize-controller
        - matchLabels:
            app: helm-controller
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
# kustomize-controller and helm-controller pull prepared Git/Helm artifacts
# from source-controller on every reconciliation, over its `http` container
# port (9090) — NOT the Service's port 80, which is just an external remap;
# CiliumNetworkPolicy enforces on the pod's real port. First version of this
# rule had 80 and silently broke every reconciliation in the cluster within
# minutes of rollout — caught via `hubble observe --verdict DROPPED`, not
# guessed right the first time.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: source-controller-ingress
spec:
  endpointSelector:
    matchLabels:
      app: source-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: kustomize-controller
        - matchLabels:
            app: helm-controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# Prometheus (observability namespace) scrapes flux-operator via its own
# ServiceMonitor — confirmed live via `hubble observe`. It's the only Flux
# component with one; the other controllers aren't scraped.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
