---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
components:
  - ../../components/common
resources:
  # Networking
  - ./cilium/ks.yaml
  - ./coredns/ks.yaml
  # Storage
  - ./csi-driver-nfs/ks.yaml
  # Hardware
  # No Intel counterpart to this: Jellyfin reaches the Beelink's iGPU through a
  # plain /dev/dri hostPath rather than a device plugin, so that it can still
  # schedule (and transcode in software) on a node without a GPU. See its
  # helmrelease and docs/gpu-transcoding.md.
  #
  # nvidia is on its way out with the Quadro P2200 — nothing requests
  # nvidia.com/gpu any more. Both go once QuickSync has proven itself.
  - ./nvidia-device-plugin/ks.yaml
  # Utilities
  - ./metrics-server/ks.yaml
  - ./reloader/ks.yaml
  # Removed 2026-08-17 with the move to a single node: spegel is a peer-to-peer
  # image cache *between* nodes, so with one node it has no peer to serve or
  # fetch from. See talos/SINGLE-NODE.md.
