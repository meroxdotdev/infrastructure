---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  LONGHORN_NS: longhorn-system

tasks:
  restore:
    desc: Restore Longhorn volumes from S3 backup (run AFTER bootstrap:apps, BEFORE apps reconcile)
    summary: |
      Full Phase 2 Longhorn restore procedure for Longhorn 1.11.2+.

      Run ONCE after: task bootstrap:apps
      Run BEFORE:     Flux reconciles any app HelmReleases

      What it does:
        1. Patches the BackupTarget CRD (required in 1.11.2 — no longer a Setting)
        2. Waits for BackupVolumes to sync from S3
        3. Creates restore Volume CRDs in longhorn-system (fromBackup)
        4. Waits for replicas to initialize
        5. Applies pvs.yaml with correct claimRefs
        6. Removes duplicate default/longhorn HelmRelease if present
        7. Creates prometheus + alertmanager PVCs manually (StatefulSet quirk)
        8. Force-reconciles all app HelmReleases
        9. Clears HelmReleases left stalled by the volume-attach race

      After this task: all pods should start within ~5 min.

      NOTE: Only PVCs in the "media" recurring-job-group are backed up (the
      group name predates Immich; it just means "worth Longhorn-backing-up",
      not literally media-only). Every one of them is restored here — keep
      those two lists identical, or DR silently discards data that was
      backed up every night. Cache volumes and ALL observability volumes
      (prometheus, loki, grafana, alertmanager, netdata) start empty —
      history is deliberately not backed up.

      Immich's photos ARE covered: immich-library-ssd is the UPLOAD_LOCATION
      and a plain Longhorn PVC, not an NFS mount. An earlier version of this
      note claimed otherwise and the restore list matched the claim, so
      every DR lost the whole photo library. Fixed 2026-08-29.

      After pods are up, run: task longhorn:post-restore-jellyfin
      to re-trigger Jellyfin metadata+image downloads (~10 min).
    cmds:
      - task: patch-backup-target
      - task: wait-for-backup-volumes
      - task: restore-all-volumes
      - task: wait-for-replicas
      - task: unbind-premature-dynamic-pvcs
      - task: apply-pvs
      - task: fix-pvc-ownership
      - task: fix-duplicate-longhorn
      - task: create-statefulset-pvcs
      - task: reconcile-apps
      - task: clear-stalled-helmreleases
      - echo ""
      - echo "✓ Longhorn restore complete. Watch pods start:"
      - echo "  kubectl get pods -A --watch"

  patch-backup-target:
    desc: Patch Longhorn BackupTarget CRD (required in Longhorn 1.11.2+)
    cmds:
      - |
        echo "→ Patching BackupTarget CRD..."
        kubectl patch backuptarget default -n {{.LONGHORN_NS}} --type merge \
          -p '{"spec":{"backupTargetURL":"s3://longhorn@us-east-1/","credentialSecret":"minio-secret","pollInterval":"300s"}}' 2>/dev/null \
          && echo "  ✓ BackupTarget patched" \
          || echo "  ✓ BackupTarget already configured"
    silent: true

  wait-for-backup-volumes:
    desc: Wait until BackupVolumes sync from S3 and Backup CRs have URLs (~60-90s after BackupTarget patch)
    cmds:
      - |
        echo "→ Waiting for BackupVolumes to sync from S3..."
        for i in $(seq 1 30); do
          COUNT=$(kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}} 2>/dev/null | grep -c "restored" || true)
          if [ "$COUNT" -ge 5 ]; then
            echo "  ✓ $COUNT backup volumes found"
            break
          fi
          echo "  ... $COUNT/5+ found, waiting 10s (attempt $i/30)"
          sleep 10
        done
        COUNT=$(kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}} 2>/dev/null | grep -c "restored" || true)
        if [ "$COUNT" -lt 5 ]; then
          echo "  ✗ Only $COUNT backup volumes found after 5 min. Check S3 connectivity."
          echo "    kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}}"
          exit 1
        fi

        echo "→ Waiting for Backup CRs to populate URLs (avoid race condition)..."
        for i in $(seq 1 20); do
          BNAME=$(kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}} \
            --no-headers 2>/dev/null | awk '{print $1}' | grep "^jellyfin-restored-" | head -1)
          LAST=$(kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}} "$BNAME" \
            -o jsonpath='{.status.lastBackupName}' 2>/dev/null)
          if [ -n "$LAST" ]; then
            URL=$(kubectl get backups.longhorn.io "$LAST" -n {{.LONGHORN_NS}} \
              -o jsonpath='{.status.url}' 2>/dev/null)
            if [ -n "$URL" ]; then
              echo "  ✓ Backup CRs ready (jellyfin URL confirmed)"
              break
            fi
          fi
          echo "  ... Backup CRs not ready yet (attempt $i/20)"
          sleep 10
        done
    silent: true

  clear-stalled-helmreleases:
    internal: true
    desc: Reset HelmReleases that failed while volumes were still attaching
    summary: |
      bootstrap:apps reconciles every app before the volumes exist, so Helm
      times out and the HelmRelease keeps a permanent "Helm upgrade failed"
      status even after the pods come up healthy. A plain `flux reconcile`
      re-runs against the same stalled state and changes nothing; --reset
      clears the failure counter first. Without this the operator is left
      staring at a wall of False HelmReleases over a working cluster.

      Waits for the pods to settle first. A large volume (the 43 GiB Immich
      external library) can take ~12 min to pull down from S3, and resetting
      before its pod exists just re-stalls the same HelmRelease.
    cmds:
      - |
        echo ""
        echo "→ Waiting for pods to settle before clearing HelmReleases..."
        for i in $(seq 1 40); do
          BUSY=$(kubectl get pods -A --no-headers 2>/dev/null \
                 | grep -c "ContainerCreating\|Init:\|PodInitializing" || true)
          [ "$BUSY" -eq 0 ] && break
          [ $((i % 4)) -eq 0 ] && echo "  [$((i / 2)) min] $BUSY pod(s) still starting"
          sleep 30
        done

        echo "→ Clearing HelmReleases stalled by the volume-attach race..."
        stalled=$(kubectl get helmreleases -A --no-headers | grep -v True | awk '{print $2":"$1}')
        if [ -z "$stalled" ]; then echo "  ✓ None stalled"; exit 0; fi
        for hr in $stalled; do
          flux reconcile helmrelease "${hr%%:*}" -n "${hr##*:}" --reset --timeout=180s >/dev/null 2>&1 &
        done
        wait
        left=$(kubectl get helmreleases -A --no-headers | grep -v True | wc -l | tr -d ' ')
        echo "  ✓ Cleared; $left still not Ready (expect only GPU-bound apps on GPU-less hardware)"
    silent: true

  restore-all-volumes:
    desc: Create all restore Volume CRDs in longhorn-system
    cmds:
      - task: restore-volume
        vars: { NAME: jellyfin-restored }
      - task: restore-volume
        vars: { NAME: prowlarr-restored }
      - task: restore-volume
        vars: { NAME: radarr-restored }
      - task: restore-volume
        vars: { NAME: sonarr-restored }
      - task: restore-volume
        vars: { NAME: immich-postgres-restored, PVC_NAME: immich-postgres }
      - task: restore-volume
        vars: { NAME: n8n-restored, PVC_NAME: n8n }
      # Restored again since 2026-08-29. The nightly `media` job does back
      # both up (2 GiB / 5 GiB confirmed in Garage), so the old "dropped
      # 2026-07-21" note was stale: pvs.yaml shipped static PVs pointing at
      # Longhorn volumes nothing ever created, and both pods hung in
      # ContainerCreating on every from-scratch restore.
      - task: restore-volume
        vars: { NAME: jellyseerr-restored }
      - task: restore-volume
        vars: { NAME: qbittorrent-restored }
      # The Immich libraries carry the actual photos. Both are labelled for
      # the nightly `media` job and were present in Garage (21 GiB / 43 GiB)
      # while the restore ignored them, so a real DR silently lost every
      # photo and immich-server crashlooped on the empty /data tree.
      - task: restore-volume
        vars: { NAME: immich-library-restored, PVC_NAME: immich-library-ssd }
      - task: restore-volume
        vars: { NAME: immich-external-library-restored, PVC_NAME: immich-external-library-ssd }
      # The public stack, backed up since 2026-08-30. Both PVCs are
      # dynamically provisioned, so the backup is found by pvcName rather than
      # by volume-name prefix — hence PVC_NAME, same as immich-postgres/n8n.
      # jellyfin-public carries the NVENC setting, which fails silently when
      # lost; radarr-public carries the movie list, which is what makes a
      # rebuild a re-download instead of guesswork.
      - task: restore-volume
        vars: { NAME: jellyfin-public-restored, PVC_NAME: jellyfin-public }
      - task: restore-volume
        vars: { NAME: radarr-public-restored, PVC_NAME: radarr-public }
      # Observability (loki/prometheus/grafana) is no longer backed up —
      # those PVCs are provisioned fresh (see create-statefulset-pvcs).

  restore-volume:
    internal: true
    desc: Create a single restore Volume CRD from latest S3 backup
    summary: |
      BackupVolume names normally match "{volume-name}-{hash}" for volumes
      with a pinned Longhorn volume name (jellyfin/prowlarr/radarr/sonarr).
      Dynamically-provisioned PVCs (StatefulSet/Deployment volumeClaimTemplate,
      e.g. immich-postgres, n8n) get an auto-generated "pvc-<uuid>-{hash}"
      BackupVolume name instead — pass PVC_NAME to look those up by the
      KubernetesStatus.pvcName label instead of by name prefix.
      Discovered 2026-08-03: without this fallback, a plain no-match grep
      exits 1 and (under this script's implicit errexit) aborts the whole
      restore silently after this volume's "Restoring..." line.
    vars:
      NAME: '{{.NAME}}'
      PVC_NAME: '{{.PVC_NAME | default .NAME}}'
    cmds:
      - |
        echo "→ Restoring {{.NAME}}..."

        # Find BackupVolume for this volume (name format: {volume-name}-{hash})
        BV_NAME=$(kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}} \
          --no-headers 2>/dev/null | awk '{print $1}' | grep "^{{.NAME}}-" | head -1 || true)

        if [ -z "$BV_NAME" ]; then
          # Fall back to matching by source PVC name (dynamically-provisioned volumes)
          BV_NAME=$(kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}} -o json 2>/dev/null | \
            python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        for item in data.get('items', []):
            labels = item.get('status', {}).get('labels', {}) or {}
            ks = labels.get('KubernetesStatus', '')
            try:
                if json.loads(ks).get('pvcName') == '{{.PVC_NAME}}':
                    print(item['metadata']['name'])
                    break
            except Exception:
                continue
        " || true)
        fi

        if [ -z "$BV_NAME" ]; then
          echo "  ✗ No BackupVolume found for {{.NAME}} (pvcName={{.PVC_NAME}}) — skipping"
          echo "    Check: kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}}"
          exit 0
        fi

        # Get latest backup URL from BackupVolume status (Longhorn 1.12.0+: lastBackupURL removed)
        BACKUP_NAME=$(kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}} "$BV_NAME" \
          -o jsonpath='{.status.lastBackupName}' 2>/dev/null)
        BACKUP_URL=""
        if [ -n "$BACKUP_NAME" ]; then
          BACKUP_URL=$(kubectl get backups.longhorn.io "$BACKUP_NAME" -n {{.LONGHORN_NS}} \
            -o jsonpath='{.status.url}' 2>/dev/null)
        fi

        if [ -z "$BACKUP_URL" ]; then
          echo "  ✗ No backup URL in BackupVolume $BV_NAME — skipping"
          exit 0
        fi

        SIZE=$(kubectl get backupvolumes.longhorn.io -n {{.LONGHORN_NS}} "$BV_NAME" \
          -o jsonpath='{.status.size}' 2>/dev/null)

        echo "  backup: $BACKUP_URL"

        # Check if Volume already exists
        if kubectl get volumes.longhorn.io {{.NAME}} -n {{.LONGHORN_NS}} &>/dev/null; then
          echo "  ✓ Volume already exists, skipping"
          exit 0
        fi

        # Replica count matches the cluster being restored onto (1 on prod today,
        # 3 on a DR drill) — capped at 3, Longhorn's own best-practice ceiling.
        NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
        REPLICAS=$(( NODE_COUNT < 3 ? NODE_COUNT : 3 ))

        # Create Volume CRD in longhorn-system (NOT in default — manager ignores default)
        kubectl apply -f - <<EOF
        apiVersion: longhorn.io/v1beta2
        kind: Volume
        metadata:
          name: {{.NAME}}
          namespace: {{.LONGHORN_NS}}
        spec:
          numberOfReplicas: $REPLICAS
          frontend: blockdev
          fromBackup: "$BACKUP_URL"
          restoreVolumeRecurringJob: enabled
          accessMode: rwo
          dataEngine: v1
        EOF
        echo "  ✓ Volume {{.NAME}} restore initiated"
    silent: true

  wait-for-replicas:
    desc: Wait until all restore volumes have replicas initialized (~60s)
    cmds:
      - |
        echo "→ Waiting for restore volume replicas to initialize..."
        VOLUMES="jellyfin-restored prowlarr-restored radarr-restored sonarr-restored immich-postgres-restored n8n-restored jellyfin-public-restored radarr-public-restored"
        for i in $(seq 1 12); do
          ALL_READY=true
          for VOL in $VOLUMES; do
            REPLICA_COUNT=$(kubectl get replicas.longhorn.io -n {{.LONGHORN_NS}} \
              --no-headers 2>/dev/null | grep "^${VOL}-" | wc -l)
            if [ "$REPLICA_COUNT" -lt 1 ]; then
              ALL_READY=false
              break
            fi
          done
          if $ALL_READY; then
            echo "  ✓ All restore volumes have replicas"
            break
          fi
          echo "  ... replicas not all ready yet (attempt $i/12)"
          sleep 10
        done
    silent: true

  unbind-premature-dynamic-pvcs:
    desc: Unbind any PVC that Flux bound to a fresh empty volume before the restore ran
    summary: |
      bootstrap:apps reconciles every Kustomization before this restore runs.
      A PVC with no pinned volumeName gets dynamic-provisioned an empty volume
      immediately, "winning" the race against the restored one — the PVC then
      reports Bound and looks healthy while the restored data sits detached
      and unused. That is how the entire Immich photo library was silently
      discarded on every DR before 2026-08-29.

      The list of PVCs to check is derived from pvs.yaml's claimRefs, so it
      cannot drift from the PVs it is protecting. Whatever pvs.yaml claims,
      this guards. Deleting the PVC (and any pod holding it) lets apply-pvs
      bind it to the right volume when reconcile-apps recreates it.
    cmds:
      - |
        echo "→ Checking for PVCs bound ahead of the restore..."
        yq -r 'select(.kind == "PersistentVolume")
               | [.metadata.name, .spec.claimRef.namespace, .spec.claimRef.name]
               | @tsv' kubernetes/apps/storage/restore-pvs/pvs.yaml \
        | while IFS=$'\t' read -r PV NS PVC; do
            VOL=$(kubectl get pvc "$PVC" -n "$NS" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)
            if [ -z "$VOL" ]; then
              echo "  ✓ $PVC: not created yet, nothing to unbind"
            elif [ "$VOL" = "$PV" ]; then
              echo "  ✓ $PVC: already bound to $PV"
            else
              echo "  ! $PVC: bound to $VOL, expected $PV — unbinding"
              for POD in $(kubectl describe pvc "$PVC" -n "$NS" 2>/dev/null \
                           | awk '/^Used By:/{print $3} /^ +[a-z0-9-]+$/{print $1}'); do
                kubectl delete pod "$POD" -n "$NS" --ignore-not-found >/dev/null 2>&1 || true
              done
              kubectl delete pvc "$PVC" -n "$NS" --wait=true >/dev/null 2>&1 || true
              echo "  ✓ $PVC: unbound, reconcile-apps will rebind it to $PV"
            fi
          done
    silent: true

  apply-pvs:
    desc: Apply PersistentVolume manifests with correct claimRefs
    cmds:
      - |
        echo "→ Applying PV manifests..."
        kubectl apply -k kubernetes/apps/storage/restore-pvs/
        echo "  ✓ PVs applied"
        echo "  Waiting 10s for PVs to register..."
        sleep 10
        echo "  PV status:"
        kubectl get pv 2>/dev/null | grep restored | awk '{print "   "$1, $5, $6}'
    silent: true

  fix-pvc-ownership:
    desc: Transfer volumeName field ownership from kustomize-controller to stable pvc-owner manager
    summary: |
      After pvs.yaml binds PVCs to restored PVs, kustomize-controller (Flux SSA) may have
      previously owned the volumeName field (from an old pvc.yaml that had volumeName hardcoded).
      When the new pvc.yaml omits volumeName, Flux tries to delete it → immutability error.

      This task re-asserts volumeName with field-manager=pvc-owner so Flux can safely release
      its ownership without triggering the immutable spec constraint.
    cmds:
      - |
        echo "→ Fixing PVC field ownership to prevent Flux SSA volumeName conflicts..."
        for pvc_item in "default:jellyfin" "default:prowlarr" "default:radarr" "default:sonarr" "default:immich-postgres" "default:n8n" "default:jellyfin-public" "default:radarr-public"; do
          NS=${pvc_item%%:*}
          PVC=${pvc_item##*:}
          VOL=$(kubectl get pvc "$PVC" -n "$NS" -o jsonpath='{.spec.volumeName}' 2>/dev/null)
          SIZE=$(kubectl get pvc "$PVC" -n "$NS" -o jsonpath='{.spec.resources.requests.storage}' 2>/dev/null)
          if [ -z "$VOL" ]; then
            echo "  ✓ $PVC: no volumeName (dynamic), skipping"
            continue
          fi
          kubectl apply --server-side --field-manager=pvc-owner -f - <<PVEOF
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: $PVC
          namespace: $NS
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn
          resources:
            requests:
              storage: $SIZE
          volumeName: $VOL
        PVEOF
          echo "  ✓ $PVC: pvc-owner now holds volumeName=$VOL"
        done
    silent: true

  fix-duplicate-longhorn:
    desc: Remove spurious default/longhorn HelmRelease (created by Longhorn 1.11.2 namespace-scoped feature)
    cmds:
      - |
        echo "→ Ensuring deleting-confirmation-flag is set (required for uninstall)..."
        kubectl patch setting deleting-confirmation-flag -n longhorn-system --type=merge -p '{"value":"true"}' 2>/dev/null || \
          kubectl apply -f <(printf 'apiVersion: longhorn.io/v1beta2\nkind: Setting\nmetadata:\n  name: deleting-confirmation-flag\n  namespace: longhorn-system\nvalue: "true"\n') 2>/dev/null || true

        echo "→ Checking for duplicate default/longhorn HelmRelease..."
        if kubectl get helmrelease longhorn -n default &>/dev/null; then
          echo "  ! Found duplicate default/longhorn — removing..."
          kubectl patch helmrelease longhorn -n default -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          kubectl delete helmrelease longhorn -n default --force --grace-period=0 2>/dev/null || true
          helm uninstall longhorn -n default 2>/dev/null || true
          # Force-delete deployments/daemonsets left behind
          kubectl delete deployment csi-attacher csi-provisioner csi-resizer \
            csi-snapshotter longhorn-driver-deployer longhorn-ui \
            -n default --ignore-not-found 2>/dev/null || true
          kubectl delete daemonset longhorn-manager longhorn-csi-plugin \
            -n default --ignore-not-found 2>/dev/null || true
          echo "  ✓ Duplicate removed"

          echo "  → Restarting longhorn-csi-plugin to re-register CSI driver..."
          kubectl rollout restart daemonset/longhorn-csi-plugin -n {{.LONGHORN_NS}}
          kubectl rollout status daemonset/longhorn-csi-plugin -n {{.LONGHORN_NS}} --timeout=60s

          echo "  Verifying driver.longhorn.io registered on nodes..."
          NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
          for i in $(seq 1 10); do
            REGISTERED=$(kubectl get csinodes -o json 2>/dev/null | \
              python3 -c "import json,sys; d=json.load(sys.stdin); \
              nodes=[n for n in d['items'] if any(drv['name']=='driver.longhorn.io' for drv in n['spec']['drivers'])]; \
              print(len(nodes))" 2>/dev/null || echo 0)
            if [ "$REGISTERED" -eq "$NODE_COUNT" ]; then
              echo "  ✓ driver.longhorn.io registered on all $NODE_COUNT node(s)"
              break
            fi
            echo "  ... registered on $REGISTERED/$NODE_COUNT nodes (attempt $i/10)"
            sleep 6
          done
        else
          echo "  ✓ No duplicate found"
        fi
    silent: true

  create-statefulset-pvcs:
    desc: Create fresh StatefulSet PVCs (prometheus, alertmanager) — observability is not restored from backup
    summary: |
      Observability volumes (prometheus, loki, grafana, alertmanager) are
      deliberately not backed up, so on DR they all start empty:
      - grafana (Deployment) and loki (StatefulSet) PVCs are created
        dynamically by their HelmReleases — nothing to do here.
      - prometheus + alertmanager (prometheus-operator StatefulSets) need
        their PVCs pre-created or pods stay Pending (operator quirk).

      A leftover prometheus-restored-pv from a pre-2026-06 restore would
      pre-claim the prometheus PVC and block it (its Longhorn volume no longer
      exists) — delete it first if present and unbound.

      Must run BEFORE reconcile-apps so HelmReleases see the correct PVCs on startup.
    cmds:
      - |
        echo "→ Creating fresh observability StatefulSet PVCs..."

        # Remove dead legacy PV that would pre-claim the prometheus PVC
        PV_STATUS=$(kubectl get pv prometheus-restored-pv -o jsonpath='{.status.phase}' 2>/dev/null || true)
        if [ -n "$PV_STATUS" ] && [ "$PV_STATUS" != "Bound" ] && \
           ! kubectl get volumes.longhorn.io prometheus-restored -n {{.LONGHORN_NS}} &>/dev/null; then
          echo "  ! Removing dead prometheus-restored-pv (no backing Longhorn volume)..."
          kubectl delete pv prometheus-restored-pv --ignore-not-found
        fi

        create_fresh_pvc() {
          local PVC=$1 SIZE=$2
          if kubectl get pvc "$PVC" -n observability &>/dev/null; then
            echo "  ✓ $PVC already exists"
            return
          fi
          kubectl apply -f - <<PVEOF
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: $PVC
          namespace: observability
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: longhorn
          resources:
            requests:
              storage: $SIZE
        PVEOF
          echo "  ✓ $PVC created (fresh, no backup)"
        }

        create_fresh_pvc "prometheus-kube-prometheus-stack-db-prometheus-kube-prometheus-stack-0" "15Gi"
        create_fresh_pvc "alertmanager-kube-prometheus-stack-db-alertmanager-kube-prometheus-stack-0" "1Gi"
    silent: true

  reconcile-apps:
    desc: Force-reconcile all app kustomizations and HelmReleases
    cmds:
      - |
        echo "→ Force-reconciling Flux kustomizations..."
        flux reconcile kustomization cluster-apps 2>/dev/null || true
        sleep 5

        echo "→ Reconciling app Kustomizations (creates cache PVCs + HelmReleases)..."
        for app in jellyfin jellyfin-public jellyseerr prowlarr qbittorrent radarr radarr-public sonarr immich n8n; do
          flux reconcile kustomization $app -n default 2>/dev/null &
        done
        wait

        echo "→ Reconciling media stack HelmReleases..."
        for app in jellyfin jellyfin-public jellyseerr prowlarr qbittorrent radarr radarr-public sonarr immich-postgres immich n8n; do
          flux reconcile helmrelease $app -n default 2>/dev/null &
        done
        wait

        echo "→ Reconciling observability HelmReleases..."
        for app in grafana loki kube-prometheus-stack; do
          flux reconcile helmrelease $app -n observability 2>/dev/null &
        done
        wait

        echo "  ✓ Reconciliation triggered"
        echo "  Monitor with: kubectl get helmreleases -A"
    silent: true

  status:
    desc: Check status of restore volumes and app pods
    cmds:
      - |
        echo "=== Longhorn Volumes ==="
        kubectl get volumes.longhorn.io -n {{.LONGHORN_NS}} 2>/dev/null | grep restored
        echo ""
        echo "=== PV Bindings ==="
        kubectl get pv 2>/dev/null | grep restored
        echo ""
        echo "=== PVCs ==="
        kubectl get pvc -A 2>/dev/null | grep -v Bound | grep -v NAME
        echo ""
        echo "=== Failed HelmReleases ==="
        kubectl get helmreleases -A 2>/dev/null | grep -v "True\|READY"

  post-restore-jellyfin:
    desc: Re-trigger Jellyfin metadata+image refresh after DR restore (jellyfin-cache PVC starts empty)
    summary: |
      Run this AFTER task longhorn:restore, once Jellyfin pod is Running.

      jellyfin-cache is backed up but stored under a dynamic Longhorn volume name,
      so the restore task cannot find it. This task re-triggers image downloads
      from TMDB/TVDB for all libraries (~10 min to complete in background).

      Reads the API key from the Jellyfin SQLite DB — no manual token needed.
    cmds:
      - |
        echo "→ Waiting for Jellyfin pod to be Ready..."
        kubectl wait pod -n default -l app.kubernetes.io/name=jellyfin \
          --for=condition=Ready --timeout=300s

        POD=$(kubectl get pod -n default -l app.kubernetes.io/name=jellyfin \
          -o jsonpath='{.items[0].metadata.name}')
        echo "  pod: $POD"

        echo "→ Copying Jellyfin DB to read API key..."
        TMP_DB=$(mktemp --suffix=.db)
        kubectl cp "default/${POD}:/config/data/jellyfin.db" "$TMP_DB" 2>/dev/null
        TOKEN=$(python3 -c "import sqlite3; conn=sqlite3.connect('$TMP_DB'); row=conn.execute('SELECT AccessToken FROM ApiKeys ORDER BY DateCreated DESC LIMIT 1').fetchone(); print(row[0] if row else '')")
        rm -f "$TMP_DB"

        if [ -z "$TOKEN" ]; then
          echo "  ✗ No API key in Jellyfin DB. Go to Admin → API Keys and create one first."
          exit 1
        fi
        echo "  ✓ API key found"

        echo "→ Triggering FullRefresh on all Jellyfin libraries..."
        LIBS=$(curl -sf "https://media.merox.dev/Library/VirtualFolders" \
          -H "Authorization: MediaBrowser Token=\"$TOKEN\"")

        echo "$LIBS" | python3 -c "import json,sys; [print('  library: '+l['Name']+' ('+l['ItemId']+')') for l in json.load(sys.stdin)]"

        for ID in $(echo "$LIBS" | python3 -c "import json,sys; [print(l['ItemId']) for l in json.load(sys.stdin)]"); do
          curl -sf -X POST \
            "https://media.merox.dev/Items/${ID}/Refresh?metadataRefreshMode=FullRefresh&imageRefreshMode=FullRefresh&replaceAllMetadata=false&replaceAllImages=false" \
            -H "Authorization: MediaBrowser Token=\"$TOKEN\"" > /dev/null
          echo "  ✓ $ID refresh triggered"
        done

        echo ""
        echo "✓ Jellyfin image refresh running in background. Images appear within ~10 min."
        echo "  Monitor: kubectl exec -n default $POD -- find /config/metadata -name '*.jpg' | wc -l"
    silent: true

  clean-orphan-volumes:
    desc: Delete leftover faulted pvc-xxxx volumes from default namespace (safe to run after restore)
    cmds:
      - |
        echo "→ Cleaning orphan faulted volumes from default namespace..."
        VOLS=$(kubectl get volumes.longhorn.io -n default --no-headers 2>/dev/null \
          | grep -E "faulted|creating" | awk '{print $1}')
        if [ -z "$VOLS" ]; then
          echo "  ✓ No orphan volumes found"
          exit 0
        fi
        for v in $VOLS; do
          echo "  Removing finalizer + deleting: $v"
          kubectl patch volumes.longhorn.io $v -n default \
            -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          kubectl delete volumes.longhorn.io $v -n default --ignore-not-found 2>/dev/null || true
        done
        echo "  ✓ Done"
    silent: true
