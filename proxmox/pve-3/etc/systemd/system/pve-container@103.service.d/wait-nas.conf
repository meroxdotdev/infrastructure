# Garage's data directory is a bind mount from the NAS (storage nas-backups).
# At boot pve-guests starts CT 103 before pvestatd has mounted the share, and
# the start fails (2026-10-05). Wait up to two minutes for the mount instead.
[Service]
ExecStartPre=/bin/sh -c "for i in $(seq 120); do mountpoint -q /mnt/pve/nas-backups && exit 0; sleep 1; done; exit 1"
