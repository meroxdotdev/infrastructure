# The UPS is on this host, so the shutdown is local and needs no second
# machine.
#
# PowerPanel/pwrstatd could not read this UPS here: the R730xd is EHCI-only and
# the low-speed device re-enumerates every ~11s through the internal hub TT.
# NUT talks libusb and rides through that churn - it is the reason this works.
MONITOR ups@10.57.57.254 1 upsslave REDACTED-SEE-pve-1-upsd.users secondary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
# Set explicitly: /lib/systemd/system-shutdown/nutshutdown looks for this file
# at the end of shutdown and only then runs upsdrvctl shutdown, which is what
# tells the UPS to cut output. Without it the hosts go down and nothing ever
# powers them back up.
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 45
RBWARNTIME 43200
NOCOMMWARNTIME 300
FINALDELAY 5
