# Secondary of pve-1 since 2026-09-29. Shuts this host down on low battery;
# pve-1 waits for it to log out before cutting the UPS output. The password is
# redacted because this repo is public — see proxmox/pve-1/etc/nut/upsd.users.
MONITOR ups@10.57.57.254 1 upsslave REDACTED-SEE-pve-1-upsd.users secondary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 45
RBWARNTIME 43200
NOCOMMWARNTIME 300
FINALDELAY 5
