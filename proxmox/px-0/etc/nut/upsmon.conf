# Without this, a mains failure shuts pve down gracefully and cuts px-0 dead
# mid-write. That matters more here than on pve: `cluster-storage` is a single
# DRAM-less QLC NVMe, and the Talos worker VM lives on it.
#
# Recovery after the power returns is automatic and needs no NUT: the BIOS is
# set to `State After G3 = S0`, so the box powers on by itself.
#
# The password is redacted here because this repo is public. It lives in
# /etc/nut/upsmon.conf on this host and in /etc/nut/upsd.users on pve, and it
# guards nothing but read-only UPS status on the LAN — if it is ever lost,
# generate a new one and write it to both files. There is nothing to restore.
MONITOR cyberpower@10.57.57.250 1 upsslave REDACTED-SEE-pve-upsd.users slave
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 45
RBWARNTIME 43200
NOCOMMWARNTIME 300
FINALDELAY 5
