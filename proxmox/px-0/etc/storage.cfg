dir: local
	disable
	path /var/lib/vz
	content rootdir,vztmpl,import,images,snippets,backup,iso
	shared 0

dir: local-data
	path /local_data
	content iso,import,vztmpl,snippets
	shared 0

zfspool: cluster-storage
	pool cluster-storage
	content images,rootdir
	mountpoint /cluster-storage
	sparse 1

nfs: synology-nas
	export /volume1/Server
	path /mnt/pve/synology-nas
	server 10.57.57.201
	content backup,images
	prune-backups keep-all=1

nfs: r730xd-backups
	export /media/backups
	path /mnt/pve/r730xd-backups
	server 10.57.57.250
	content backup
	options vers=4

