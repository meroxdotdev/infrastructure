maxretry = 3

# Named `ups` because Synology DSM's UPS client hardcodes that name.
[ups]
    driver = usbhid-ups
    port = auto
    vendorid = 0764
    productid = 0501
    desc = "CyberPower VP700ELCD"
    # The UPS cuts its own output at the end of a power-fail shutdown, so mains
    # returning is a real power cycle and every host boots again. ondelay must
    # exceed offdelay, or power returns to a host still shutting down.
    offdelay = 60
    ondelay = 120
