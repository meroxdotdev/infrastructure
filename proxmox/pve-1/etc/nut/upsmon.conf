# pve-1 is the NUT primary: it runs the driver, and on low battery it waits for
# every secondary to log out (HOSTSYNC) before telling the UPS to cut output.
# That matters here more than anywhere: `cluster-storage` is a single DRAM-less
# QLC NVMe, and the Talos VM lives on it.
#
# Recovery after the power returns needs no NUT: the BIOS is set to
# `State After G3 = S0`, so the box powers on by itself.
#
# The password is redacted because this repo is public; it is in
# /etc/nut/upsd.users on this host.
MONITOR ups@localhost 1 upsmon REDACTED-SEE-upsd.users primary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 45
RBWARNTIME 43200
NOCOMMWARNTIME 300
FINALDELAY 5
POWERDOWNFLAG /run/nut/killpower
