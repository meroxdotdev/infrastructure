# The UPS is on this host's USB since 2026-09-29 (it was on pve-2, the R730xd,
# which is becoming a vault that is off most of the day). netserver so the
# other hosts, the vault and the NAS read it over the LAN.
MODE=netserver

# Self-recovery after a power-fail shutdown, for the case that actually bit on
# 2026-09-03: NUT shuts the hosts down, commands the UPS to cut its output, and
# then mains returns before the UPS acts - so the load is never cycled, there is
# no G3, and nothing powers back on. Every machine stays dead until someone
# presses a button.
#
# /lib/systemd/system-shutdown/nutshutdown reads this and, having commanded the
# shutdown, sleeps this long. If the power really does die the host is simply
# off and comes back on its own when mains returns. If it does not, the host
# reboots itself instead of sitting in limbo.
#
# 600 s: comfortably past offdelay (60 s), and long enough to outlast what is
# left of a battery that already reported "low" before the shutdown began -
# rebooting onto a dying battery would only earn a second, harder crash.
POWEROFF_WAIT=600
