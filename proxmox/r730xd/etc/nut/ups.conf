maxretry = 3
pollinterval = 5

[cyberpower]
    driver = usbhid-ups
    port = auto
    vendorid = 0764
    productid = 0501
    desc = "CyberPower VP700ELCD"
    # R730xd has EHCI-only USB; this low-speed device re-enumerates every ~11s
    # through the internal hub TT. Tolerate the churn instead of fighting it.
    pollfreq = 5
    pollonly = no
    # Make the UPS cut its own output at the end of a power-fail shutdown, so
    # mains returning is a real G3 and every host powers itself back on. NUT
    # shuts hosts down; only this brings them back. ondelay > offdelay is
    # mandatory - otherwise the UPS restores power to a host still shutting
    # down. Defaults were 20/30, too tight against a ~35 s shutdown.
    offdelay = 60
    ondelay = 120
