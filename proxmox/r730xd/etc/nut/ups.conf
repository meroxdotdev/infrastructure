maxretry = 3
pollinterval = 5

[cyberpower]
    driver = usbhid-ups
    port = auto
    vendorid = 0764
    productid = 0501
    desc = "CyberPower VP700ELCD"
    # R730xd has EHCI-only USB; this low-speed device re-enumerates every ~11s
    # through the internal hub TT. Tolerate the churn instead of fighting it.
    pollfreq = 5
    pollonly = no
