# Two LISTEN lines, and both are load-bearing.
#
# Adding a LISTEN replaces the default localhost binding — it does not add to
# it. On 2026-09-01 only the LAN address was set, so px-0 could read the UPS
# but pve's own upsmon, which monitors cyberpower@localhost, got connection
# refused for three hours. The host that physically owns the UPS would not
# have shut down on a power failure. Caught by `upsc cyberpower` failing.
#
# Bind the two explicitly rather than 0.0.0.0: this host also carries a
# Tailscale interface that has no business serving UPS status.
LISTEN 127.0.0.1 3493
LISTEN 10.57.57.250 3493
