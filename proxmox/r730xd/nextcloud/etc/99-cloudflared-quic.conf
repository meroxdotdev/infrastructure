# cloudflared uses QUIC (UDP). The kernel defaults (~208 KiB) are far below the
# 7 MiB the client asks for, so it logs a buffer warning and large transfers
# through the tunnel lose throughput.
# Ref: https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
