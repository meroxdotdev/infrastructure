---
- name: Install Docker on the Garage LXC (CT 103 on pve-3)
  hosts: garage
  become: yes
  gather_facts: yes

  roles:
    - role: docker_setup
      tags: ['docker']

- name: Setup Garage S3-compatible object storage (LAN-only)
  hosts: garage
  become: yes
  gather_facts: yes

  roles:
    - role: garage_setup
      vars:
        garage_webui_enabled: false
        # Meta lives on pve-3's local NVMe; these snapshots land on the NAS
        # next to the data, so losing pve-3 does not make the store unreadable.
        garage_meta_snapshot_interval: "6h"
