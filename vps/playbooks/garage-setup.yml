---
- name: Install Docker on the Garage LXC (CT 103 on pve-3)
  hosts: garage
  become: yes
  gather_facts: yes

  roles:
    - role: docker_setup
      tags: ['docker']

- name: Setup Garage S3-compatible object storage (LAN-only)
  hosts: garage
  become: yes
  gather_facts: yes

  roles:
    - role: garage_setup
      vars:
        garage_webui_enabled: false
