---
# Local staging for all VPS backups (dumps + tars), pushed nightly to R730xd
vps_backup_root: /srv/backups
vps_backup_retention_days: 7

# R730xd (pve) - always-on backup hub, reachable over the Tailscale-routed LAN.
# Plain SSH rsync push, no daemon indirection - that was only needed for
# Synology's patched rsync refusing server-mode over SSH; R730xd is plain
# Debian and has no such restriction. Public key is restricted on the pve side
# via rrsync + from= (see proxmox/r730xd/README.md) - not ansible-managed,
# pve isn't in this inventory.
vps_backup_r730xd_user: root
vps_backup_r730xd_host: 10.57.57.250
vps_backup_r730xd_ssh_key: /root/.ssh/oracle-vps-to-r730xd
vps_backup_r730xd_base: /media/backups/oracle-vps

# Restic landing spot for R730xd -> Oracle VPS, DSM/Synology-independent restore
# path. R730xd pushes here directly over SFTP (restic's sftp backend) - not
# ansible-managed on the R730xd side (pve isn't in this inventory), only the
# receiving side (this dedicated, chrooted, SFTP-only system user) is.
# The private half of this keypair lives on R730xd only, not in this repo -
# see proxmox/r730xd/README.md for the one-time provisioning steps.
vps_backup_restic_user: restic-backup
vps_backup_restic_chroot: /srv/restic-repo
vps_backup_restic_data_dir: /srv/restic-repo/data
vps_backup_restic_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfpCdCt+R3x/LTKky0SXsXxaFcDJnzRHdexHf4aEvmN restic-backup@r730xd"

# Optional healthchecks.io ping URLs (dead-man's-switch, one per job). Empty
# string = pinging silently skipped, so this is safe to deploy before the
# checks exist. Create the checks in the same healthchecks.io account already
# used for the K8s Watchdog heartbeat, then set the matching vault_hc_* var.
# One check for the whole nightly chain, not one per step. Reuses the existing
# vault_hc_backup_push_url — the same healthcheck, renamed to
# `vps-nightly-backup` in the healthchecks.io UI, so no vault edit is needed.
vps_backup_hc_nightly_url: "{{ vault_hc_backup_push_url | default('') }}"
vps_backup_hc_restore_drill_url: "{{ vault_hc_restore_drill_url | default('') }}"

# Monthly restore drill - proves the DB dumps are actually restorable, not
# just that pg_dump/gzip exited 0. Runs well clear of the nightly 01:xx-03:xx
# backup window.
vps_backup_restore_drill_day: "1"
vps_backup_restore_drill_hour: "4"
vps_backup_restore_drill_minute: "0"
