---
# Local staging for all VPS backups (dumps + tars), pushed nightly to the NAS
vps_backup_root: /srv/backups
vps_backup_retention_days: 7

# The NAS, reached over the tailnet through pfSense (grant tag:vps-proxy →
# 10.57.57.201 tcp:22). User and key setup: synology/README.md#users.
vps_backup_nas_user: vps
vps_backup_nas_host: 10.57.57.201
vps_backup_nas_path: /volume1/backups/oracle-vps
# Its private half is the vault variable vault_vps_backup_ssh_key,
# named for its first destination.
vps_backup_ssh_key: /root/.ssh/vps-backup


# Optional healthchecks.io ping URLs (dead-man's-switch, one per job). Empty
# string = pinging silently skipped, so this is safe to deploy before the
# checks exist. Create the checks in the same healthchecks.io account already
# used for the K8s Watchdog heartbeat, then set the matching vault_hc_* var.
# One check for the whole nightly chain, not one per step. Reuses the existing
# vault_hc_backup_push_url — the same healthcheck, renamed to
# `vps-nightly-backup` in the healthchecks.io UI, so no vault edit is needed.
vps_backup_hc_nightly_url: "{{ vault_hc_backup_push_url | default('') }}"
vps_backup_hc_restore_drill_url: "{{ vault_hc_restore_drill_url | default('') }}"

# Monthly restore drill - proves the DB dumps are actually restorable, not
# just that pg_dump/gzip exited 0. Runs well clear of the nightly 01:xx-03:xx
# backup window.
vps_backup_restore_drill_day: "1"
vps_backup_restore_drill_hour: "4"
vps_backup_restore_drill_minute: "0"
