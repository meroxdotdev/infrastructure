---
# VPS backup plumbing: local staging of service state not covered by
# Ansible/git, plus the nightly off-site sync to the Synology NAS.
# Note: the matching password file on the NAS
# (/var/services/homes/admin/.vps-rsync.pass) is NOT managed here — it's
# provisioned once, manually (see role README).

# The Synology HyperBackup leg (Synology -> this VPS's rsync daemon,
# module "synology_backup") was retired 2026-07-26 - the offsite-to-Oracle
# job it did is now covered end-to-end by R730xd's own restic-push-oracle.sh
# (proven via a real restore drill, not just a successful push). rsyncd had
# no other purpose on this VPS, so it stops here rather than leaving a
# server-mode rsync daemon running for nothing.
- name: Stop and disable rsync daemon (no longer needed post-HyperBackup)
  service:
    name: rsync
    state: stopped
    enabled: false
  become: yes
  failed_when: false
  tags: backup

- name: Remove rsyncd config and secrets (HyperBackup retired)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/rsyncd.conf
    - /etc/rsyncd.secrets
  become: yes
  tags: backup

- name: Ensure backup root exists
  file:
    path: "{{ vps_backup_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Ensure /root/.ssh directory exists
  file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy the backup push SSH private key
  copy:
    content: "{{ vault_vps_backup_ssh_key }}"
    dest: "{{ vps_backup_ssh_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: backup

- name: Deploy VPS extras backup script (guacamole/traefik/pihole/homepage/portainer)
  template:
    src: backup-vps-extras.sh.j2
    dest: /usr/local/bin/backup-vps-extras.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy DB restore script (authentik/joplin, interactive or --yes)
  template:
    src: restore-db.sh.j2
    dest: /usr/local/bin/restore-db.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy the push script
  template:
    src: backup-push.sh.j2
    dest: /usr/local/bin/backup-push.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy the restore-pull script (DR)
  template:
    src: restore-pull.sh.j2
    dest: /usr/local/bin/restore-pull.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy restore-extras script (DR)
  template:
    src: restore-extras.sh.j2
    dest: /usr/local/bin/restore-extras.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy Joplin DB backup script
  template:
    src: backup-joplin.sh.j2
    dest: /usr/local/bin/backup-joplin.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Install nightly backup chain wrapper
  template:
    src: nightly-backup.sh.j2
    dest: /usr/local/bin/nightly-backup.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

# Was three cron entries and three healthchecks for one 15-minute sequence.
# They fail as a unit and are investigated as a unit.
- name: Schedule the nightly backup chain (Joplin, extras, push to the NAS)
  cron:
    name: "nightly-backup"
    minute: "45"
    hour: "23"
    job: "/usr/local/bin/nightly-backup.sh >> /var/log/nightly-backup.log 2>&1"
    user: root
  tags: backup

- name: Deploy monthly restore drill script (proves dumps are actually restorable)
  template:
    src: restore-drill.sh.j2
    dest: /usr/local/bin/restore-drill.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Schedule monthly restore drill
  cron:
    name: "restore-drill"
    minute: "{{ vps_backup_restore_drill_minute }}"
    hour: "{{ vps_backup_restore_drill_hour }}"
    day: "{{ vps_backup_restore_drill_day }}"
    job: "/usr/local/bin/restore-drill.sh >> /var/log/restore-drill.log 2>&1"
    user: root
  tags: backup
