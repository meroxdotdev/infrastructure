---
# VPS backup plumbing: local staging of service state not covered by
# Ansible/git, plus the nightly off-site sync to the Synology NAS.
# Note: the matching password file on the NAS
# (/var/services/homes/admin/.vps-rsync.pass) is NOT managed here — it's
# provisioned once, manually (see role README).

- name: Detect Tailscale IP address
  shell: ip -4 addr show tailscale0 | grep inet | awk '{print $2}' | cut -d/ -f1
  register: tailscale_ip_result
  changed_when: false
  failed_when: tailscale_ip_result.stdout == ""
  tags: backup

- name: Set Tailscale IP as fact
  set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout }}"
  tags: backup

- name: Ensure backup root exists
  file:
    path: "{{ vps_backup_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Ensure /root/.ssh directory exists
  file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy R730xd backup push SSH private key
  copy:
    content: "{{ vault_oracle_vps_to_r730xd_ssh_key }}"
    dest: "{{ vps_backup_r730xd_ssh_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: backup

- name: Deploy rsyncd config (HyperBackup target + read-only backup modules)
  template:
    src: rsyncd.conf.j2
    dest: /etc/rsyncd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsync daemon
  tags: backup

- name: Deploy rsyncd secrets file (HyperBackup + NAS pull/push auth)
  copy:
    content: "synology-backup:{{ rsyncd_password }}\n"
    dest: /etc/rsyncd.secrets
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart rsync daemon
  tags: backup

- name: Deploy VPS extras backup script (guacamole/traefik/pihole/openclaw)
  template:
    src: backup-vps-extras.sh.j2
    dest: /usr/local/bin/backup-vps-extras.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy DB restore script (authentik/joplin, interactive or --yes)
  template:
    src: restore-db.sh.j2
    dest: /usr/local/bin/restore-db.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy R730xd push script
  template:
    src: backup-push-r730xd.sh.j2
    dest: /usr/local/bin/backup-push-r730xd.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy restore-pull-from-r730xd script (DR)
  template:
    src: restore-pull-from-r730xd.sh.j2
    dest: /usr/local/bin/restore-pull-from-r730xd.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy restore-extras script (DR)
  template:
    src: restore-extras.sh.j2
    dest: /usr/local/bin/restore-extras.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Deploy Joplin DB backup script
  template:
    src: backup-joplin.sh.j2
    dest: /usr/local/bin/backup-joplin.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Schedule daily Joplin DB backup
  cron:
    name: "joplin-db-backup"
    minute: "20"
    hour: "1"
    job: "/usr/local/bin/backup-joplin.sh >> /var/log/joplin-backup.log 2>&1"
    user: root
  tags: backup

- name: Schedule daily VPS extras backup
  cron:
    name: "vps-extras-backup"
    minute: "30"
    hour: "1"
    job: "/usr/local/bin/backup-vps-extras.sh >> /var/log/vps-extras-backup.log 2>&1"
    user: root
  tags: backup

- name: Schedule nightly backup push to R730xd (always-on hub, no wake
    window to work around - unlike the old Synology-direct path this
    replaces)
  cron:
    name: "backup-push-r730xd"
    minute: "30"
    hour: "3"
    job: "/usr/local/bin/backup-push-r730xd.sh >> /var/log/backup-r730xd.log 2>&1"
    user: root
  tags: backup

# --- restic landing user: R730xd -> Oracle VPS, DSM-independent offsite leg ---
# SFTP-only, chrooted, no shell - restic's sftp backend talks to this over SSH.
# Private key lives on R730xd only (not managed here); see
# proxmox/r730xd/README.md for the one-time push-side setup.

- name: Create restic-backup system group
  group:
    name: "{{ vps_backup_restic_user }}"
    system: true
  tags: backup

- name: Create restic-backup system user (no shell, SFTP-only)
  user:
    name: "{{ vps_backup_restic_user }}"
    group: "{{ vps_backup_restic_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ vps_backup_restic_chroot }}"
    create_home: false
  tags: backup

# sshd ChrootDirectory requires this exact dir (and every component above it)
# to be owned by root and not writable by anyone else - the restic-backup
# user's own writable space is the "data" subdir one level down.
- name: Ensure restic chroot root exists (root-owned, sshd ChrootDirectory requirement)
  file:
    path: "{{ vps_backup_restic_chroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: backup

- name: Ensure restic repo data dir exists (writable by restic-backup)
  file:
    path: "{{ vps_backup_restic_data_dir }}"
    state: directory
    owner: "{{ vps_backup_restic_user }}"
    group: "{{ vps_backup_restic_user }}"
    mode: "0700"
  tags: backup

- name: Ensure restic-backup .ssh dir exists (root-owned - sshd reads authorized_keys pre-chroot)
  file:
    path: "{{ vps_backup_restic_chroot }}/.ssh"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: backup

- name: "Deploy restic-backup authorized_keys (restricted: sftp only, no forwarding/pty)"
  copy:
    content: "restrict {{ vps_backup_restic_public_key }}\n"
    dest: "{{ vps_backup_restic_chroot }}/.ssh/authorized_keys"
    owner: root
    group: root
    mode: "0644"
  tags: backup

- name: Deploy sshd Match block for restic-backup (chroot + force internal-sftp)
  copy:
    content: |
      Match User {{ vps_backup_restic_user }}
          ChrootDirectory {{ vps_backup_restic_chroot }}
          ForceCommand internal-sftp
          AllowTcpForwarding no
          X11Forwarding no
          PermitTTY no
          PasswordAuthentication no
    dest: /etc/ssh/sshd_config.d/restic-backup.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd
  tags: backup

- name: Deploy monthly restore drill script (proves dumps are actually restorable)
  template:
    src: restore-drill.sh.j2
    dest: /usr/local/bin/restore-drill.sh
    owner: root
    group: root
    mode: "0700"
  tags: backup

- name: Schedule monthly restore drill
  cron:
    name: "restore-drill"
    minute: "{{ vps_backup_restore_drill_minute }}"
    hour: "{{ vps_backup_restore_drill_hour }}"
    day: "{{ vps_backup_restore_drill_day }}"
    job: "/usr/local/bin/restore-drill.sh >> /var/log/restore-drill.log 2>&1"
    user: root
  tags: backup
