---
traefik_docker_dir: /srv/docker/oracle-cloud/traefik
traefik_compose_version: "3.8"
# renovate: datasource=docker depName=traefik
traefik_version: "v3.7.13"
traefik_image: "traefik:{{ traefik_version }}"
traefik_network_name: network-cloud-merox
traefik_network_subnet: 172.25.0.0/16
traefik_network_gateway: 172.25.0.1
traefik_container_ip: 172.25.10.2
traefik_domain: "traefik.cloud.merox.dev"
traefik_wildcard_domain: "cloud.merox.dev"
traefik_log_dir: /var/log/traefik

# Address the proxy is published on. Read from facts so a DR rebuild onto a
# new tailnet address needs no edit here; tailscale_expected_ip is the
# documented value dr-verify diffs against and serves as the fallback.
traefik_bind_ip: "{{ ansible_facts.tailscale0.ipv4.address | default(tailscale_expected_ip, true) }}"
