---
ssh_password_auth: "no"
ssh_x11_forwarding: "no"
ssh_max_auth_tries: 3

fail2ban_ssh_maxretry: 5
fail2ban_ssh_bantime: 86400
fail2ban_ssh_findtime: 600

sysctl_swappiness: 10
sysctl_vfs_cache_pressure: 50

docker_log_max_size: "10m"
docker_log_max_file: "3"

tailscale_network: "100.64.0.0/10"

# `no`, not `prohibit-password`. The host has had root SSH off since before this
# role existed, and prohibit-password would re-open it for whoever holds a key in
# /root/.ssh/authorized_keys — which on 2026-09-09 still listed root@px-0, a
# decommissioned host, and one unidentified 2048-bit RSA key. Root has not logged
# in over SSH in the journal's memory. Ansible connects as `ubuntu` and escalates,
# so nothing here needs it.
ssh_permit_root_login: "no"
