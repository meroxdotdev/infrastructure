---
ssh_password_auth: "no"
ssh_x11_forwarding: "no"
ssh_max_auth_tries: 3

fail2ban_ssh_maxretry: 5
fail2ban_ssh_bantime: 86400
fail2ban_ssh_findtime: 600

sysctl_swappiness: 10
sysctl_vfs_cache_pressure: 50

docker_log_max_size: "10m"
docker_log_max_file: "3"

tailscale_network: "100.64.0.0/10"

# Ban repeated failed logins against the public Jellyfin entrypoint.
#
# Not INPUT, where fail2ban's stock actions write, but the chain the public
# traffic actually traverses — same split as geoblock_ro and egress_guard:
#   vps01     DOCKER-USER + container address/port
#   edge-fra  EDGE-INPUT + host port
fail2ban_jellyfin_enabled: true
fail2ban_jellyfin_maxretry: 8
fail2ban_jellyfin_findtime: 600
fail2ban_jellyfin_bantime: 86400
fail2ban_chain: "DOCKER-USER"
fail2ban_target_ip: "172.25.10.2"
fail2ban_target_port: 8443

# healthchecks.io ping URL, without the /fail suffix - the action appends it.
# A ban posts to /fail, which fires the notification channel the backups
# already use. Comes from the vault; see group_vars/vps_servers/vars.yml.
#
# Configure the check with a period of 365 days. healthchecks is a dead man's
# switch: a normal period would alert every day that nobody got banned, which
# is exactly backwards for an event alert.
#
# Known limitation, by design of the tool: healthchecks notifies on state
# *change*. After a ban the check sits at "down", and a second ban will not
# raise a new alert until it is pinged back up. Treat the down state as an
# alert to acknowledge - investigate, then ping the base URL to re-arm:
#
#   curl https://hc-ping.com/<uuid>
#
# Left deliberately manual rather than auto-re-armed. Backgrounding a delayed
# ping inside a fail2ban action is fragile, and a persistent down state is
# harder to miss than a notification that scrolled past.
fail2ban_notify_url: ""

# Defined here as well as in traefik_setup: this role runs first and has to
# create the file before fail2ban starts. Keep the two in step.
traefik_log_dir: /var/log/traefik
