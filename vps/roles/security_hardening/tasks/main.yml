---
- name: Disable SSH password authentication (cloud-init override)
  lineinfile:
    path: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
    regexp: "^PasswordAuthentication"
    line: "PasswordAuthentication {{ ssh_password_auth }}"
    create: yes
  notify: Reload sshd

- name: Harden SSH configuration
  blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED — security_hardening"
    block: |
      PasswordAuthentication {{ ssh_password_auth }}
      X11Forwarding {{ ssh_x11_forwarding }}
      MaxAuthTries {{ ssh_max_auth_tries }}
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin prohibit-password
  notify: Reload sshd

- name: Validate SSH config before reload
  command: sshd -t
  changed_when: false

- name: Install fail2ban and ipset
  apt:
    # ipset is needed by the proxyban action, which keeps banned addresses in
    # a set rather than one iptables rule each.
    name: [fail2ban, ipset]
    state: present
    update_cache: yes

# security_hardening runs in the first play, traefik_setup in the second, so
# the log file does not exist yet on a fresh build. fail2ban refuses to start
# a jail whose logpath is missing, so create it here rather than letting the
# first run fail. Traefik takes it over when it starts.
- name: Ensure the Traefik access log exists for the jail to watch
  ansible.builtin.file:
    path: "{{ traefik_log_dir }}"
    state: directory
    mode: "0750"
  when: fail2ban_jellyfin_enabled

- name: Ensure the access log file exists
  ansible.builtin.copy:
    content: ""
    dest: "{{ traefik_log_dir }}/access.log"
    force: no
    mode: "0640"
  when: fail2ban_jellyfin_enabled

- name: Deploy fail2ban filter for Jellyfin auth failures
  ansible.builtin.template:
    src: filter-jellyfin-auth.conf.j2
    dest: /etc/fail2ban/filter.d/jellyfin-auth.conf
    mode: "0644"
  when: fail2ban_jellyfin_enabled
  notify: Restart fail2ban

# Renamed from `dockeruser` now that the chain is a variable. Stop the jail
# first: actionstop is the only thing that removes the old iptables rule and
# destroys the f2b-jellyfin ipset. Delete the file first and both are orphaned,
# and the new actionstart adds a duplicate rule beside them.
- name: Check for the retired dockeruser ban action
  ansible.builtin.stat:
    path: /etc/fail2ban/action.d/dockeruser.conf
  register: f2b_old_action

- name: Stop the jail so the retired action tears its own rule down
  ansible.builtin.command: fail2ban-client stop jellyfin-auth
  register: f2b_stop_jail
  changed_when: f2b_stop_jail.rc == 0
  failed_when: false
  when: f2b_old_action.stat.exists

- name: Remove the retired dockeruser ban action
  ansible.builtin.file:
    path: /etc/fail2ban/action.d/dockeruser.conf
    state: absent
  when: f2b_old_action.stat.exists
  notify: Restart fail2ban

- name: Deploy the fail2ban ban action
  ansible.builtin.template:
    src: action-proxyban.conf.j2
    dest: /etc/fail2ban/action.d/proxyban.conf
    mode: "0644"
  when: fail2ban_jellyfin_enabled
  notify: Restart fail2ban

- name: Deploy fail2ban jail config
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  systemd:
    name: fail2ban
    enabled: yes
    state: started

- name: Deploy sysctl tuning
  template:
    src: sysctl-tuning.conf.j2
    dest: /etc/sysctl.d/99-cloudlab-tuning.conf
    mode: "0644"
  notify: Apply sysctl

- name: Configure Docker log rotation
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Disable rpcbind (not needed)
  systemd:
    name: "{{ item }}"
    enabled: no
    state: stopped
    masked: yes
  loop:
    - rpcbind
    - rpcbind.socket
  failed_when: false

- name: Disable unnecessary services
  systemd:
    name: "{{ item }}"
    enabled: no
    state: stopped
    masked: yes
  loop:
    - ModemManager
    - iscsid
  failed_when: false
