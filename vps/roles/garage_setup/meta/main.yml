---
# traefik_setup creates the shared "network-cloud-merox" Docker network this
# container attaches to. Only needed when this instance publishes through it
# (garage_webui_enabled) — LAN-only deployments (CT 103 on pve-3) skip it
# entirely.
dependencies:
  - role: traefik_setup
    when: garage_webui_enabled | default(true)
