---
- name: Detect Tailscale IP address
  shell: ip -4 addr show tailscale0 | grep inet | awk '{print $2}' | cut -d/ -f1
  register: tailscale_ip_result
  changed_when: false
  failed_when: tailscale_ip_result.stdout == ""

- name: Set Tailscale IP as fact
  set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout }}"

- name: Ensure app stack directory exists
  ansible.builtin.file:
    path: "{{ app_stack_dir }}"
    state: directory
    mode: '0755'
  become: yes

# Static app-stack files (root compose, Homepage config, Pi-hole static
# lists) live in this repo now - formerly a separate git clone of
# meroxdotdev/cloudlab-merox, retired 2026-07-25. garage/, guacamole/,
# traefik/ are deliberately NOT part of this copy - those already
# have their own dedicated role + template (garage_setup, guacamole_setup,
# traefik_setup) deploying into the same subdirectories, and
# the old git-clone merge was silently overwriting them on every run.
- name: Deploy static app-stack files (root compose, Homepage config, Pi-hole lists)
  ansible.builtin.copy:
    src: app-stack/
    dest: "{{ app_stack_dir }}/"
    mode: preserve
  become: yes
  notify: Restart app stack

- name: Deploy app stack .env file
  template:
    src: env.j2
    dest: "{{ app_stack_dir }}/.env"
    mode: '0600'
    owner: root
    group: root
  become: yes
  notify: Restart app stack

- name: Deploy Homepage widget secrets (homepage.env)
  template:
    src: homepage-env.j2
    dest: "{{ app_stack_dir }}/homepage.env"
    mode: '0600'
    owner: root
    group: root
  become: yes
  notify: Restart app stack

# - network-cloud-merox is created by traefik_setup outside of Compose, so
#   the root compose's own (non-external) network definition would otherwise
#   fail with a com.docker.compose.network label mismatch.
# - portainer's ports/dns are hardcoded in the compose file to the previous
#   server's Tailscale IP, which changes on every DR rebuild.
- name: Deploy docker-compose.override.yml (external network + Tailscale IP)
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ app_stack_dir }}/docker-compose.override.yml"
    mode: '0644'
    owner: root
    group: root
  become: yes
  notify: Restart app stack

- name: Remove superseded idrac-stats cron entry (renamed to homelab-stats)
  ansible.builtin.cron:
    name: "idrac-stats"
    state: absent
  become: yes

- name: Remove superseded idrac-stats script and output dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/idrac-stats.sh
    - "{{ app_stack_dir }}/idrac-stats"
  become: yes

# px-0 is out of scope (hardware retained, not running Proxmox) -
# homelab-stats.sh no longer uses this key, so remove the now-orphaned
# private key from disk rather than leaving stale credential material
# around. Re-add the deploy task (git history) if px-0 comes back.
- name: Remove superseded px-0 UPS status SSH private key
  ansible.builtin.file:
    path: /root/.ssh/vps-to-px0-ups
    state: absent
  become: yes
  no_log: true

- name: Ensure homelab-stats output directory exists
  ansible.builtin.file:
    path: "{{ app_stack_dir }}/homelab-stats"
    state: directory
    mode: '0755'
  become: yes

- name: Deploy R730xd iDRAC + Proxmox storage stats script
  template:
    src: homelab-stats.sh.j2
    dest: /usr/local/bin/homelab-stats.sh
    owner: root
    group: root
    mode: '0700'
  become: yes
  no_log: true

- name: Schedule homelab stats refresh (every 5 min)
  ansible.builtin.cron:
    name: "homelab-stats"
    minute: "*/5"
    job: "/usr/local/bin/homelab-stats.sh >> /var/log/homelab-stats.log 2>&1"
    user: root
  become: yes

- name: Start app stack containers (root compose)
  community.docker.docker_compose_v2:
    project_src: "{{ app_stack_dir }}"
    state: present
    remove_orphans: true
  become: yes
  when: not ansible_check_mode
