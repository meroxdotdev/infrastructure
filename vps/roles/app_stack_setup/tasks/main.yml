---
- name: Detect Tailscale IP address
  shell: ip -4 addr show tailscale0 | grep inet | awk '{print $2}' | cut -d/ -f1
  register: tailscale_ip_result
  changed_when: false
  failed_when: tailscale_ip_result.stdout == ""

- name: Set Tailscale IP as fact
  set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout }}"

- name: Ensure app stack directory exists
  ansible.builtin.file:
    path: "{{ app_stack_dir }}"
    state: directory
    mode: '0755'
  become: yes

# Static app-stack files (root compose, Homepage config, Pi-hole static
# lists) live in this repo now - formerly a separate git clone of
# meroxdotdev/cloudlab-merox, retired 2026-07-25. garage/, guacamole/,
# traefik/ are deliberately NOT part of this copy - those already
# have their own dedicated role + template (garage_setup, guacamole_setup,
# traefik_setup) deploying into the same subdirectories, and
# the old git-clone merge was silently overwriting them on every run.
- name: Deploy static app-stack files (compose, public dashboard, Pi-hole lists)
  ansible.builtin.copy:
    src: app-stack/
    dest: "{{ app_stack_dir }}/"
    mode: preserve
  become: yes
  notify: Restart app stack

- name: Deploy app stack .env file
  template:
    src: env.j2
    dest: "{{ app_stack_dir }}/.env"
    mode: '0600'
    owner: root
    group: root
  become: yes
  notify: Restart app stack

# homepage.env held the widget credentials — Synology, Jellyfin, qBittorrent,
# pfSense, Pi-hole, Proxmox, Cloudflare. Only the private dashboard used them,
# and it is gone: the public one has no widgets at all, and the internal one
# runs in the cluster. Removing the file takes a dozen API keys off this disk.
- name: Remove Homepage widget secrets, no dashboard here uses them
  ansible.builtin.file:
    path: "{{ app_stack_dir }}/homepage.env"
    state: absent
  become: yes
  notify: Restart app stack

# - network-cloud-merox is created by traefik_setup outside of Compose, so
#   the root compose's own (non-external) network definition would otherwise
#   fail with a com.docker.compose.network label mismatch.
# - portainer's ports/dns are hardcoded in the compose file to the previous
#   server's Tailscale IP, which changes on every DR rebuild.
- name: Deploy docker-compose.override.yml (external network + Tailscale IP)
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ app_stack_dir }}/docker-compose.override.yml"
    mode: '0644'
    owner: root
    group: root
  become: yes
  notify: Restart app stack

# homelab-stats.sh no longer uses this key, so remove the now-orphaned
# private key from disk rather than leaving stale credential material around.
- name: Remove superseded UPS status SSH private key
  ansible.builtin.file:
    path: /root/.ssh/vps-to-px0-ups
    state: absent
  become: yes
  no_log: true

# homelab-stats collected iDRAC power, fan RPM and Proxmox pool usage from
# this host every five minutes. From vps01 none of that is reachable: pfSense
# drops 8006, 443 and DNS on 53 from the tailnet, so the script had been logging
# a curl timeout every five minutes and writing nulls. Its only consumer was the
# private Homepage, now replaced by home.k8s.merox.dev inside the cluster, where
# Prometheus already holds every one of those readings. Its alerts went through
# n8n webhooks, removed 2026-09-09.
#
# It also kept the iDRAC password and the Telegram bot token in cleartext in a
# file on disk, which is reason enough on its own.
- name: Remove the homelab-stats collector, its cron entry and its output
  become: yes
  block:
    - ansible.builtin.cron:
        name: "homelab-stats"
        state: absent
        user: root
    - ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/homelab-stats.sh
        - /var/log/homelab-stats.log
        - "{{ app_stack_dir }}/homelab-stats"

- name: Start app stack containers (root compose)
  community.docker.docker_compose_v2:
    project_src: "{{ app_stack_dir }}"
    state: present
    remove_orphans: true
  become: yes
  when: not ansible_check_mode
