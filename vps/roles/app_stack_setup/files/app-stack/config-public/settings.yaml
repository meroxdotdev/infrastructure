---
# The public dashboard. It is the table of contents of the homelab tour:
# https://merox.dev/blog/homelab-tour
#
# Groups below are that post's chapters, in the post's order. A card links to
# the section or the post that explains it, so the page is an index into
# writing that already exists rather than a second description of the same
# stack drifting away from the first.
#
# Nothing here pings anything. No widgets, no docker.sock, no kubeconfig, no
# env_file — that is what makes it safe to serve publicly.
title: Inside merox.dev
description: The homelab, chapter by chapter

theme: dark
color: zinc
iconStyle: flat

favicon: https://merox.dev/assets/img/favicons/favicon-32x32.png

layout:
  # columns is min(items, 4). No group icons: custom.css numbers the chapters
  # and spaces them apart, and an icon next to a one-word heading is a second
  # thing saying what the heading already says. The order below is the chapter
  # numbering, since the counter runs over these groups in this order.
  Network:
    style: column
    columns: 4

  Compute:
    style: column
    columns: 3

  Storage:
    style: column
    columns: 3

  Kubernetes:
    style: column
    columns: 3

  Media:
    style: column
    columns: 4

  Photos & Platform:
    style: column
    columns: 4

  Observability:
    style: column
    columns: 4

  VPS:
    style: column
    columns: 4

  Backup:
    style: column
    columns: 4

fullWidth: false
maxGroupColumns: 4
disableCollapse: true
groupsInitiallyCollapsed: false
useEqualHeights: false

headerStyle: clean

quicklaunch:
  searchDescriptions: false
  hideInternetSearch: true
  showSearchSuggestions: false
  hideVisitURL: false
  provider: duckduckgo
  mobileButtonPosition: bottom-right

showStats: false

hideVersion: true
language: en
target: _blank
hideErrors: true

instanceName: merox-public
