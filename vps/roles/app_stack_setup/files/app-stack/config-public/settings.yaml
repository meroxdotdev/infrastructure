---
title: merox.dev
description: Homelab Overview

theme: dark
color: zinc
iconStyle: flat

favicon: https://merox.dev/assets/img/favicons/favicon-32x32.png

layout:
  # Groups follow the README's own six-line summary, in the same order: what
  # it plays, what it stores, what runs it, what keeps it, how it is reached,
  # who it lets in, and how it is watched. columns is min(items, 4), the cap
  # set by maxGroupColumns below.
  Media:
    style: column
    columns: 4
    icon: mdi-filmstrip

  Files & Photos:
    style: column
    columns: 3
    icon: mdi-folder-multiple-image

  Compute:
    style: column
    columns: 4
    icon: mdi-server

  Storage & Backup:
    style: column
    columns: 4
    icon: mdi-database

  Network & Access:
    style: column
    columns: 4
    icon: mdi-server-network

  Identity & Ops:
    style: column
    columns: 4
    icon: mdi-shield-account

  Observability:
    style: column
    columns: 4
    icon: mdi-monitor-dashboard

fullWidth: false
maxGroupColumns: 4
disableCollapse: true
groupsInitiallyCollapsed: false
useEqualHeights: false

headerStyle: underlined

quicklaunch:
  searchDescriptions: false
  hideInternetSearch: true
  showSearchSuggestions: false
  hideVisitURL: false
  provider: duckduckgo
  mobileButtonPosition: bottom-right

showStats: false
statusStyle: dot

hideVersion: true
language: en
target: _blank
hideErrors: true

instanceName: merox-public
