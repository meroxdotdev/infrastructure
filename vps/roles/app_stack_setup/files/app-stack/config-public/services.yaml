---
# Showcase only — names, icons, descriptions. No live pinging and no widgets:
# this container is deliberately credential-free (no docker.sock, no
# kubeconfig, no env_file) and cannot reach the internal network anyway.
# Every card links to the blog post that actually explains that piece.
#
# Rewritten 2026-09-05. The previous version described a single-node cluster,
# one Proxmox host and a Home Assistant VM that was retired 2026-08-29, and
# pointed all twenty cards at the same homelab-tour post.
#
# Ground truth for anything below: the top-level README.md table, plus
# talos/THREE-NODE.md for the cluster layout.

