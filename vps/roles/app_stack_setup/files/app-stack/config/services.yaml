# ============================================================================
# MONITORING
# ============================================================================
- Monitoring:

    - Netdata:
        icon: netdata.png
        href: https://netdata.cloud.merox.dev
        description: Real-time Metrics

    - Grafana:
        icon: grafana.png
        href: https://grafana.k8s.merox.dev
        description: Dashboards

    - Prometheus:
        icon: prometheus.png
        href: https://prometheus.k8s.merox.dev
        description: Metrics Store

    - Alertmanager:
        icon: mdi-bell-alert
        href: https://alertmanager.k8s.merox.dev
        description: Alerts

    - Glances:
        icon: mdi-monitor-dashboard
        href: http://172.25.10.20:61208
        description: System Overview

    - R730xd Power:
        icon: mdi-flash
        description: Current draw (iDRAC)
        widget:
          type: customapi
          url: http://idrac-stats-server/idrac-stats.json
          refreshInterval: 60000
          mappings:
            - field: power_watts
              label: Power
              format: number
              suffix: " W"
            - field: power_avg_watts
              label: Avg (1 min)
              format: number
              suffix: " W"

    - R730xd Fans:
        icon: mdi-fan
        description: Fan RPM (iDRAC)
        widget:
          type: customapi
          url: http://idrac-stats-server/idrac-stats.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: fans
            name: name
            label: rpm_label
            format: text


