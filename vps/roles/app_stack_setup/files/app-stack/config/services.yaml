---
# Reorganized 2026-07-27 — grouped by function (what it does), not by device
# type. Previous layout mixed hypervisors/NAS into "Network" and left several
# already-configured providers (Longhorn, Synology, Proxmox widgets) unused.
# ============================================================================
# COMPUTE & HARDWARE
# ============================================================================
- Compute & Hardware:

    - Proxmox (px-0):
        id: proxmox
        icon: proxmox.png
        href: https://dc.merox.dev
        description: px-0 only - widget talks to its own API, not PDM (see below)
        ping: 10.57.57.254
        widget:
          type: proxmox
          url: https://10.57.57.254:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_PASS}}"

    - R730xd:
        id: r730xd-hw
        icon: mdi-server
        description: Power draw & fan speed (iDRAC)
        widget:
          type: customapi
          url: http://homelab-stats-server/homelab-stats.json
          refreshInterval: 60000
          mappings:
            - field: power_watts
              label: Power
              format: number
              suffix: " W"
            - field: power_avg_watts
              label: Avg (1m)
              format: number
              suffix: " W"
            - field: fan_rpm_avg
              label: Fans
              format: number
              suffix: " RPM"

    - UPS:
        id: ups
        icon: mdi-battery-charging-high
        description: CyberPower, via px-0 (restricted SSH, read-only)
        widget:
          type: customapi
          url: http://homelab-stats-server/homelab-stats.json
          refreshInterval: 60000
          mappings:
            - field: ups.state
              label: State
              format: text
            - field: ups.battery_pct
              label: Battery
              format: number
              suffix: "%"
            - field: ups.load_watts
              label: Load
              format: number
              suffix: " W"

    - Oracle VPS:
        id: oracle-vps
        icon: mdi-cloud-outline
        description: This host - CPU/RAM (read directly, not container stats)
        widget:
          type: customapi
          url: http://homelab-stats-server/homelab-stats.json
          refreshInterval: 60000
          mappings:
            - field: vps.cpu_pct
              label: CPU
              format: number
              suffix: "%"
            - field: vps.mem_pct
              label: Memory
              format: number
              suffix: "%"

# ============================================================================
# STORAGE & BACKUP
# ============================================================================
- Storage & Backup:

    - Longhorn:
        icon: longhorn.png
        href: http://longhorn.k8s.merox.dev
        description: K8s distributed storage (see info widget above)

    - R730xd Storage Pools:
        icon: mdi-harddisk
        description: Fullest ZFS/storage pool, both hosts (per-pool detail still alerts via n8n)
        widget:
          type: customapi
          url: http://homelab-stats-server/homelab-stats.json
          refreshInterval: 60000
          mappings:
            - field: storage_summary.fullest_name
              label: Fullest
              format: text
            - field: storage_summary.fullest_pct
              label: Usage
              format: number
              suffix: "%"

    - Synology:
        icon: synology.png
        href: https://nas.merox.dev
        description: Cold backup only - asleep except Sunday mornings
        ping: 10.57.57.201
        widget:
          type: diskstation
          url: https://10.57.57.201:5001
          username: "{{HOMEPAGE_VAR_SYNOLOGY_USER}}"
          password: "{{HOMEPAGE_VAR_SYNOLOGY_PASS}}"

    - Filebrowser:
        icon: mdi-folder-multiple
        href: https://files.k8s.merox.dev
        description: R730xd SAS pool browser, WebDAV

# ============================================================================
# KUBERNETES
# ============================================================================
- Kubernetes:

    - Headlamp:
        icon: kubernetes.png
        href: https://headlamp.k8s.merox.dev
        description: K8s UI

    - Authentik (K8s):
        icon: authentik.png
        href: https://sso.k8s.merox.dev
        description: SSO

# ============================================================================
# MEDIA
# ============================================================================
- Media:

    - Immich:
        icon: mdi-image-multiple
        href: https://photos.k8s.merox.dev
        description: Photo & Video Library

    - Jellyfin:
        icon: jellyfin.png
        href: https://media.merox.dev
        description: Media Server
        widget:
          type: jellyfin
          url: https://media.merox.dev
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - Jellyseerr:
        icon: jellyseerr.png
        href: https://jellyseerr.k8s.merox.dev/login
        description: Requests
        widget:
          type: seerr
          url: https://jellyseerr.k8s.merox.dev
          key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}"

    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbittorrent.k8s.merox.dev
        description: Downloads
        widget:
          type: qbittorrent
          url: https://qbittorrent.k8s.merox.dev
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"

    - Radarr:
        icon: radarr.png
        href: https://radarr.k8s.merox.dev
        description: Movies

    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.k8s.merox.dev
        description: TV Series

    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.k8s.merox.dev
        description: Indexers

# ============================================================================
# MONITORING & ALERTS
# ============================================================================
- Monitoring & Alerts:

    - Grafana:
        icon: grafana.png
        href: https://grafana.k8s.merox.dev
        description: Dashboards

    - Prometheus:
        icon: prometheus.png
        href: https://prometheus.k8s.merox.dev
        description: Metrics Store

    - Alertmanager:
        icon: mdi-bell-alert
        href: https://alertmanager.k8s.merox.dev
        description: Alerts
        widget:
          type: prometheusmetric
          url: https://prometheus.k8s.merox.dev
          refreshInterval: 30000
          metrics:
            - label: Active
              query: 'alertmanager_alerts{state="active"}'
              format:
                type: number
            - label: Suppressed
              query: 'alertmanager_alerts{state="suppressed"}'
              format:
                type: number

# ============================================================================
# NETWORK
# ============================================================================
- Network:

    - pfSense:
        icon: pfsense.png
        href: https://pfsense.merox.dev
        description: Firewall
        ping: 10.57.57.1
        widget:
          type: pfsense
          url: https://10.57.57.1:8443
          version: 2
          wan: igb0
          fields: ["load", "memory", "temp", "wanStatus"]
          headers:
            X-API-Key: "{{HOMEPAGE_VAR_PFSENSE_APIKEY}}"

    - PiHole:
        icon: sh-pi-hole
        href: http://pihole.cloud.merox.dev/admin/login
        description: DNS
        widget:
          type: pihole
          url: http://pihole
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
          fields: ["queries", "blocked", "blocked_percent"]

    - TP-Link:
        icon: mdi-wifi
        href: http://tplink.merox.dev
        description: WiFi

    - Speed Test:
        icon: mdi-speedometer
        href: https://speed.merox.dev
        description: Bandwidth (px-0)

# ============================================================================
# CLOUD / VPS
# ============================================================================
- Cloud / VPS:

    - Authentik:
        icon: authentik.png
        href: https://sso.merox.dev
        description: SSO
        server: my-docker
        container: authentik-server

    - Portainer:
        icon: portainer.png
        href: https://one.merox.dev
        description: Containers
        server: my-docker
        container: portainer

    - Traefik:
        icon: traefik.png
        href: http://traefik.cloud.merox.dev
        description: Reverse Proxy
        server: my-docker
        container: traefik

    - Guacamole:
        icon: guacamole.png
        href: https://rmt.merox.dev
        description: Remote Desktop
        server: my-docker
        container: guacamole

    - Joplin:
        icon: joplin.png
        href: http://joplin.cloud.merox.dev
        description: Notes
        server: my-docker
        container: joplin-server

    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: VPN

    - Cloudflare:
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com/af2d61a35bdc3d2adf9ce1eaa1441382/home/quick-start
        description: Tunnel
        widget:
          type: cloudflared
          accountid: af2d61a35bdc3d2adf9ce1eaa1441382
          tunnelid: 0fb9de70-9c20-44d6-bfc9-bd03751273fa
          key: "{{HOMEPAGE_VAR_CLOUDFLARE_KEY}}"
          fields: ["status", "origin_ip"]
