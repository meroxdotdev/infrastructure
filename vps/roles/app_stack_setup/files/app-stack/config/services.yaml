---
# Private dashboard (homepage.cloud.merox.dev, tailnet only). Grouped by
# function, not by device type.
#
# Rewritten 2026-09-05 against the live cluster and the repo. What changed and
# why, so the same drift is recognisable next time:
#   - Compute held only the R730xd and the VPS. The R730xd stopped being the
#     compute host on 2026-09-01; pve-1, pve-3 and PDM were never added.
#   - "Authentik (K8s) — sso.k8s.merox.dev" had no HTTPRoute behind it. Only
#     the outpost runs in-cluster, and it has no UI of its own; it fronts
#     Jellyseerr on download.merox.dev, noted on that card instead.
#   - Portainer pointed at one.merox.dev, a host that exists nowhere else in
#     the repo and in no tunnel table. Its Traefik router is
#     portainer.cloud.merox.dev, which also survives a DR rebuild — unlike the
#     Tailscale IP the README still quotes.
#   - Longhorn said "see info widget above"; that widget was disabled
#     2026-07-27 and the href was http on an https route.
#   - n8n, jellyfin-public, Nextcloud, Garage and PDM had no cards at all.
#
# Every href below either resolves in the repo or was checked against the
# live cluster's HTTPRoutes. Keep it that way: a card that always errors is
# training to ignore the ones that mean something.

# ============================================================================
# COMPUTE & HARDWARE
# ============================================================================
# Three standalone Proxmox hosts, joined through PDM rather than corosync.
# No Proxmox widgets: each standalone host needs its own API token and only
# one pair (HOMEPAGE_VAR_PROXMOX_USER/PASS) exists, with no record of which
# host it belongs to. Add a token per host to homepage-env.j2 first, then a
# `proxmox` widget here — same rule the stats script follows in PVE_TARGETS.
- Compute & Hardware:

    - pve-1 (Beelink):
        icon: proxmox.png
        href: https://10.57.57.254:8006
        description: Runs kubernetes-1 — losing this stops everything
        ping: 10.57.57.254

    - pve-2 (R730xd):
        id: r730xd-hw
        icon: mdi-server
        href: https://10.57.57.250:8006
        description: Disks, backups, Nextcloud, kubernetes-2 — power & fans via iDRAC
        ping: 10.57.57.250
        widget:
          type: customapi
          url: http://homelab-stats-server/homelab-stats.json
          refreshInterval: 60000
          mappings:
            - field: power_watts
              label: Power
              format: number
              suffix: " W"
            - field: power_avg_watts
              label: Avg (1m)
              format: number
              suffix: " W"
            - field: fan_rpm_avg
              label: Fans
              format: number
              suffix: " RPM"

    - pve-3 (OptiPlex):
        icon: proxmox.png
        href: https://10.57.57.253:8006
        description: kubernetes-3 on a raw power-loss-protected SSD, plus PDM
        ping: 10.57.57.253

    - Datacenter Manager:
        icon: mdi-view-dashboard-outline
        href: https://dc.merox.dev
        description: CT 100 on pve-3 — one pane over all three hosts
        ping: 10.57.57.57

    # UPS card removed 2026-07-27: its data source (pwrstat) is disabled -
    # see homelab-stats.sh.j2 - so this would always show "Unreachable".
    # Real UPS shutdown safety is unaffected (local NUT on pve-2). Restore
    # from git history if the local-NUT-based rebuild ever happens.

    - Oracle VPS:
        id: oracle-vps
        icon: mdi-cloud-outline
        description: This host - CPU/RAM (read directly, not container stats)
        widget:
          type: customapi
          url: http://homelab-stats-server/homelab-stats.json
          refreshInterval: 60000
          mappings:
            - field: vps.cpu_pct
              label: CPU
              format: number
              suffix: "%"
            - field: vps.mem_pct
              label: Memory
              format: number
              suffix: "%"

# ============================================================================
# KUBERNETES
# ============================================================================
- Kubernetes:

    - Headlamp:
        icon: kubernetes.png
        href: https://headlamp.k8s.merox.dev
        description: K8s UI - three control-plane nodes, no HA by choice

    - Longhorn:
        icon: longhorn.png
        href: https://longhorn.k8s.merox.dev
        description: Distributed block storage, two replicas per volume

    - n8n:
        icon: n8n.png
        href: https://n8n.k8s.merox.dev
        description: Workflow automation - webhooks on n8n-webhook.k8s.merox.dev

# ============================================================================
# STORAGE & BACKUP
# ============================================================================
- Storage & Backup:

    # "Fullest pool" is pve-2 only: PVE_TARGETS in homelab-stats.sh.j2 holds
    # one entry, and pve-1/pve-3 have no token there. Per-pool detail still
    # alerts via n8n.
    - pve-2 Storage Pools:
        icon: mdi-harddisk
        description: Fullest ZFS/storage pool on pve-2
        widget:
          type: customapi
          url: http://homelab-stats-server/homelab-stats.json
          refreshInterval: 60000
          mappings:
            - field: storage_summary.fullest_name
              label: Fullest
              format: text
            - field: storage_summary.fullest_pct
              label: Usage
              format: number
              suffix: "%"

    # No href: this Garage runs LAN-only on pve-2 with no Traefik in front of
    # it (garage_webui_enabled is the VPS-side default, not this host's).
    - Garage S3:
        icon: mdi-bucket-outline
        description: LXC 103 on pve-2 - S3 target for Longhorn backups
        ping: 10.57.57.61

    - Synology:
        icon: synology.png
        href: https://nas.merox.dev
        description: Cold backup only - asleep except Sunday mornings
        ping: 10.57.57.201
        widget:
          type: diskstation
          url: https://10.57.57.201:5001
          username: "{{HOMEPAGE_VAR_SYNOLOGY_USER}}"
          password: "{{HOMEPAGE_VAR_SYNOLOGY_PASS}}"

# ============================================================================
# MEDIA
# ============================================================================
- Media:

    - Jellyfin:
        icon: jellyfin.png
        href: https://media.merox.dev
        description: Media Server - LAN/Tailscale only
        widget:
          type: jellyfin
          url: https://media.merox.dev
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - Jellyfin Public:
        icon: jellyfin.png
        href: https://studio.k8s.merox.dev
        description: Curated library served publicly via the Frankfurt edge

    - Jellyseerr:
        icon: jellyseerr.png
        href: https://jellyseerr.k8s.merox.dev/login
        description: Requests - public at download.merox.dev behind the Authentik outpost
        widget:
          type: seerr
          url: https://jellyseerr.k8s.merox.dev
          key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}"

    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbittorrent.k8s.merox.dev
        description: Downloads
        widget:
          type: qbittorrent
          url: https://qbittorrent.k8s.merox.dev
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"

    - Radarr:
        icon: radarr.png
        href: https://radarr.k8s.merox.dev
        description: Movies - radarr-public feeds the public library

    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.k8s.merox.dev
        description: TV Series

    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.k8s.merox.dev
        description: Indexers

    - Immich:
        icon: mdi-image-multiple
        href: https://photos.k8s.merox.dev
        description: Photo & Video Library

# ============================================================================
# FILES & NOTES
# ============================================================================
- Files & Notes:

    - Nextcloud:
        icon: nextcloud.png
        href: https://drive.merox.dev
        description: VM 1000 on pve-2 - AIO, own Cloudflare tunnel

    - Joplin:
        icon: joplin.png
        href: https://joplin.cloud.merox.dev
        description: Notes sync
        server: my-docker
        container: joplin-server

# ============================================================================
# MONITORING & ALERTS
# ============================================================================
- Monitoring & Alerts:

    - Grafana:
        icon: grafana.png
        href: https://grafana.k8s.merox.dev
        description: Dashboards - metrics and Loki logs

    - Prometheus:
        icon: prometheus.png
        href: https://prometheus.k8s.merox.dev
        description: Metrics Store

    - Alertmanager:
        icon: mdi-bell-alert
        href: https://alertmanager.k8s.merox.dev
        description: Alerts
        widget:
          type: prometheusmetric
          url: https://prometheus.k8s.merox.dev
          refreshInterval: 30000
          metrics:
            - label: Active
              query: 'alertmanager_alerts{state="active"}'
              format:
                type: number
            - label: Suppressed
              query: 'alertmanager_alerts{state="suppressed"}'
              format:
                type: number

# ============================================================================
# NETWORK
# ============================================================================
- Network:

    - pfSense:
        icon: pfsense.png
        href: https://pfsense.merox.dev
        description: Firewall
        ping: 10.57.57.1
        widget:
          type: pfsense
          url: https://10.57.57.1:8443
          version: 2
          wan: igb0
          fields: ["load", "memory", "temp", "wanStatus"]
          headers:
            X-API-Key: "{{HOMEPAGE_VAR_PFSENSE_APIKEY}}"

    - PiHole:
        icon: sh-pi-hole
        href: http://pihole.cloud.merox.dev/admin/login
        description: DNS
        widget:
          type: pihole
          url: http://pihole
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
          fields: ["queries", "blocked", "blocked_percent"]

    - TP-Link:
        icon: mdi-wifi
        href: http://tplink.merox.dev
        description: WiFi

    # Speed Test bookmark removed: the host running speed.merox.dev is out
    # of scope. Restore from git history if it comes back on a different host.

# ============================================================================
# CLOUD / VPS
# ============================================================================
- Cloud / VPS:

    - Authentik:
        icon: authentik.png
        href: https://sso.merox.dev
        description: SSO - the only Authentik; K8s runs its outpost only
        server: my-docker
        container: authentik-server

    - Portainer:
        icon: portainer.png
        href: https://portainer.cloud.merox.dev
        description: Containers
        server: my-docker
        container: portainer

    - Traefik:
        icon: traefik.png
        href: http://traefik.cloud.merox.dev
        description: Reverse Proxy
        server: my-docker
        container: traefik

    - Guacamole:
        icon: guacamole.png
        href: https://rmt.merox.dev
        description: Remote Desktop
        server: my-docker
        container: guacamole

    # Separate Oracle tenancy, borrowed and stateless. Not on my-docker: its
    # Docker socket is not exposed to this host, so no container status.
    - Frankfurt edge:
        icon: mdi-earth
        href: https://studio.merox.dev
        description: edge-fra - TLS for the public Jellyfin, geoblocked in kernel
        ping: 100.99.62.31

    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: VPN

    - Cloudflare:
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com/af2d61a35bdc3d2adf9ce1eaa1441382/home/quick-start
        description: Tunnel
        widget:
          type: cloudflared
          accountid: af2d61a35bdc3d2adf9ce1eaa1441382
          tunnelid: 0fb9de70-9c20-44d6-bfc9-bd03751273fa
          key: "{{HOMEPAGE_VAR_CLOUDFLARE_KEY}}"
          fields: ["status", "origin_ip"]
