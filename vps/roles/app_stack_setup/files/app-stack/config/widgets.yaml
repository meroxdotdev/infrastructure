---
- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hour12: false
      locale: ro-RO

- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: "k8s"
    nodes:
      show: false

# Provider already configured in settings.yaml (providers.longhorn) but
# unused until now - aggregate storage capacity across the K8s cluster.
- longhorn:
    expanded: true
    total: true
    labels: true
    nodes: false
