---
title: merox.dev
description: Infrastructure Dashboard (private)
startUrl: https://homepage.cloud.merox.dev

theme: dark
color: zinc
iconStyle: flat

favicon: https://merox.dev/assets/img/favicons/favicon-32x32.png

# ============================================================================
# LAYOUT — grouped by function, not by device type (reorganized 2026-07-27)
# ============================================================================
layout:

  # Column counts match each group's actual item count exactly - no ragged
  # wraps, no phantom empty grid slots. Update the count here if a group
  # gains/loses an entry in services.yaml.
  Compute & Hardware:
    style: row
    columns: 2
    icon: mdi-server
    useEqualHeights: true

  Storage & Backup:
    style: row
    columns: 5
    icon: mdi-database
    useEqualHeights: true

  Kubernetes:
    style: column
    columns: 3
    icon: kubernetes.png
    useEqualHeights: false

  Media:
    style: column
    columns: 3
    icon: mdi-filmstrip
    useEqualHeights: false

  Monitoring & Alerts:
    style: column
    columns: 4
    icon: mdi-monitor-dashboard
    useEqualHeights: false

  Network:
    style: column
    columns: 4
    icon: mdi-server-network
    useEqualHeights: false

  Cloud / VPS:
    style: row
    columns: 4
    icon: mdi-cloud-outline
    useEqualHeights: true

# ============================================================================
# DISPLAY
# ============================================================================
fullWidth: false
maxGroupColumns: 4
disableCollapse: true
groupsInitiallyCollapsed: false
useEqualHeights: false

headerStyle: underlined

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  showSearchSuggestions: false
  hideVisitURL: false
  provider: duckduckgo
  mobileButtonPosition: bottom-right

showStats: false
statusStyle: dot

hideVersion: true
language: en
target: _blank
hideErrors: true

instanceName: merox-main

# ============================================================================
# API PROVIDERS
# ============================================================================
providers:
  portainer:
    url: https://172.25.10.30:9443
    key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

  proxmox:
    url: https://10.57.57.254:8006
    username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
    password: "{{HOMEPAGE_VAR_PROXMOX_PASS}}"

  longhorn:
    url: http://10.57.57.80:30887/
