---
title: merox.dev
description: Infrastructure Dashboard (private)
startUrl: https://homepage.cloud.merox.dev

theme: dark
color: zinc
iconStyle: flat

favicon: https://merox.dev/assets/img/favicons/favicon-32x32.png

# ============================================================================
# LAYOUT — grouped by function, not by device type
# ============================================================================
# Rewritten 2026-09-05 alongside services.yaml.
#
# The old rule here was "columns == the group's item count, exactly". That is
# no longer reachable: maxGroupColumns caps every group at 4, and two groups
# now hold more than that. The rule is now "columns divides the item count, or
# is the count when it is 4 or fewer" — Media 8/4 and Cloud 7/4 wrap cleanly
# enough, Compute takes 3 because its cards carry widgets and squeeze at 4.
# Update the count here when a group gains or loses an entry.
layout:

  Compute & Hardware:
    style: row
    columns: 3
    icon: mdi-server
    useEqualHeights: true

  Kubernetes:
    style: column
    columns: 3
    icon: kubernetes.png
    useEqualHeights: false

  Storage & Backup:
    style: row
    columns: 3
    icon: mdi-database
    useEqualHeights: true

  Media:
    style: row
    columns: 4
    icon: mdi-filmstrip
    useEqualHeights: true

  Files & Notes:
    style: column
    columns: 2
    icon: mdi-folder-account
    useEqualHeights: false

  Monitoring & Alerts:
    style: column
    columns: 3
    icon: mdi-monitor-dashboard
    useEqualHeights: false

  Network:
    style: column
    columns: 3
    icon: mdi-server-network
    useEqualHeights: false

  Cloud / VPS:
    style: row
    columns: 4
    icon: mdi-cloud-outline
    useEqualHeights: true

# ============================================================================
# DISPLAY
# ============================================================================
fullWidth: false
maxGroupColumns: 4
disableCollapse: true
groupsInitiallyCollapsed: false
useEqualHeights: false

headerStyle: underlined

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  showSearchSuggestions: false
  hideVisitURL: false
  provider: duckduckgo
  mobileButtonPosition: bottom-right

showStats: true
statusStyle: dot

hideVersion: true
language: en
target: _blank
hideErrors: true

instanceName: merox-main

# ============================================================================
# API PROVIDERS
# ============================================================================
# Empty on purpose. Nothing below consumes a shared provider: the Longhorn
# widget is disabled in widgets.yaml (unreachable from the VPS), and the
# Proxmox widget cannot be rebuilt from one credential pair now that there are
# three standalone hosts — each needs its own API token. See the comment above
# the Compute group in services.yaml before restoring either from git history.
providers: {}
