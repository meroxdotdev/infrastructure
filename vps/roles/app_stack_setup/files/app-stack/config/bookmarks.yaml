# Merox Infrastructure - Quick Access Bookmarks
#
# Reviewed 2026-09-05. Two entries were dropped for pointing at services that
# appear nowhere else in the repo and are not part of the setup: UptimeRobot
# (healthchecks.io is what every scheduled job pings - see README) and Grafana
# Cloud (Grafana is self-hosted in the cluster). Same rule as services.yaml:
# if it is not referenced anywhere else, it is probably a leftover.

