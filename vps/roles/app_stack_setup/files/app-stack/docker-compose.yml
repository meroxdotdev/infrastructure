services:
  # Secrets are loaded from .env (gitignored) — copy from .env.example to get started
  # The public dashboard, and the only one on this host. Deliberately
  # credential-free: no docker.sock, no kubeconfig, no env_file, no widgets —
  # every card links to a blog post rather than to a service, so there is
  # nothing here to leak. Internal detail lives on home.k8s.merox.dev, inside
  # the cluster, which is the only place that can actually read it.
  homepage-public:
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage-public
    volumes:
      - ./config-public:/app/config
    environment:
      PUID: 1000
      PGID: 1000
      HOMEPAGE_ALLOWED_HOSTS: "inside.merox.dev"
    restart: unless-stopped
    networks:
      network-cloud-merox:
        ipv4_address: 172.25.10.11
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage-public.rule=Host(`inside.merox.dev`)"
      - "traefik.http.routers.homepage-public.entrypoints=https"
      - "traefik.http.routers.homepage-public.tls.certresolver=cloudflare"
      - "traefik.http.routers.homepage-public.middlewares=default-headers@file"
      - "traefik.http.services.homepage-public.loadbalancer.server.port=3000"

  portainer:
    image: portainer/portainer-ee@sha256:18750221de87f489fffc3d52a23799e9c6a83aab0f1a5337824c81e12bf552b5
    container_name: portainer
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 100.72.22.38
    ports:
      - "100.72.22.38:9000:9000"
      - "100.72.22.38:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      network-cloud-merox:
        ipv4_address: 172.25.10.30
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.cloud.merox.dev`)"
      - "traefik.http.routers.portainer.entrypoints=https"
      - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.services.portainer.loadbalancer.server.scheme=http"


  unbound:
    container_name: unbound
    image: klutchell/unbound@sha256:5020cfe1218aeda38777f88279220162e602c3a44efc684550dbf46137106a16
    restart: unless-stopped
    networks:
      network-cloud-merox:
        ipv4_address: 172.25.10.52

  pihole:
    container_name: pihole
    image: pihole/pihole:2026.07.2
    depends_on:
      - unbound
    ports:
      # Tailscale-only (ServerIP below is already the Tailscale IP — this
      # was the intent, port binding just wasn't scoped to match. An open
      # public :53 resolver is a DNS-amplification vector for zero benefit,
      # since nothing outside the tailnet is meant to use this as a resolver).
      - "100.72.22.38:53:53/tcp"
      - "100.72.22.38:53:53/udp"
      - "127.0.0.1:8078:80"
    environment:
      TZ: 'Europe/Bucharest'
      FTLCONF_webserver_api_password: '${PIHOLE_WEBPASSWORD}'
      FTLCONF_dns_upstreams: '172.25.10.52'
      FTLCONF_dns_listeningMode: 'all'
      ServerIP: '100.72.22.38'
      IPv6: 'false'
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    dns:
      - 172.25.10.52
      - 1.1.1.1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      network-cloud-merox:
        ipv4_address: 172.25.10.53
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.cloud.merox.dev`)"
      - "traefik.http.routers.pihole.entrypoints=https"
      - "traefik.http.routers.pihole.tls.certresolver=cloudflare"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"

  joplin-db:
    image: postgres:18
    container_name: joplin-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${JOPLIN_DB_PASSWORD}
      POSTGRES_USER: joplin
      POSTGRES_DB: joplin
      # postgres 18+ refuses to initialize directly at a mounted
      # /var/lib/postgresql/data (pg_ctlcluster-style layout expected) -
      # point PGDATA at a subdirectory instead, same fix as immich's postgres.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - joplin_db_data:/var/lib/postgresql/data
    networks:
      network-cloud-merox:
        ipv4_address: 172.25.10.60

  joplin-server:
    image: joplin/server:3.7.1
    container_name: joplin-server
    restart: unless-stopped
    depends_on:
      - joplin-db
    environment:
      APP_PORT: 22300
      APP_BASE_URL: "https://joplin.cloud.merox.dev"
      DB_CLIENT: pg
      POSTGRES_PASSWORD: ${JOPLIN_DB_PASSWORD}
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PORT: 5432
      POSTGRES_HOST: joplin-db
    networks:
      network-cloud-merox:
        ipv4_address: 172.25.10.61
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.joplin.rule=Host(`joplin.cloud.merox.dev`)"
      - "traefik.http.routers.joplin.entrypoints=https"
      - "traefik.http.routers.joplin.tls.certresolver=cloudflare"
      - "traefik.http.services.joplin.loadbalancer.server.port=22300"
      - "traefik.docker.network=network-cloud-merox"

volumes:
  portainer_data:
  joplin_db_data:

networks:
  network-cloud-merox:
    name: network-cloud-merox
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1