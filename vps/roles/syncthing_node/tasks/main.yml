---
# This node only ever holds the folder encrypted ("untrusted"): Oracle stores
# ciphertext it cannot read. The trusted copies are the MacBook and the
# cluster. Devices and the folder are paired through Syncthing's own config,
# not Ansible — see README.md.
- name: Ensure the Syncthing directory exists
  ansible.builtin.file:
    path: "{{ syncthing_docker_dir }}"
    state: directory
    owner: "{{ syncthing_uid }}"
    group: "{{ syncthing_uid }}"
    mode: "0750"

- name: Deploy the Syncthing compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ syncthing_docker_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart syncthing

- name: Start Syncthing
  community.docker.docker_compose_v2:
    project_src: "{{ syncthing_docker_dir }}"
    state: present
