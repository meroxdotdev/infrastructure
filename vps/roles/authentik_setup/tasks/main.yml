---
- name: Create Authentik directory
  file:
    path: "{{ authentik_docker_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Authentik docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_docker_dir }}/docker-compose.yml"
    mode: "0640"
  no_log: true
  notify: Restart authentik

# `files` is not cosmetic. Compose resolves the project file by name
# precedence -- compose.yaml, compose.yml, docker-compose.yaml,
# docker-compose.yml -- so anything called compose.yml dropped into this
# directory silently outranks the file this role writes. That happened on
# 2026-09-05: the upstream compose.yml from the authentik upgrade docs was
# downloaded here, and every `docker compose` call in this directory (this
# task included) started reading it instead, failing on a PG_PASS variable
# this deployment does not use. The upgrade looked like a no-op for weeks.
# Naming the file explicitly makes the role immune to that.
- name: Start Authentik
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_docker_dir }}"
    files:
      - docker-compose.yml
    state: present

- name: Wait for Authentik server to be ready
  wait_for:
    port: "{{ authentik_port }}"
    host: "{{ authentik_server_ip }}"
    delay: 15
    timeout: 120

- name: Deploy Authentik DB backup script
  template:
    src: backup-authentik.sh.j2
    dest: /usr/local/bin/backup-authentik.sh
    owner: root
    group: root
    mode: "0700"
  no_log: true
  tags: backup

- name: Schedule daily Authentik DB backup
  cron:
    name: "authentik-db-backup"
    minute: "40"
    hour: "23"
    job: "/usr/local/bin/backup-authentik.sh >> /var/log/authentik-backup.log 2>&1"
    user: root
  tags: backup
