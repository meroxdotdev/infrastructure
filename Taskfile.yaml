---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'
  PROD_HOST: '10.57.57.254'   # pve-1 — hosts the prod cluster VM since 2026-09-01
  PROD_VMID: '810'            # kubernetes-1

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.ROOT_DIR}}/age.key'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap
  talos: .taskfiles/talos
  longhorn: .taskfiles/longhorn

tasks:

  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux

  dr:create-vms:
    desc: "DR: create the Talos DR VMs on Proxmox via Terraform (one per MAC in terraform.tfvars)"
    dir: '{{.TALOS_DIR}}/terraform'
    cmds:
      - terraform init -upgrade
      - terraform apply -auto-approve
    preconditions:
      - test -f {{.TALOS_DIR}}/terraform/terraform.tfvars

  dr:apply-talos-configs:
    desc: "DR: scan subnet for Talos nodes, match MAC→config, apply (no talconfig patching needed)"
    summary: |
      Scans 10.57.57.0/24 for port 50000 (Talos maintenance mode), queries each
      node for its MAC address via talosctl --insecure, matches it to the correct
      talhelper-generated config file, and applies the config.

      Required because: VMs boot with DHCP IPs in maintenance mode. Fixed MACs in
      Terraform + prod talconfig = no talconfig patching, but we still need to apply
      the configs to the DHCP IPs before nodes reboot to static IPs.

      Run after: task dr:create-vms (wait ~60s for Talos maintenance mode)
      Run before: task bootstrap:talos
    cmds:
      - |
        set -euo pipefail

        # Every MAC terraform creates must have a node in talconfig.yaml. That is
        # the real requirement, and it is not the same as the two files being the
        # same length: DR deliberately restores fewer nodes than prod runs
        # (docs/dr-quickstart.md), so talconfig legitimately declares more. The
        # apply step below matches by MAC, so the extra nodes are simply never
        # used. What does break is a MAC with no config behind it - terraform
        # brings the VM up and nothing ever configures it, silently.
        TAL_MACS=$(yq -r '.nodes[].networkInterfaces[].deviceSelector.hardwareAddr
                            | select(. != null) | downcase' \
          {{.TALOS_DIR}}/talconfig.yaml)
        TF_MACS=$(sed -n 's/^node_macs *= *\[\(.*\)\].*/\1/p' \
          {{.TALOS_DIR}}/terraform/terraform.tfvars |
          tr -d ' "' | tr ',' '\n' | tr 'A-Z' 'a-z' | grep .)
        if [ -z "$TF_MACS" ]; then
          echo "  ✗ node_macs is empty in terraform.tfvars - nothing to provision."
          exit 1
        fi
        MISSING=""
        for m in $TF_MACS; do
          echo "$TAL_MACS" | grep -qx "$m" || MISSING="$MISSING $m"
        done
        if [ -n "$MISSING" ]; then
          echo "  ✗ terraform.tfvars has MAC(s) with no node in talconfig.yaml:$MISSING"
          echo "    Terraform would create a VM that never receives a config."
          echo "    Add the node to talconfig.yaml or fix the MAC — see talos/THREE-NODE.md."
          exit 1
        fi
        echo "  ✓ $(echo "$TF_MACS" | wc -w | tr -d ' ') MAC(s) in terraform.tfvars, all present in talconfig.yaml"

        echo "→ Scanning subnet for Talos maintenance-mode nodes (port 50000)..."
        DHCP_IPS=$(nmap -Pn -n -p 50000 --open 10.57.57.0/24 2>/dev/null | grep "Nmap scan report" | awk '{print $NF}')
        COUNT=$(echo "$DHCP_IPS" | grep -c "10\." || true)
        echo "  Found $COUNT node(s): $DHCP_IPS"
        if [ "$COUNT" -eq 0 ]; then
          echo "  ✗ No Talos nodes found. Wait ~60s after terraform apply and retry."
          exit 1
        fi

        echo ""
        echo "→ Generating Talos configs from talconfig.yaml..."
        cd {{.TALOS_DIR}} && talhelper genconfig 2>&1 | grep -v "WARNING" || true && cd {{.ROOT_DIR}}

        echo ""
        echo "→ Matching MACs to configs and applying..."
        python3 - << 'PYEOF'
        import subprocess, sys, os

        REPO = "{{.ROOT_DIR}}"
        MAC_CONFIG = {}
        # Build mapping from talconfig hardwareAddr → clusterconfig file
        import yaml
        with open(f"{REPO}/talos/talconfig.yaml") as f:
            cfg = yaml.safe_load(f)
        for node in cfg.get("nodes", []):
            for iface in node.get("networkInterfaces", []):
                mac = iface.get("deviceSelector", {}).get("hardwareAddr", "").lower()
                hostname = node["hostname"]
                # find matching clusterconfig file
                import glob
                pattern = f"{REPO}/talos/clusterconfig/*-{hostname}.yaml"
                files = glob.glob(pattern)
                if mac and files:
                    MAC_CONFIG[mac] = files[0]

        dhcp_ips = """{{.DHCP_IPS}}""".split() if "{{.DHCP_IPS}}" else []
        if not dhcp_ips:
            # re-scan if not passed as var
            result = subprocess.run(
                ["nmap", "-Pn", "-n", "-p", "50000", "--open", "10.57.57.0/24"],
                capture_output=True, text=True
            )
            dhcp_ips = [line.split()[-1] for line in result.stdout.splitlines() if "Nmap scan report" in line]

        applied = 0
        for ip in dhcp_ips:
            out = subprocess.run(
                ["talosctl", "get", "links", "-n", ip, "--insecure"],
                capture_output=True, text=True
            ).stdout
            mac = ""
            for line in out.splitlines():
                if "ens18" in line or ("ether" in line and "up" in line.lower() and "dummy" not in line and "bond" not in line):
                    for part in line.split():
                        if len(part) == 17 and part.count(":") == 5:
                            mac = part.lower()
                            break
                if mac:
                    break

            cfg_file = MAC_CONFIG.get(mac, "")
            print(f"  {ip} → MAC={mac} → {os.path.basename(cfg_file) if cfg_file else 'UNKNOWN'}")
            if cfg_file:
                r = subprocess.run(
                    ["talosctl", "apply-config", "-n", ip, "--insecure", "-f", cfg_file],
                    capture_output=True, text=True
                )
                if r.returncode == 0:
                    print(f"    ✓ Applied")
                    applied += 1
                else:
                    print(f"    ✗ {r.stderr.strip()}")
            else:
                print(f"    ✗ No config found for MAC {mac}")

        print(f"\n  Applied {applied}/{len(dhcp_ips)} configs")
        if applied < len(dhcp_ips):
            sys.exit(1)
        PYEOF

        echo ""
        STATIC_IPS=$(yq -r '.nodes[].ipAddress' {{.TALOS_DIR}}/talconfig.yaml | tr '\n' ' ')
        echo "→ Waiting for nodes on static IPs ($STATIC_IPS)..."
        for i in $(seq 1 30); do
          OPEN=$(nmap -Pn -n -p 50000 $STATIC_IPS 2>/dev/null | grep -c "open" || true)
          echo "  [$i/30] $OPEN/$NODE_COUNT on static IPs"
          [ "$OPEN" -eq "$NODE_COUNT" ] && echo "  ✓ All $NODE_COUNT node(s) on static IPs!" && break
          sleep 10
        done

  dr:destroy-vms:
    desc: "DR: destroy Talos DR VMs on Proxmox"
    dir: '{{.TALOS_DIR}}/terraform'
    cmd: terraform destroy -auto-approve
    preconditions:
      - test -f {{.TALOS_DIR}}/terraform/terraform.tfvars

  dr:verify:
    desc: "DR: run full verification (phase 1+2+3)"
    cmd: bash {{.SCRIPTS_DIR}}/dr-verify.sh --phase all

  dr:restore-prod:
    desc: "DR: start the prod cluster VM again and clear pods orphaned by the shutdown"
    summary: |
      Run after dr:destroy-vms. Starting the prod VM leaves a handful of pods in
      Error from the shutdown; each is already replaced by a Running one, so
      they are noise that otherwise sits in `kubectl get pods -A` for days.
    cmds:
      - ssh root@{{.PROD_HOST}} "qm start {{.PROD_VMID}}"
      - |
        echo "→ Waiting for the node to go Ready..."
        until kubectl get nodes --no-headers 2>/dev/null | grep -q " Ready "; do sleep 15; done
        echo "→ Waiting for workloads to settle..."
        for i in $(seq 1 20); do
          bad=$(kubectl get pods -A --no-headers 2>/dev/null | grep -vc "Running\|Completed")
          [ "$bad" -le 8 ] && break
          sleep 30
        done
        kubectl get pods -A --no-headers | awk '$4=="Error"{print $1, $2}' \
          | while read -r ns p; do kubectl delete pod -n "$ns" "$p" --wait=false >/dev/null; done
        echo "  ✓ Prod back; $(kubectl get pods -A --no-headers | grep -vc 'Running\|Completed') pods not Running"
    silent: true
