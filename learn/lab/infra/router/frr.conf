! lab-gw as the top-of-rack router. Rendered by setup-frr.sh.
!
! Every node runs Cilium's BGP speaker as AS 65001 and peers with this box
! (AS 65000). Nodes announce: LoadBalancer IPs (/32 from 10.10.100.0/24) and
! their pod CIDR (/24 from 10.244.0.0/16). This box announces nothing back —
! the nodes already have a default route to it.
!
frr defaults traditional
hostname lab-gw
log syslog informational
service integrated-vtysh-config
!
router bgp @ROUTER_ASN@
 bgp router-id @LAB_GATEWAY@
 ! Log every session change: the first thing to read when a peer flaps.
 bgp log-neighbor-changes
 neighbor K8S peer-group
 neighbor K8S remote-as @CLUSTER_ASN@
 ! 3s keepalive / 9s hold: a dead node's routes go in under 10s.
 neighbor K8S timers 3 9
@NEIGHBORS@
 !
 address-family ipv4 unicast
  neighbor K8S activate
  neighbor K8S soft-reconfiguration inbound
  ! RFC 8212: FRR refuses eBGP routes without a policy. This is the policy:
  ! accept only what the cluster is allowed to own, announce nothing.
  neighbor K8S route-map K8S-IN in
  neighbor K8S route-map K8S-OUT out
  ! The same /32 from three nodes becomes one route with three next hops.
  maximum-paths 8
 exit-address-family
exit
!
ip prefix-list K8S-ALLOWED seq 10 permit @LB_POOL@ ge 32
ip prefix-list K8S-ALLOWED seq 20 permit @POD_CIDR@ ge 24 le 24
!
route-map K8S-IN permit 10
 match ip address prefix-list K8S-ALLOWED
exit
!
route-map K8S-OUT deny 10
exit
!
