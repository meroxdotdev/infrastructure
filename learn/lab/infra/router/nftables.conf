#!/usr/sbin/nft -f
# lab-gw: the only door between the home LAN and the lab. Rendered by
# setup-router.sh, which replaces the @…@ placeholders.
#
# Read it top to bottom as a packet would: input = to lab-gw itself,
# forward = through lab-gw, postrouting = last chance to rewrite the source.

flush ruleset

define WAN  = "@WAN_IF@"
define LAN  = "@LAN_IF@"
define HOME = @HOME_LAN@
# The lab subnet, the LoadBalancer pool, the pods.
define LAB  = { 10.10.0.0/16, 10.244.0.0/16 }

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } accept
    # From the nodes: BGP (179), Garage S3 (3900), SSH, DNS lookups.
    iifname $LAN accept
    # From home: SSH only. Everything else on lab-gw is for the lab.
    iifname $WAN ip saddr $HOME tcp dport 22 accept
    counter comment "dropped input"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    # A reply with no matching request lands here. With asymmetric routing
    # (docs/01-laborator.md) this is the counter that climbs.
    ct state invalid counter drop comment "invalid: asymmetric route?"
    # Lab out to the home LAN and the internet.
    iifname $LAN oifname $WAN accept
    # Home LAN in to the lab — routed, not NATed, so the nodes see the real
    # client address. Needs a route on the client (or pfSense) to 10.10.0.0/16.
    iifname $WAN oifname $LAN ip saddr $HOME accept
    counter comment "dropped forward"
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    # Only traffic the lab starts: replies to home-initiated connections
    # match conntrack state and are never rewritten.
    oifname $WAN ip saddr $LAB masquerade
  }
}
