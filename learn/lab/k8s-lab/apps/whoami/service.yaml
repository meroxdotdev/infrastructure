---
# type: LoadBalancer — LB IPAM picks 10.10.100.20 from lab-pool, BGP announces
# it from every node, and lab-gw ends up with three next hops for one /32.
# Reachable before any Gateway exists:  curl http://10.10.100.20
apiVersion: v1
kind: Service
metadata:
  name: whoami
  labels:
    app.kubernetes.io/name: whoami
  annotations:
    lbipam.cilium.io/ips: "10.10.100.20"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
