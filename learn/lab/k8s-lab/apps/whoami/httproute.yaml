---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
# https://whoami.lab.merox.dev, once the Gateway exists (module 13).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames: ["whoami.lab.merox.dev"]
  rules:
    - backendRefs:
        - name: whoami
          port: 80
