---
# Module 13. Turn on with:  git mv argocd/later/sealed-secrets.yaml argocd/apps/
#
# No finalizer: the controller's private key lives in a Secret it created.
# Delete the controller with a cascade and that key goes too — and every
# SealedSecret in Git becomes undecryptable. Back the key up (module 13).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  sources:
    - repoURL: https://bitnami-labs.github.io/sealed-secrets
      chart: sealed-secrets
      # helm search repo sealed-secrets/sealed-secrets --versions | head
      targetRevision: 2.17.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/platform/sealed-secrets/values.yaml
    - repoURL: https://github.com/meroxdotdev/k8s-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
