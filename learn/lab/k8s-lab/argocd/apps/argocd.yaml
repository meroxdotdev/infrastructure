---
# ArgoCD manages ArgoCD. bootstrap.sh installed it once with the same chart,
# release name and values; from here an upgrade is a commit to this file.
# Three sources: chart, values, and extra manifests (the HTTPRoute).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 8.0.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: https://github.com/meroxdotdev/k8s-lab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/meroxdotdev/k8s-lab.git
      targetRevision: main
      path: platform/argocd/config
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
