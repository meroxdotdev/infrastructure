---
# An OCI chart: repoURL has no scheme, and the repository is declared with
# enableOCI in platform/argocd/values.yaml (configs.repositories).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-14"
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/coredns/charts
      chart: coredns
      targetRevision: 1.49.0
      helm:
        releaseName: coredns
        valueFiles:
          - $values/platform/coredns/values.yaml
    - repoURL: https://github.com/meroxdotdev/k8s-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
