---
# The only object applied by hand (bootstrap.sh). It points ArgoCD at
# argocd/apps/, and everything in there points at the rest of the repo:
# the "app of apps". Prod's equivalent is kubernetes/flux/cluster/ks.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/meroxdotdev/k8s-lab.git
      targetRevision: main
      path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # A file removed from argocd/apps/ removes that Application.
      prune: true
      selfHeal: true
