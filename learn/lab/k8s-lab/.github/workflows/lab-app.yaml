---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# lab-app, from commit to cluster, with no credentials to the cluster anywhere:
#
#   test ──▶ image (build, push to GHCR, sign) ──▶ deploy (commit the digest)
#                                                        │
#                                  ArgoCD sees the commit ◀┘ and rolls the pods
#
# Pinning: actions/checkout is pinned to a commit SHA like every action in the
# infrastructure repo. The others are on tags — module 16's first task is to
# pin them (Renovate's helpers:pinGitHubActionDigests then keeps them fresh).
name: lab-app

on:
  push:
    branches: [main]
    paths: ["src/lab-app/**", ".github/workflows/lab-app.yaml"]
  pull_request:
    paths: ["src/lab-app/**", ".github/workflows/lab-app.yaml"]

# Never cancel a run halfway through a deploy.
concurrency:
  group: lab-app-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # GHCR names must be lowercase.
  IMAGE: ghcr.io/${{ github.repository_owner }}/lab-app

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/lab-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/lab-app/go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing: GitHub's OIDC token is the identity
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: src/lab-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the one-line manifest change
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes, so it keeps the token. The others never do.
          persist-credentials: true
      - name: Point apps/lab-app at the new digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          f=apps/lab-app/kustomization.yaml
          [ -f "$f" ] || { echo "::notice::$f not found — move apps-later/lab-app first (module 16)"; exit 0; }
          # A digest, not a tag: what ArgoCD deploys is exactly what was signed.
          yq -i '(.images[] | select(.name == "lab-app")) |= (.newName = strenv(IMAGE) | .digest = strenv(DIGEST) | del(.newTag))' "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(lab-app): deploy ${DIGEST:7:12}"
          # Commits made with GITHUB_TOKEN start no new workflow runs: no loop.
          git push
