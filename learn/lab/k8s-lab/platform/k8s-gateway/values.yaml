---
# Prod: kubernetes/apps/network/k8s-gateway/app/helmrelease.yaml. A DNS server
# that answers for lab.merox.dev from the cluster's own HTTPRoutes and
# LoadBalancer Services: create a route, and its name resolves — no DNS record
# to write anywhere.
fullnameOverride: k8s-gateway
serviceType: LoadBalancer
service:
  annotations:
    lbipam.cilium.io/ips: "10.10.100.53"
  externalTrafficPolicy: Cluster
servers:
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: k8s_gateway
        parameters: "lab.merox.dev"
        configBlock: |-
          apex k8s-gateway.network
          ttl 1
          resources Service HTTPRoute
      - name: forward
        parameters: . /etc/resolv.conf
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
