---
# Prod's kubernetes/apps/kube-system/coredns/app/helm/values.yaml, with the
# lab's Service IP and domain. Read the comments there for the merox.dev zones.
fullnameOverride: coredns
image:
  repository: mirror.gcr.io/coredns/coredns
# The label kubelet-era tooling looks for; kubeadm's CoreDNS carries it too.
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  # Must equal clusterDNS in every kubelet's config (CLUSTER_DNS_IP in env.sh):
  # the kubelet writes this address into every pod's /etc/resolv.conf.
  clusterIP: "10.96.0.10"
replicaCount: 2
priorityClassName: system-cluster-critical
servers:
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods verified
          fallthrough in-addr.arpa ip6.arpa
      - name: autopath
        parameters: "@kubernetes"
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        configBlock: |-
          prefetch 20
          serve_stale
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: log
        configBlock: |-
          class error
  # Module 13: let pods resolve *.lab.merox.dev the way your PC does, straight
  # from k8s-gateway — prod's k8s.merox.dev block, for the lab's domain.
  # Uncomment once k8s-gateway runs on 10.10.100.53.
  # - zones:
  #     - zone: lab.merox.dev
  #       scheme: dns://
  #   port: 53
  #   plugins:
  #     - name: errors
  #     - name: forward
  #       parameters: . 10.10.100.53
  #     - name: cache
  #       parameters: 30
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
