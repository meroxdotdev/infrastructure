---
# NOT applied — not listed in kustomization.yaml, and never to be committed
# with real values. Module 14:
#
#   cp garage-credentials.example.yaml /tmp/garage.secret.yaml   # fill in the two keys
#   kubeseal --format yaml < /tmp/garage.secret.yaml > garage-credentials.sealed.yaml
#   rm /tmp/garage.secret.yaml
#
# then list garage-credentials.sealed.yaml in kustomization.yaml and commit.
# The keys come from the end of setup-garage.sh's output.
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  namespace: longhorn-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: GK...
  AWS_SECRET_ACCESS_KEY: "..."
  AWS_ENDPOINTS: http://10.10.0.1:3900
