---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
# Attaches once the `internal` Gateway exists (module 13). Until then its
# status says the parent was not found, and nothing else is wrong.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames: ["hubble.lab.merox.dev"]
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
