---
# The lab's Cilium. Prod's is kubernetes/apps/kube-system/cilium/app/helm/values.yaml
# in the infrastructure repo; every difference here is deliberate, and modules
# 08 and 10 go through them line by line.
#
# Three readers, one file: hardway/07-addons.sh (helm), bootstrap/helmfile.yaml,
# and the `cilium` Application. They cannot drift apart.

# --- reaching the API without kube-proxy ---------------------------------------
# Cilium *is* the service proxy, so it cannot use the `kubernetes` Service to
# find the API — that Service only works once Cilium runs. It needs a real
# address: the keepalived VIP. Prod points at 127.0.0.1:7445, Talos' KubePrism,
# a local load balancer on every node in front of all the apiservers.
k8sServiceHost: 10.10.0.10
k8sServicePort: 6443
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256

# --- addresses and routes --------------------------------------------------------
ipam:
  # Use the /24 that kube-controller-manager gives each node (--allocate-node-cidrs),
  # visible as .spec.podCIDR on the Node. Same as prod.
  mode: kubernetes
# No tunnel: a pod's packet leaves the node with the pod's own address.
routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
# The nodes share one L2 segment, so each installs a route to every other
# node's pod CIDR via that node. BGP (module 10) additionally tells lab-gw.
autoDirectNodeRoutes: true
endpointRoutes:
  enabled: true
bpf:
  # Traffic from a pod to anything outside 10.244.0.0/16 leaves with the
  # node's address, rewritten in eBPF instead of iptables.
  masquerade: true

# --- load balancing ------------------------------------------------------------------
loadBalancer:
  algorithm: maglev
  # Prod runs dsr (direct server return). snat first: easier to reason about.
  # Module 10 has the exercise that switches and shows the difference in tcpdump.
  mode: snat
# Prod announces LoadBalancer IPs with ARP (L2 announcements). The lab uses
# BGP to lab-gw instead — the way it is done in a datacenter.
l2announcements:
  enabled: false
bgpControlPlane:
  enabled: true

# --- ingress: Cilium's Envoy implements Gateway API ---------------------------------------
gatewayAPI:
  enabled: true
envoy:
  rollOutPods: true

# --- observability -------------------------------------------------------------------------
hubble:
  enabled: true
  relay:
    enabled: true
    rollOutPods: true
  ui:
    enabled: true
    rollOutPods: true
  tls:
    auto:
      # Certificates issued by a CronJob in the cluster, not generated by Helm
      # at render time. ArgoCD renders constantly; with the default (helm) it
      # would see brand-new certificates — a diff — on every single pass.
      method: cronJob
  metrics:
    enabled: [dns, drop, tcp, flow, port-distribution, icmp, http]
    # Module 15 turns the ServiceMonitors on, once their CRD exists.
    serviceMonitor:
      enabled: false
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false
operator:
  replicas: 2
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false
# Restart agents when their ConfigMap changes, so a values change takes effect.
rollOutCiliumPods: true
